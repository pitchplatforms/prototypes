    leaders:"One package per design system, versioned with SemVer, is the default shape everywhere multiple apps need to consume the same components — it's how Shopify's, IBM's and Google's systems reach their many apps." },

  { id:"8.4", title:"The stack question: stay on Angular, upgrade, or switch?",
    context:"<b>Today:</b> both web apps run Angular 16 — Angular being the framework (the foundation technology the apps are built on). Version 16 was released in May 2023 and its long-term support ended in November 2024, which means it no longer receives security fixes — on a regulated money platform. It also sits on the older Argon/Bootstrap-4 styling layers. This card is raised as an honest <b>open question</b>, not a push: nothing in this workshop requires a stack change.",
    options:[
      {id:"a",label:"Stay on Angular, upgrade step by step, keep the base framework-neutral",
       desc:"Schedule the upgrade train 16→17→…→current using ng update, Angular's built-in tool that's designed for exactly this kind of incremental hop. Meanwhile, keep the system's foundations portable: tokens stay DTCG JSON (a plain data format any tool can read) and styling stays CSS variables plus a Tailwind preset — both work under <b>any</b> framework, so the system survives any later stack move. Only the component code itself is tied to Angular.",rec:true,
       viz:`<div class="flow101"><span class="f-step">v16<i>today</i></span><span class="f-arrow">→</span><span class="f-step">v17<i>ng update</i></span><span class="f-arrow">→</span><span class="f-step">v18<i>ng update</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--green);background:var(--green-soft);color:var(--green)">current<i>back in security support</i></span></div><span class="viz-cap">Incremental hops, each one a normal ticket — no rewrite, and support coverage returns.</span>`},
      {id:"b",label:"Switch to React/Next",
       desc:"React (the other big framework) has the richest ecosystem and the most AI training data. But switching means a <b>full rewrite of two live apps</b> plus their server-side rendering, with a small team — and the design system you're deciding today would be the first casualty of that churn.",
       viz:`<div style="display:flex;flex-direction:column;gap:5px;font-size:11px;max-width:320px"><div style="display:flex;align-items:center;gap:8px"><span style="width:96px;flex:none;color:var(--muted)">customer app</span><span style="flex:1;height:14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;display:flex;align-items:center;padding:0 7px;font-size:9.5px;font-weight:700;color:var(--accent-ink)">rewrite everything + SSR</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:96px;flex:none;color:var(--muted)">admin app</span><span style="flex:1;height:14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;display:flex;align-items:center;padding:0 7px;font-size:9.5px;font-weight:700;color:var(--accent-ink)">rewrite everything</span></div></div><span class="viz-cap">Two live apps rebuilt from scratch by a small team — the new design system would stall first.</span>`},
      {id:"c",label:"Stay on Angular 16 and do nothing",
       desc:"Zero churn now. But it means running a framework with no security fixes on a money platform, and every passing year makes the eventual jump — whichever direction it goes — bigger and riskier.",
       viz:`<div style="display:flex;flex-direction:column;gap:4px;font-size:10.5px;max-width:300px"><div style="display:flex;align-items:center;gap:8px"><span style="width:52px;flex:none;color:var(--muted)">2026</span><span style="width:60px;height:11px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></span><span style="color:var(--muted)">gap to current</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:52px;flex:none;color:var(--muted)">2027</span><span style="width:110px;height:11px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:52px;flex:none;color:var(--muted)">2028</span><span style="width:170px;height:11px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px"></span><span style="color:var(--accent-ink);font-weight:700;font-size:10px">no security fixes all along</span></div></div><span class="viz-cap">The gap only grows — waiting is a decision with compounding interest.</span>`},
      {id:"d",label:"Wait for a forcing event, keep the option open",
       desc:"Revisit the question when something forces it — hiring gets hard, performance hits a wall, or a critical dependency dies. Viable <b>only</b> combined with option (a)'s framework-neutral base, so that whenever the day comes, most of the system walks across unharmed.",
       viz:`<div class="flow101"><span class="f-step">keep building<i>on the neutral base from (a)</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">forcing event?<i>hiring · performance · dead dependency</i></span><span class="f-arrow">→</span><span class="f-step">then decide<i>tokens + CSS move for free</i></span></div><span class="viz-cap">A deliberate deferral — legitimate only because the base layers stay portable.</span>`}],
    leaders:"Angular 17 and newer added the features — signals, standalone components, built-in server-side rendering, a new template syntax — that closed much of the developer-experience gap that historically pushed teams from Angular to React. And the base layers don't care which framework runs: DTCG JSON tokens and CSS variables port anywhere. Component code is the only locked-in surface.",
    ai:"More AI training data exists for React, but agents follow <b>your enforced system</b> either way — a constrained Angular library with a component registry beats unconstrained React. Enforcement moves AI output quality far more than the framework choice does.",
    workshop:"Give this card 15 minutes, no more. The deliverable is one sentence: does anything here change the design-system plan? The expected answer is no — the base layers are framework-neutral by construction." },
  ]},
{
  id: "assets", num: 9, title: "Design assets", icon: "◈",
  intro: "Icons, illustrations and photos are the visual material that components alone can't provide. Right now nobody owns this layer at pitchIN: there is no official icon set, no illustration style, and campaign images arrive from issuers in whatever shape they were uploaded. The asset-forge skill already exists as the door new assets are generated through — these decisions give it, and every human, the rules.",
  decisions: [

  { id:"9.1", title:"Which icons do we use?",
    context:"<b>Today:</b> there is no owned icon set. Icons arrive with whatever the screen's author happened to reach for — icons bundled with libraries, one-off SVG exports — so the grids (the invisible square each icon is drawn on) and stroke weights (line thickness) are all mixed, and no size or color tokens govern them.",
    options:[
      {id:"a",label:"Adopt one open icon library, colored by our tokens",
       desc:"Pick one free library — Lucide, Phosphor or Material Symbols — and get one consistent grid and stroke across roughly 1,500 concepts, with zero drawing cost. The risk of looking generic is negligible at the tiny sizes icons appear on screen.",
       viz:`<div style="display:flex;gap:14px;align-items:center;color:var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14M13 6l6 6-6 6"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19V5m0 14h16M8 15l4-6 3 3 4-5"/></svg><span style="font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px">~1,500 ready-made</span></div><span class="viz-cap">One grid, one stroke, colors from tokens — everything matches out of the box.</span>`},
      {id:"b",label:"Open library base + our own icons for pitchIN-specific ideas",
       desc:"Everyday icons — search, close, calendar — come from the base library. pitchIN's own domain concepts (campaign, order book, wallet, Shariah flag) get custom icons drawn to the <b>same</b> grid and stroke, generated through asset-forge. Ownership where it differentiates us, zero cost everywhere it doesn't.",rec:true,
       viz:`<div style="display:flex;gap:14px;align-items:center;color:var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);background:var(--green-soft);border-radius:7px;padding:4px 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.75"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 11h18M7 15h3"/></svg><span style="font-size:10px;font-weight:700;color:var(--green)">wallet — ours, same grid</span></span></div><span class="viz-cap">Library glyph or custom glyph, a user can't tell which is which — that's the point.</span>`},
      {id:"c",label:"Draw a fully custom icon set",
       desc:"Everything drawn in-house. Three designers cannot sustain 1,500 icons alongside product work — lovely in year three, fatal in month one.",
       viz:`<div class="ladder" style="max-width:320px"><div class="rung"><span class="bar" style="width:210px">≈1,500 icons needed</span></div><div class="rung"><span class="bar" style="width:74px;background:var(--green-soft);border-color:var(--green);color:var(--green)">3 designers</span><span style="font-size:10.5px">…who also have a product to design</span></div></div><span class="viz-cap">The math never closes — custom-everything starves the actual product work.</span>`}],
    leaders:"Most big design systems standardize one grid — commonly 24px with a 1.5–2px stroke — and add their own domain icons on that same grid. The decision that actually matters is one grid, one stroke and one naming scheme, with color and size always coming from tokens.",
    ai:"A named icon registry (each icon's name plus a line on when to use it) stops agents pasting random SVGs into screens; when a concept is missing, asset-forge generates the new icon on-grid instead." },

  { id:"9.2", title:"Do we have an illustration style — and what is it?",
    context:"<b>Today:</b> there is no illustration language. Empty states (screens that have nothing to show yet) are text-only or improvised, and one-off AI-generated images have started appearing in the product — exactly the drift that asset-forge's anti-slop gate exists to stop.",
    options:[
      {id:"a",label:"No illustrations — type, icons and color only",
       desc:"Choosing this means the product never draws pictures: empty states and moments are handled with words, icons and color alone. Honest and cheap — but it can feel cold at the emotional moments, like a KYC rejection or someone's first successful investment.",
       viz:`<div style="max-width:200px;border:1px solid var(--border);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px"><span style="width:24px;height:24px;border:1.75px solid var(--muted);border-radius:50%;display:inline-block"></span><span style="font-size:10.5px;color:var(--muted)">No investments yet</span></div><span class="viz-cap">Quiet, cheap, never off-brand — and never warm either.</span>`},
      {id:"b",label:"Our own style, generated through asset-forge against a locked recipe",
       desc:"Define <b>one</b> style contract — the geometry, line weight, palette drawn from tokens, and composition do's and don'ts — plus a reviewed sheet of reference examples. Every new illustration, whoever asks for it, is then generated through asset-forge against that contract.",rec:true,
       viz:`<div style="max-width:200px;aspect-ratio:5/2;border:1px solid var(--border);border-radius:8px;background:var(--surface);position:relative;overflow:hidden"><span style="position:absolute;left:14%;top:14%;width:32%;aspect-ratio:1;border-radius:50%;background:#00693722"></span><span style="position:absolute;left:40%;top:26%;width:24%;aspect-ratio:1;border-radius:6px;background:#BF2026;opacity:.85;transform:rotate(12deg)"></span><span style="position:absolute;left:32%;top:62%;width:34%;height:16%;border-radius:999px;background:#006937"></span></div><span class="viz-cap">The recipe: 2–3 geometric shapes in pitch red/green and their tints. Distinctive — and a recipe is something agents can actually follow.</span>`},
      {id:"c",label:"Buy a licensed illustration pack",
       desc:"Fast to adopt — but the style is shared with a thousand other products, and the pack's palette will fight your tokens on every screen it lands on.",

/* ================================================================
   STATE
   ================================================================ */
const LS_KEY = "pitchin-dss-v1";
const ALL_DECISIONS = AREAS.flatMap(a => a.decisions.map(d => ({ ...d, area: a.id, areaNum: a.num, areaTitle: a.title })));

function defaultState() {
  return {
    v: 1,
    decisions: {},   // id -> {status, choice, custom, notes, owner, enf}
    principles: SEED_PRINCIPLES.map(p => ({ ...p })),
    playground: { radius: "5", density: "comfortable", ratio: "1.2", elevation: "shadow", redrole: "single", numerals: "tabular", dark: false, cw: 640 },
    view: "intro",
  };
}
let state = defaultState();
try {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) { const s = JSON.parse(saved); if (s && s.v === 1) state = { ...defaultState(), ...s, playground: { ...defaultState().playground, ...(s.playground||{}) } }; }
} catch (e) {}

let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); flashSave(); } catch (e) {}
  }, 250);
}
function flashSave() {
  const n = document.getElementById("save-note");
  n.textContent = "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  setTimeout(() => { n.textContent = "autosaves locally"; }, 2500);
}
function dstate(id) {
  if (!state.decisions[id]) state.decisions[id] = { status: "open", choice: null, custom: "", notes: "", owner: "", enf: null };
  return state.decisions[id];
}
function isDecided(id) { const s = state.decisions[id]; return !!s && s.status === "decided"; }

function renderNav() {
  navEl.innerHTML = "";
  NAV_ITEMS.forEach(item => {
    if (item.section) {
      const lab = document.createElement("div");
      lab.className = "nav-section-label"; lab.textContent = item.section;
      navEl.appendChild(lab);
    }
    const b = document.createElement("button");
    b.className = state.view === item.id ? "active" : "";
    let inner = "<span>" + item.icon + "</span><span>" + item.label + "</span>";
    if (item.area) {
      const total = item.area.decisions.length;
      const done = item.area.decisions.filter(d => isDecided(d.id)).length;
      const dotCls = done === 0 ? "" : (done === total ? "all" : "some");
      inner = "<span class=\"dot " + dotCls + "\"></span><span>" + item.label + "</span><span class=\"count" + (done===total?" done":"") + "\">" + done + "/" + total + "</span>";
    }
    b.innerHTML = inner;
    b.addEventListener("click", () => { state.view = item.id; persist(); renderAll(); window.scrollTo(0,0); });
    navEl.appendChild(b);
  });
}
function renderProgress() {
  const total = ALL_DECISIONS.length;
  const done = ALL_DECISIONS.filter(d => isDecided(d.id)).length;
  document.getElementById("prog-text").textContent = done + " / " + total;
  document.getElementById("prog-fill").style.width = (total ? (done/total*100) : 0) + "%";
}

/* ================================================================
   RENDER — views
   ================================================================ */
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderAll() { renderNav(); renderProgress(); renderView(); }

function renderView() {
  const v = state.view;
  if (v === "intro") return renderIntro();
  if (v === "guide") return renderGuide();
  if (v === "principles") return renderPrinciples();
  if (v === "playground") return renderPlayground();
  if (v === "export") return renderExport();
  const area = AREAS.find(a => a.id === v);
  if (area) return renderArea(area);
  state.view = "guide"; renderGuide();
}

/* ---------- Principles ---------- */
function renderPrinciples() {
  contentEl.innerHTML = `
  <div class="view-head">
    <div class="eyebrow">Co-creation exercise</div>
    <h2>Principles builder</h2>
    <p>Write each principle as a trade-off — <b>“X, even over Y”</b> — so it tells you what to <i>sacrifice</i>. The test: would a reasonable person argue the other side? If not, it's a platitude — kill it. Each principle must name a real past dispute it would have settled. Four drafts are seeded from pitchIN's actual history; edit or delete them freely.</p>
  </div>
  <div id="principles-list"></div>
  <button class="btn" id="add-principle">+ Add principle</button>`;
  const list = document.getElementById("principles-list");
  state.principles.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "principle";
    el.innerHTML = `
      <div class="p-row">
        <div class="p-num">${i+1}</div>
        <div class="p-fields">
          <input class="p-text" type="text" value="${esc(p.text)}" placeholder="X, even over Y" aria-label="Principle ${i+1}">
          <input class="p-dispute" type="text" value="${esc(p.dispute)}" placeholder="Which real past dispute does this settle?" aria-label="Dispute settled by principle ${i+1}">
          <div class="p-hint">Stress test: does it settle the dispute? Would anyone reasonably argue the reverse?</div>
        </div>
        <button class="p-del" title="Delete principle" aria-label="Delete principle ${i+1}">✕</button>
      </div>`;
    el.querySelector(".p-text").addEventListener("input", e => { p.text = e.target.value; persist(); });
    el.querySelector(".p-dispute").addEventListener("input", e => { p.dispute = e.target.value; persist(); });
    el.querySelector(".p-del").addEventListener("click", () => { state.principles.splice(i,1); persist(); renderPrinciples(); });
    list.appendChild(el);
  });
  document.getElementById("add-principle").addEventListener("click", () => {
    state.principles.push({ text: "", dispute: "" }); persist(); renderPrinciples();
    const inputs = document.querySelectorAll(".p-text"); inputs[inputs.length-1] && inputs[inputs.length-1].focus();
  });
}

function renderCard(d) {
  const s = dstate(d.id);
  const el = document.createElement("div");
  el.className = "dcard" + (s.status === "decided" ? " decided" : s.status === "parked" ? " parked" : "");

  const optHtml = d.options.map(o => `
    <button class="opt ${s.choice === o.id ? "selected" : ""}" data-opt="${o.id}" role="radio" aria-checked="${s.choice === o.id}">
      <span class="radio"></span>
      <span class="opt-body">
        <span class="opt-label">${esc(o.label)} ${o.rec ? '<span class="rec-badge">Suggested</span>' : ""}</span>
        <span class="opt-desc">${o.desc}</span>
        ${o.viz ? `<span class="opt-viz">${o.viz}</span>` : ""}
      </span>
    </button>`).join("");

  el.innerHTML = `
    <div class="dcard-top">
      <span class="dcard-id">${d.id}</span>
      <h3>${esc(d.title)}</h3>
      <div class="status-chips" role="group" aria-label="Status">
        <button class="chip ${s.status==="open"?"on-open":""}" data-st="open">Open</button>
        <button class="chip ${s.status==="decided"?"on-decided":""}" data-st="decided">Decided</button>
        <button class="chip ${s.status==="parked"?"on-parked":""}" data-st="parked">Parked</button>
      </div>
    </div>
    <div class="context"><span class="ctx-label">Where we are today</span>${d.context}</div>
    ${VIZ[d.id] || ""}
    <div class="options" role="radiogroup" aria-label="Options for ${esc(d.title)}">
      ${optHtml}
      <div class="custom-opt">
        <button class="opt ${s.choice === "custom" ? "selected" : ""}" data-opt="custom" style="flex:none;width:auto;padding:10px 12px" role="radio" aria-checked="${s.choice==="custom"}">
          <span class="radio"></span><span class="opt-body"><span class="opt-label">Our own:</span></span>
        </button>
        <input type="text" class="custom-input" placeholder="describe your own direction…" value="${esc(s.custom)}">
      </div>
    </div>
    <div class="meta-row">
      <span class="leaders"><b>How the big names do it:</b> ${d.leaders}${(LINKS[d.id]||[]).length ? `<span class="lead-links">${LINKS[d.id].map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t} ↗</a>`).join("")}</span>` : ""}</span>
      ${d.pg ? `<button class="playground-link" data-pg="${d.pg}">Try it in the Playground →</button>` : ""}
    </div>
    ${d.ai ? `<div class="ai-note"><b>Why this matters for AI:</b> ${d.ai}</div>` : ""}
    ${d.workshop ? `<div class="ai-note" style="border-color:var(--amber);background:var(--amber-soft)"><b style="color:var(--amber)">In the workshop:</b> ${d.workshop}</div>` : ""}
    <div class="dcard-foot">
      <div class="foot-field">
        <label>Why we chose this</label>
        <textarea placeholder="Notes in your own words — they go into the exported decision record…">${esc(s.notes)}</textarea>
      </div>
      <div>
        <div class="foot-field" style="margin-bottom:10px">
          <label>Owner (esp. if parked)</label>
          <input type="text" placeholder="who carries this" value="${esc(s.owner)}">
        </div>
        <div class="foot-field">
          <label>How will we keep this rule?</label>
          <div class="enf-chips" role="group" aria-label="Enforcement">
            <button class="chip ${s.enf==="enforced"?"enf-on":""}" data-enf="enforced">⚙ A machine checks it</button>
            <button class="chip ${s.enf==="prose"?"enf-on":""}" data-enf="prose">✎ Written guidance (DESIGN.md)</button>
          </div>
        </div>
      </div>
    </div>`;

  el.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    s.choice = (s.choice === b.dataset.opt) ? null : b.dataset.opt;
    if (s.choice && s.status === "open") s.status = "decided";
    if (!s.choice && s.status === "decided") s.status = "open";
    persist(); refreshCard(el, d);
  }));
  el.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => {
    s.status = b.dataset.st; persist(); refreshCard(el, d);
  }));
  el.querySelectorAll("[data-enf]").forEach(b => b.addEventListener("click", () => {
    s.enf = (s.enf === b.dataset.enf) ? null : b.dataset.enf; persist(); refreshCard(el, d);
  }));
  const ci = el.querySelector(".custom-input");
  ci.addEventListener("input", e => { s.custom = e.target.value; if (e.target.value && s.choice !== "custom") { s.choice = "custom"; if (s.status==="open") s.status="decided"; refreshCard(el, d, true); } persist(); });
  const pgBtn = el.querySelector("[data-pg]");
  if (pgBtn) pgBtn.addEventListener("click", () => { state.view = "playground"; persist(); renderAll(); window.scrollTo(0,0); });
  return el;
}
function refreshCard(el, d, keepFocus) {
  const fresh = renderCard(d);
  if (keepFocus) {
    // only update classes to avoid stealing focus from the custom input
    el.className = fresh.className;
    el.querySelectorAll("[data-opt]").forEach(b => {
      const twin = fresh.querySelector(`[data-opt="${b.dataset.opt}"]`);
      if (twin) { b.className = twin.className; b.setAttribute("aria-checked", twin.getAttribute("aria-checked")); }
    });
  } else {
    el.replaceWith(fresh);
  }
  renderNav(); renderProgress();
}

      if (cur === val) b.classList.add("on");

        state.playground[key] = (key === "dark") ? (val === "true") : val;
        persist();
        seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        applyPlayground();

    });

    document.getElementById("cw-out").textContent = e.target.value + "px";
    persist();
  });
  applyPlayground();

function applyPlayground() {
  const pg = state.playground;
  const zones = document.querySelectorAll(".pv");
  if (!zones.length) return;
  const ratio = parseFloat(pg.ratio);
  const baseFs = pg.density === "compact" ? 13 : 14.5;
  const space = pg.density === "compact" ? 10 : 16;
  zones.forEach(z => {
    z.classList.toggle("dark", !!pg.dark);
    z.style.setProperty("--pv-radius", pg.radius + "px");
    z.style.setProperty("--pv-space", space + "px");
    z.style.setProperty("--pv-fs", baseFs + "px");
    z.style.setProperty("--pv-h", Math.round(baseFs * ratio * ratio) + "px");
    z.style.setProperty("--pv-num", pg.numerals === "tabular" ? "tabular-nums" : "normal");
    const dark = !!pg.dark;
    const danger = pg.redrole === "split" ? (dark ? "#F06A6A" : "#D64545") : (dark ? "#E8545B" : "#BF2026");
    z.style.setProperty("--pv-danger", danger);
    z.style.setProperty("--pv-shadow", pg.elevation === "border" ? "0 0 0 1px " + (dark ? "#3B3531" : "#e0dcd7") : (dark ? "0 4px 32px rgba(0,0,0,.5)" : "0px 4px 32px 0px rgba(0,0,0,.16)"));
  });
}

/* ---------- Export ---------- */
function slug(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

function buildMarkdown() {
  const now = new Date().toISOString().slice(0,10);
  const total = ALL_DECISIONS.length;
  const decided = ALL_DECISIONS.filter(d => isDecided(d.id));
  const parked = ALL_DECISIONS.filter(d => dstate(d.id).status === "parked");
  let md = `# pitchIN Design System — Decision Record\n\n`;
  md += `> Generated by the Design System Decision Studio on ${now}.\n`;
  md += `> Status: ${decided.length}/${total} decided, ${parked.length} parked.\n`;
  md += `> This file is AI-readable: agents building pitchIN UI must honor every DECIDED entry.\n> Enforcement column: "machine" rules must be encoded in lint/types/tokens/CI — do not restate them as prose once encoded.\n\n`;
  md += `## Design principles\n\n`;
  const prins = state.principles.filter(p => p.text.trim());
  if (prins.length) prins.forEach((p,i) => { md += `${i+1}. **${p.text.trim()}**`; if (p.dispute.trim()) md += `\n   - Settles: ${p.dispute.trim()}`; md += `\n`; });
  else md += `_None finalized yet._\n`;
  md += `\n`;
  AREAS.forEach(a => {
    md += `## ${a.num}. ${a.title}\n\n`;
    a.decisions.forEach(d => {
      const s = dstate(d.id);
      const st = s.status.toUpperCase();
      md += `### ${d.id} ${d.title} — ${st}\n\n`;
      if (s.status === "decided" && s.choice) {
        const opt = s.choice === "custom" ? { label: "Custom: " + (s.custom || "(unspecified)") } : d.options.find(o => o.id === s.choice);
        md += `- **Decision:** ${opt ? opt.label : "?"}\n`;
        if (s.choice !== "custom") {
          const o = d.options.find(o => o.id === s.choice);
          if (o) md += `- **Meaning:** ${o.desc.replace(/<[^>]+>/g,"")}\n`;
        }
      } else if (s.status === "parked") {
        md += `- **Parked.**${s.owner ? " Owner: " + s.owner : " (no owner — assign one)"}\n`;
      } else {
        md += `- **Not yet decided.**\n`;
      }
      if (s.notes.trim()) md += `- **Rationale:** ${s.notes.trim()}\n`;
      if (s.enf) md += `- **Enforcement:** ${s.enf === "enforced" ? "machine (encode in lint/types/tokens/CI)" : "prose (DESIGN.md guidance)"}\n`;
      if (s.owner.trim() && s.status !== "parked") md += `- **Owner:** ${s.owner.trim()}\n`;
      md += `\n`;
    });
  });
  md += `## Machine-enforcement backlog\n\nEvery decision marked "machine" — each becomes an engineering ticket:\n\n`;
  const enf = ALL_DECISIONS.filter(d => dstate(d.id).enf === "enforced");
  if (enf.length) enf.forEach(d => { md += `- [ ] ${d.id} ${d.title}\n`; });
  else md += `_None marked yet._\n`;
  return md;
}

    color: {

        green: { $value: "#006937", $type: "color", $description: "Brand secondary / success. Approved." },
      },
      status: {
        danger: { $value: split ? "#D64545" : "#BF2026", $type: "color", $description: split ? "Distinct danger red — decision 3.5: brand red no longer doubles as danger." : "Currently aliases brand red (decision 3.5 pending or 'one red' chosen)." },
        success: { $value: "#006937", $type: "color" },
        warning: { $value: "#E18437", $type: "color" },

        gain: { $value: "#0A994A", $type: "color" },
      } : { $description: "Not split — brand red carries loss semantics (revisit 3.5)." },
    },
    typography: {
      fontFamily: { display: { $value: "Poppins" }, body: { $value: "Inter" } },
      scaleRatio: { $value: ratio, $description: "Decision 3.6 — generates the named role sizes below (rounded, then hand-frozen)." },
      roles: {
        "display": { $value: round2(1 * ratio ** 4) + "rem" },
        "heading-lg": { $value: round2(1 * ratio ** 3) + "rem" },
        "heading-md": { $value: round2(1 * ratio ** 2) + "rem" },
        "heading-sm": { $value: round2(1 * ratio) + "rem" },
        "body": { $value: "1rem" },

      },

      },

    elevation: {
      style: { $value: pg.elevation, $description: pg.elevation === "border" ? "Flat + borders (admin-friendly, dark-mode-safe)." : "Shadow-based; MUST pair with surface-color tokens for dark mode (decision 3.8)." },

    },

async function offerDownload(filename, data) {
  // Self-contained static build: standard browser download, no Claude runtime capability.
  const text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  try {
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast("Saved " + filename); return;
  } catch (e) {
    try { await navigator.clipboard.writeText(text); toast("Download blocked — copied to clipboard instead"); }
    catch (e2) { toast("Could not save or copy — select from the preview below"); }
  }
}

    </div>

    </div>
  </div>

  document.getElementById("dl-md").addEventListener("click", () => offerDownload("DESIGN-DECISIONS.md", buildMarkdown()));
  document.getElementById("cp-md").addEventListener("click", async () => { try { await navigator.clipboard.writeText(buildMarkdown()); toast("Markdown copied"); } catch(e){ toast("Copy failed"); } });

  document.getElementById("cp-tokens").addEventListener("click", async () => { try { await navigator.clipboard.writeText(buildTokensDraft()); toast("Tokens JSON copied"); } catch(e){ toast("Copy failed"); } });
  document.getElementById("dl-state").addEventListener("click", () => offerDownload("pitchin-workshop-state.json", JSON.stringify(state, null, 2)));
  document.getElementById("ld-state").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s || s.v !== 1 || typeof s.decisions !== "object") { toast("Not a valid studio state file"); return; }
        state = { ...defaultState(), ...s, playground: { ...defaultState().playground, ...(s.playground||{}) } };
        persist(); renderAll(); toast("State loaded");
      } catch (err) { toast("Could not parse that file"); }
    };
    r.readAsText(f);
  });
  document.getElementById("reset-all").addEventListener("click", () => {
    if (confirm("Reset ALL decisions, notes, and principles? Download the state file first if unsure.")) {
      state = defaultState(); persist(); renderAll(); toast("Reset");
    }
  });

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.getElementById("btn-goto-export").addEventListener("click", () => { state.view = "export"; persist(); renderAll(); window.scrollTo(0,0); });
document.getElementById("btn-export-state").addEventListener("click", () => offerDownload("pitchin-workshop-state.json", JSON.stringify(state, null, 2)));

renderAll();
</script>
