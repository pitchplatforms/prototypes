      {id:"a",label:"Bless the current 4px base and 8px rhythm as-is",
       desc:"Ratify what is already there — zero migration. But with only raw numbers to reach for, a genuine compact mode for the admin app stays impossible.",
       viz:`<div style="display:flex;align-items:flex-end;gap:10px"><div style="text-align:center"><div style="width:30px;height:4px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">4</div></div><div style="text-align:center"><div style="width:30px;height:8px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">8</div></div><div style="text-align:center"><div style="width:30px;height:16px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">16</div></div><div style="text-align:center"><div style="width:30px;height:24px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">24</div></div><div style="text-align:center"><div style="width:30px;height:32px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">32</div></div></div><span class="viz-cap">The numbers exist — but every screen just picks whichever it likes.</span>`},
      {id:"b",label:"Keep the 4px numbers, add named aliases on top",rec:true,
       desc:"The raw scale (4, 8, 12, 16…) stays, and named aliases like space.inline.sm and space.stack.md sit on top — describing what a gap is <b>for</b> rather than how big it is. That indirection is exactly what turns the admin app's compact mode into a token swap instead of a redesign: “medium stack gap” simply points at a smaller number in compact mode.",
       viz:`<div class="flow101"><span class="f-step" style="font-family:var(--font-mono)">space.stack.md<i>“the gap between stacked items”</i></span><span class="f-arrow">→</span><span class="f-step">16px<i>comfortable — customer app</i></span><span class="f-arrow">/</span><span class="f-step" style="border-color:var(--green);color:var(--green)">8px<i>compact — admin app</i></span></div><span class="viz-cap">Same alias, different number per density mode — that one indirection is the whole compact-AdminWeb trick.</span>`},
      {id:"c",label:"Move to a strict 8px grid",
       desc:"A coarser, simpler rhythm — but it fights the existing components, which are all built on a 4px grain.",
       viz:`<div style="display:flex;align-items:flex-end;gap:10px"><div style="text-align:center"><div style="width:30px;height:8px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">8</div></div><div style="text-align:center"><div style="width:30px;height:16px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">16</div></div><div style="text-align:center"><div style="width:30px;height:24px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">24</div></div><div style="text-align:center"><div style="width:30px;height:32px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px">32</div></div></div><span class="viz-cap">Cleaner rhythm on paper — but today's components are built on a 4px grain and would fight it.</span>`}],
    leaders:"IBM's Carbon spaces everything in multiples of 2, 4 and 8, and nearly every major system lands in the same place: a 4-based scale with an 8-point rhythm, plus semantic aliases layered on top for density.",
    pg:"density" },

  { id:"3.8", title:"How rounded and soft should things feel?",
    context:"<b>Today:</b> Corner-rounding is chaos — the tokens say 3, 5 and 10px, but 5px is hardcoded in 65 places, the old Argon theme injects 0.375rem, and one-off screens use 10px. Shadows: there is exactly one signature card shadow (0 4px 32px #00000029), no elevation levels, and shadows like that simply vanish in dark mode.",
    options:[
      {id:"a",label:"Sharp and institutional: 2–4px corners, borders over shadows",
       desc:"Square-ish corners and crisp borders instead of shadows — serious, dense, bank-like. It suits trust surfaces like wallets and ledgers, but can feel cold on the discovery and campaign pages.",
       viz:`<div style="background:var(--surface);border:1px solid var(--border-strong);border-radius:2px;padding:11px;max-width:220px"><div style="font-size:11px;font-weight:600">Sharp 2px</div><div style="font-size:10px;color:var(--muted);margin-top:2px">crisp borders, no shadow</div></div><span class="viz-cap">Institutional and bank-like — all business.</span>`},
      {id:"b",label:"Keep today's look — but tokenize and enforce it",rec:true,
       desc:"Roughly the current personality (soft 5px-ish corners, soft cards, the signature shadow), cleaned up into 3–4 official radius steps with no more hardcoding. Elevation becomes at most 3 levels, each defined as a shadow <b>plus</b> a surface-color pair — the pairing is what keeps depth readable in dark mode, where shadows alone disappear.",
       viz:`<div style="background:var(--surface);border-radius:5px;padding:11px;max-width:220px;box-shadow:0 4px 18px rgba(0,0,0,.13)"><div style="font-size:11px;font-weight:600">Current 5px</div><div style="font-size:10px;color:var(--muted);margin-top:2px">signature soft shadow</div></div><span class="viz-cap">Today's look, kept — but as 3–4 enforced tokens instead of 65 hardcoded copies.</span>`},
      {id:"c",label:"Soft and consumer: 10–16px corners, pill buttons",
       desc:"Friendly, modern-fintech in the Revolut direction. A deliberate, visible brand shift — not a cleanup.",
       viz:`<div style="background:var(--surface);border-radius:14px;padding:11px;max-width:220px;box-shadow:0 4px 18px rgba(0,0,0,.13)"><div style="font-size:11px;font-weight:600">Soft 14px</div><div style="font-size:10px;color:var(--muted);margin-top:2px">pill buttons, consumer-fintech</div></div><span class="viz-cap">Friendly and Revolut-ish — a visible change of personality.</span>`}],
    leaders:"Google's Material 3 tokenizes corner shape all the way from “none” to “full” and pairs every elevation shadow with a surface tint — precisely because shadows barely read in dark mode. Shopify's Polaris and IBM's Carbon go flat with borders on dense admin surfaces.",
    pg:"radius",
    workshop:"This one is a 20-second gut test, not a debate — flip the radius options in the Playground, silent-score, done." },
  ]
},
{
  id: "components", num: 4, title: "Component strategy", icon: "▣",
  intro: "Components are the reusable building blocks of our screens — buttons, cards, tables — and @pitchin/ui is the shared library we plan to keep them in. That library is designed but not built: ADR-0003 chose a direction (accessible behaviour borrowed from headless CDK/Spartan parts, our own Tailwind styling on top, a pin- name prefix, and a component manifest) and then stopped at the plan. Zero components have shipped, so every card here is a fresh decision — the ADR is an input to confirm or change, not something already installed.",
  decisions: [
  { id:"4.1", title:"What earns a place in the shared component library?",
    context:"<b>Today:</b> there is no library yet, so nothing has been admitted anywhere. About 25 legacy shared components (named agmo-* or app-*) live inside the product apps, and the team has shipped 6 different modal (pop-up dialog) implementations. Whatever rule we pick here governs @pitchin/ui from component #1.",
    options:[
      {id:"a",label:"Anything used in more than one place goes in",
       desc:"Choosing this means the library accepts every shared piece of UI, big or small. It feels generous, but the library quickly becomes a dumping ground and whoever maintains it drowns in half-finished parts.",
       viz:`<div style="border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">
         <span style="border:1px solid var(--border-strong);border-radius:999px;padding:2px 8px;font-size:10.5px">Button</span>
         <span style="border:1px solid var(--border-strong);border-radius:999px;padding:2px 8px;font-size:10.5px">Card</span>
         <span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600">Modal ×6</span>
         <span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600">SignupForm</span>
         <span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600">KYCWizard</span>
         <span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600">CampaignHero</span>
         <span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600">Footer</span>
         <span style="font-size:11px;color:var(--muted)">…</span>
       </div><span class="viz-cap">One library, one owner, everything anyone ever shared — the orange pieces are page-sized things that don't belong.</span>`},
      {id:"b",label:"Small building blocks in, whole pages out — with an entry test",
       desc:"Choosing this means the library ships small, general parts (Button, Field, Card, Table) while whole page sections stay in the product apps — as the saying goes, no design system ships a SignupForm. To get in, a part must appear at least 3 times or in 2 apps, have a stable way of being used, and have a named owner. That keeps the library small enough to actually maintain, at the cost of saying no sometimes.",rec:true,
       viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
         <div style="flex:1;min-width:150px;border:1px solid var(--green);background:var(--green-soft);border-radius:8px;padding:7px 9px">
           <div style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:4px">In the library</div>
           <span style="border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:600">Button</span>
           <span style="border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:600">Field</span>
           <span style="border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:600">Card</span>
           <span style="border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:600">Table</span>
         </div>
         <div style="flex:1;min-width:150px;border:1px solid var(--border-strong);border-radius:8px;padding:7px 9px">
           <div style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Stays in the app</div>
           <span style="border:1px solid var(--border-strong);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-size:10.5px">Signup form</span>
           <span style="border:1px solid var(--border-strong);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-size:10.5px">KYC flow</span>
           <span style="border:1px solid var(--border-strong);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-size:10.5px">Campaign page</span>
         </div>
       </div><span class="viz-cap">Entry test: seen 3+ times (or in 2 apps) + stable usage + a named owner.</span>`},
      {id:"c",label:"Also publish written patterns for whole flows",
       desc:"Choosing this means the library additionally documents how bigger flows should be built — written guidance for things like the KYC steps, the way Shopify's Polaris and Atlassian do. It's genuinely useful, but it's real writing effort, and it makes more sense once the basic parts exist. Good later; heavy now.",
       viz:`<div class="flow101"><span class="f-step">Button, Card, Table<i>code in the library</i></span><span class="f-arrow">+</span><span class="f-step">“How to build a KYC flow”<i>written guidance, not code</i></span><span class="f-arrow">+</span><span class="f-step">“How to confirm a withdrawal”<i>written guidance, not code</i></span></div><span class="viz-cap">Everything in option B, plus documentation for whole flows — more to write and keep current.</span>`}],
    leaders:"The “rule of three” — a part must show up three times before it's promoted — is the standard entry test across the industry. But fintech design systems make one important exception: parts like MoneyAmount, PercentChange, OrderStatusBadge and ConfirmDangerDialog go into the system even if they're used only once, because they encode compliance and trust rules that must never be rebuilt slightly differently on each screen.",
    ai:"A clear entry rule tells AI agents when to propose a new shared component instead of quietly hand-writing their own markup — which is exactly how the 6 duplicate modals happened." },
  { id:"4.2", title:"Components: one part with settings, or building blocks?",
    context:"<b>Today:</b> there is nothing to inherit — ADR-0003 sketches a settings-style pin-button (with variant and size options) on paper only, and the legacy components follow no pattern at all. Whatever we pick here becomes the pattern before component #1 is written.",
    options:[
      {id:"a",label:"Settings style: one component, many options",
       desc:"Choosing this means each component is one part you configure with a few named settings — like ordering from a menu. It's very hard to use wrongly, which is its strength. The catch: over the years the list of settings tends to balloon, and unusual layouts can't be expressed at all.",
       viz:`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 10px;font-family:var(--font-mono);font-size:11px;line-height:1.7">&lt;pin-button variant="danger"<br>&nbsp;&nbsp;size="sm"&gt;Withdraw&lt;/pin-button&gt;</div><span class="mini-btn" style="background:#BF2026;color:#fff">Withdraw</span></div><span class="viz-cap">One line of settings, one predictable result — hard to get wrong.</span>`},
      {id:"b",label:"Building-blocks style: assemble from smaller pieces",
       desc:"Choosing this means components come as small pieces you snap together yourself (a Card made of a CardHeader, a CardBody, and so on). Very flexible for unusual screens — but more typing, more ways to assemble it wrongly, and AI agents improvise more when given open-ended pieces.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 10px;font-family:var(--font-mono);font-size:11px;line-height:1.7;display:inline-block">&lt;pin-card&gt;<br>&nbsp;&nbsp;&lt;pin-card-header&gt;…<br>&nbsp;&nbsp;&lt;pin-card-body&gt;…<br>&lt;/pin-card&gt;</div><span class="viz-cap">Snap-together pieces — flexible, but every screen assembles them a little differently.</span>`},
      {id:"c",label:"Both: building blocks inside, simple settings outside",
       desc:"Choosing this means the library is built from flexible pieces internally (using Angular's content projection), but everyday users — juniors and AI agents alike — only touch the simple settings-style wrapper. You get the safety of option A for daily work and the flexibility of option B when the library itself needs it.",rec:true,
       viz:`<div style="display:flex;flex-direction:column;gap:4px;max-width:420px"><div style="border:1px solid var(--green);background:var(--green-soft);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--green)"><b style="font-family:var(--font-mono)">&lt;pin-button variant="danger"&gt;</b> — what everyone writes, every day</div><div style="text-align:center;color:var(--muted);font-size:11px;line-height:1">▲ built from</div><div style="border:1px dashed var(--border-strong);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--muted)">small flexible pieces — used only inside the library's own source</div></div><span class="viz-cap">Simple on the outside, flexible on the inside.</span>`}],
    leaders:"Radix and shadcn (popular React libraries) are building-blocks-first; MUI and Shopify's Polaris lean on the settings style. The 2025–26 observation from teams working with AI: constrained, settings-style components are what agents use <b>correctly</b> — open-ended assembly invites drift." },
  { id:"4.3", title:"Lock the option names now, or let each component choose?",
    context:"<b>Today:</b> ADR-0003 proposes the naming lists variant: primary/secondary/outline/ghost and size: sm/md/lg — but that's a proposal; nothing is built or enforced yet. Agreeing the words <b>before</b> the first component ships is strictly cheaper than renaming things after.",
    options:[
      {id:"a",label:"One fixed vocabulary, agreed in this workshop, enforced by the code",
       desc:"Choosing this means every component uses the same three short lists of allowed words: variant = primary/secondary/outline/ghost/danger, size = sm/md/lg, tone/status = success/warning/danger/info. Yes/no settings are allowed only for genuinely on-or-off things (named with is/has). TypeScript (the checker built into our code) and a lint rule reject anything outside the lists, so you learn the pattern once and never check the docs again.",rec:true,
       viz:`<div style="display:flex;flex-direction:column;gap:5px;font-size:12px">
         <div><b style="font-family:var(--font-mono);font-size:11px;color:var(--teal)">variant</b>&nbsp; <span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">primary</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">secondary</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">outline</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">ghost</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px">danger</span></div>
         <div><b style="font-family:var(--font-mono);font-size:11px;color:var(--teal)">size</b>&nbsp; <span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">sm</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">md</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px">lg</span></div>
         <div><b style="font-family:var(--font-mono);font-size:11px;color:var(--teal)">tone</b>&nbsp; <span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">success</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">warning</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;margin-right:2px">danger</span><span style="border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;font-size:10.5px">info</span></div>
       </div><span class="viz-cap">The whole vocabulary fits on one page — and typing <b>variant="main"</b> becomes a build error, not a habit.</span>`},
      {id:"b",label:"Each component names its own options, caught in review",
       desc:"Choosing this means every component's author picks their own words and a human reviewer tries to keep them consistent. It feels flexible, but the vocabulary drifts one component at a time until three components say the same thing three ways.",
       viz:`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <span class="mini-btn" style="background:#BF2026;color:#fff">Invest</span><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--muted)">variant="primary"</span>
         <span class="mini-btn" style="background:#BF2026;color:#fff">Invest</span><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--amber)">type="main"</span>
         <span class="mini-btn" style="background:#BF2026;color:#fff">Invest</span><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--amber)">kind="brand"</span>
       </div><span class="viz-cap">The same red button, named three different ways by three different authors — this is what drift looks like.</span>`}],
    leaders:"MUI's documented rule: use a fixed list when the choices exclude each other (it makes invalid combinations impossible), and a yes/no setting only when options can combine. A fixed vocabulary is also a strong AI guardrail — an agent physically cannot invent type=\"main\" if the type system only knows the approved list.",
    workshop:"Write the three lists of allowed words on one page in the room; that page goes into DESIGN.md word for word." },
  { id:"4.4", title:"Where do new components get their behaviour and their look?",
    context:"<b>Today:</b> FOUR styling systems coexist in the apps: Tailwind 3.4 (with its reset turned off), the Argon/Creative-Tim theme sitting on Bootstrap 4, Angular Material 16, and ng-bootstrap. A typical component today is an Argon base class decorated with tw- utility classes on top. DESIGN.md already bans adding a fifth system.",
    options:[
      {id:"a",label:"Borrow the behaviour, own the look (the ADR-0003 plan)",
       desc:"Choosing this means new components take their behaviour — keyboard handling, focus, screen-reader support — from proven “headless” libraries (CDK and Spartan: components that come with working behaviour but no visual styling), and we paint them entirely with our own tokens via a Tailwind preset. New components never import Argon or Bootstrap, and any screen we touch gradually sheds them. Best control for the effort — but note it was chosen on paper only, so ratify it here before component #1 is written.",rec:true,
       viz:`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
         <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:3px"><div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--accent-ink);font-weight:600">Tailwind 3.4 utilities</div><div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--accent-ink);font-weight:600">Angular Material 16</div><div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--accent-ink);font-weight:600">ng-bootstrap</div><div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--accent-ink);font-weight:600">Argon on Bootstrap 4</div></div>
         <div style="align-self:center;color:var(--muted);font-weight:700">→</div>
         <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:3px"><div style="background:var(--green-soft);border:1px solid var(--green);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--green);font-weight:600">Behaviour: CDK / Spartan (headless)</div><div style="background:var(--green-soft);border:1px solid var(--green);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--green);font-weight:600">Look: our tokens + Tailwind preset</div></div>
       </div><span class="viz-cap">From today's four-layer cake to two layers: behaviour borrowed, look fully ours. Touched screens sunset the old layers.</span>`},
      {id:"b",label:"Adopt Angular Material wholesale and re-theme it",
       desc:"Choosing this means using Google's ready-made Material components everywhere and painting them in pitchIN colours. It's the fastest route to a full component set — but Material's own opinions come with it into every screen, and it fights both our Tailwind preset and the brand.",
       viz:`<div style="display:flex;flex-direction:column;gap:3px;max-width:340px"><div style="background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--ink-2);font-weight:600">Angular Material — Google's components, Google's opinions</div><div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--accent-ink);font-weight:600">a thin coat of pitchIN colour on top</div></div><span class="viz-cap">Fastest to ship — but every screen inherits Material's look-and-feel underneath the paint.</span>`},
      {id:"c",label:"Hand-build everything ourselves, behaviour included",
       desc:"Choosing this means writing every component from scratch — visuals and behaviour. Maximum control, but the accessibility work (keyboard support, focus handling, screen readers) is enormous and unending for a small team.",
       viz:`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600">the look ✓</span><span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600">keyboard navigation — ours to build</span><span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600">focus trapping — ours</span><span style="background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600">screen-reader wiring — ours</span></div><span class="viz-cap">Everything in orange is invisible work that headless libraries would have given us for free.</span>`}],
    leaders:"Use of headless component libraries grew about 70% in 2025. And shadcn's ownership idea — the component source code lives in <b>your</b> repo, readable by humans and AI agents, with no upgrade treadmill — carries over to Angular even though the code itself doesn't." },
  { id:"4.5", title:"Build dedicated components for money and trust moments?",
    context:"<b>Today:</b> money amounts, percentage changes, order statuses, and “are you sure?” confirmations are each re-hand-rolled on every screen — and that is precisely where trust bugs live. Real example: a wallet balance showing RM 0 while the real number is still loading.",
    options:[
      {id:"a",label:"Build a “trust kit” of first-class components",
       desc:"Choosing this means the sensitive displays become dedicated components with the rules baked in: MoneyAmount (evenly-spaced digits, currency rules, never shows 0 while loading), PercentChange (gain/loss colouring), OrderStatusBadge (the 7 campaign statuses), ConfirmDangerDialog (which knows the reversibility ladder), and EmptyState/ErrorState with the content template built in. Slightly more upfront work, and every screen gets the rules for free.",rec:true,
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
         <span style="font-variant-numeric:tabular-nums;font-weight:650;font-size:15px">RM 24,180.00</span>
         <span style="color:var(--green);font-weight:600;font-size:12.5px">▲ +4.2%</span>
         <span style="background:var(--green-soft);color:var(--green);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px">Live</span>
         <span style="background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px">Pending</span>
         <span style="display:inline-block;width:74px;height:15px;border-radius:4px;background:linear-gradient(90deg,var(--border),var(--surface-2),var(--border))"></span>
       </div><span class="viz-cap">MoneyAmount · PercentChange · OrderStatusBadge · and the loading shimmer that means “never show RM 0 while a balance loads”.</span>`},
      {id:"b",label:"Write the rules down, but keep the code in each app",
       desc:"Choosing this means publishing guidance only and letting each screen implement it. Lighter to start — but the entire point of these pieces is that they encode rules which must not fork, and guidance alone doesn't stop forking.",
       viz:`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
         <span style="font-variant-numeric:tabular-nums;font-size:13px;font-weight:600">RM 24,180.00</span>
         <span style="font-size:13px;font-weight:600;color:var(--amber)">RM24180</span>
         <span style="font-size:13px;font-weight:600;color:var(--accent)">RM 0.00 <i style="font-size:10px;font-weight:400;color:var(--muted)">(still loading…)</i></span>
       </div><span class="viz-cap">Three screens, three hand-rolled money displays — the written rule existed; the forks happened anyway.</span>`}],
    leaders:"Banking design systems treat the display of money as a component contract, not a formatting habit each developer remembers.",
    ai:"Each trust component collapses a page of written rules into one instruction — “use &lt;pin-money-amount&gt;” — the cheapest possible thing to tell an AI agent." },
  ]},
{
  id: "content", num: 5, title: "Content & voice", icon: "❝",
  intro: "This area is about the words on our screens — how pitchIN sounds, how it explains errors, and which product terms we use. None of it is written down today: no voice guide, no error template, no shared glossary. For a regulated money platform that matters more than it sounds, because the words are part of our compliance surface.",
  decisions: [
  { id:"5.1", title:"How should pitchIN sound when it talks to users?",
    context:"<b>Today:</b> there is no voice document. The tone of any given screen depends on whoever wrote it — human or AI.",
    options:[
      {id:"a",label:"A one-page voice guide: 3–4 traits, each with a “say this, not that” pair",
       desc:"Choosing this means writing one page that pins down 3–4 personality traits, each illustrated with a good-vs-bad example, plus a tone rule for the three moments that matter most in fintech: moving money (calm and precise), KYC and identity checks (patient, never accusing), and failures (honest, always showing a way forward). One page is enough to align the humans and to paste into an AI agent's prompt.",rec:true,
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 12px;font-size:12.5px;max-width:460px">
         <div style="font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);margin-bottom:4px">Trait: clear over clever</div>
         <div style="color:var(--green)">✓ “RM 500 has arrived in your wallet.”</div>
         <div style="color:var(--accent-ink)">✗ “Cha-ching! Funds have landed 🎉”</div>
       </div><span class="viz-cap">One trait, one say-this-not-that pair — times three or four, that's the whole page.</span>`},
      {id:"b",label:"A full voice-and-tone matrix for every situation",
       desc:"Choosing this means the Atlassian-grade version: a grid mapping every situation to its exact tone. It's excellent — and heavy to produce as a first step. A good destination, a poor starting point.",
       viz:`<table class="mini" style="max-width:420px"><thead><tr><th>Situation</th><th>Tone</th><th>Example</th></tr></thead><tbody>
         <tr><td>Money moves</td><td>calm, precise</td><td style="color:var(--muted)">…</td></tr>
         <tr><td>KYC check</td><td>patient</td><td style="color:var(--muted)">…</td></tr>
         <tr><td>Failure</td><td>honest</td><td style="color:var(--muted)">…</td></tr>
         <tr><td style="color:var(--muted)">…30 more rows</td><td style="color:var(--muted)">…</td><td style="color:var(--muted)">…</td></tr>
       </tbody></table><span class="viz-cap">Thorough — and a real writing project before the first row helps anyone.</span>`},
      {id:"c",label:"Skip it for now",
       desc:"Choosing this means leaving tone to each writer. The known cost: AI-generated copy keeps drifting in tone — which is one of the inconsistency sources this workshop exists to fix.",
       viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
         <div style="border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink-2)">“Deposit successful.”</div>
         <div style="border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink-2)">“Woohoo! You just topped up 💸”</div>
       </div><span class="viz-cap">The same event, written by two different authors on two different days — with no voice guide, both are “correct”.</span>`}],
    leaders:"Atlassian publishes voice principles plus tone-by-context guidance; Shopify's Polaris ships voice, grammar, and vocabulary rules inside the design system itself; and the Nielsen Norman Group's advice is that content standards belong <b>in</b> the design system, not beside it." },
  { id:"5.2", title:"What should an error message be required to contain?",
    context:"<b>Today:</b> the team already has a rule — every validation error gets its own code and its own message, never a generic catch-all — but it lives in feedback memory, not in the design system.",
    options:[
      {id:"a",label:"A required template plus a unique code on every error",
       desc:"Choosing this means every error follows the same anatomy — what happened, why, and what to do next — shown right where the failure occurred, and carrying its own error code so support can trace it. Plus one money-flow addendum: an error must NEVER leave the user unsure whether money moved (“your payment did not go through — you have not been charged”).",rec:true,
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 12px;font-size:12.5px;max-width:480px">
         <div style="color:var(--accent-ink);font-weight:600">ERR-2043 · Below the RM 500 minimum for this campaign.</div>
         <div style="color:var(--ink-2);margin-top:3px">Enter RM 500 or more. You have not been charged.</div>
       </div><span class="viz-cap"><b>code</b> (so support can trace it) + <b>what happened</b> + <b>what to do next</b> + <b>certainty about the money</b> — all four parts, one message.</span>`},
      {id:"b",label:"The template, but without the codes",
       desc:"Choosing this means the messages read well but carry no code. That silently drops the support-desk traceability the team already committed to — when a user calls in, nobody can tell which of a dozen similar checks fired.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 12px;font-size:12.5px;max-width:480px">
         <div style="color:var(--accent-ink);font-weight:600">Below the RM 500 minimum for this campaign.</div>
         <div style="color:var(--ink-2);margin-top:3px">Enter RM 500 or more. You have not been charged.</div>
       </div><span class="viz-cap">Reads exactly as well — but when a user calls support, there's no code to look up which check fired.</span>`},
      {id:"c",label:"No standard — write each error freely",
       desc:"Choosing this keeps today's situation. The failure mode is concrete: “Something went wrong” on a payment screen is a trust incident, because the user cannot tell whether their money moved.",
       viz:`<div style="border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--accent-ink);max-width:480px;font-weight:600">Something went wrong. Please try again.</div><span class="viz-cap">On a payment screen. Was I charged? The message doesn't know either.</span>`}],
    leaders:"Atlassian's error-message guideline: say what happened, with empathy, and ALWAYS with a way forward. The practical move is to ship this as a pair — an ErrorState component and its content template together." },
  { id:"5.3", title:"Do we need one shared dictionary of product words?",
    context:"<b>Today:</b> each code repo has its own CONTEXT.md glossary, written for developers. And the equity/token/note renaming (a UI-only change) is exactly a dictionary rule with a scope — but there is no unified product glossary anywhere.",
    options:[
      {id:"a",label:"One product glossary in the design system, plus a banned-words list",
       desc:"Choosing this means building a single dictionary of approved product terms — seeded from the CONTEXT.md files and the equity/token/note renaming decision — together with a list of words we must not use. Under Securities Commission regulation, “invest” vs “trade” vs “pledge” carry legal weight, and approved-terms lists are standard practice in regulated industries.",rec:true,
       viz:`<table class="mini" style="max-width:460px"><thead><tr><th>Term</th><th>Use it for</th></tr></thead><tbody>
         <tr><td><b>invest</b></td><td>putting money into an equity (ECF) campaign</td></tr>
         <tr><td><b>trade</b></td><td>buying/selling tokens on the market</td></tr>
         <tr><td style="color:var(--accent-ink);text-decoration:line-through">pledge</td><td style="color:var(--accent-ink)">banned — carries the wrong legal meaning</td></tr>
       </tbody></table><span class="viz-cap">One page every designer, writer, and AI agent reads before choosing a word.</span>`},
      {id:"b",label:"Keep the per-repo developer glossaries only",
       desc:"Choosing this means relying on the existing CONTEXT.md files. They serve engineers well — but designers and the AI agents writing screen copy never open them, so the words on screen keep drifting.",
       viz:`<div class="flow101"><span class="f-step">pitchinAPI / CONTEXT.md<i>engineers read it</i></span><span class="f-step">CustomerWeb / CONTEXT.md<i>engineers read it</i></span><span class="f-arrow">✗</span><span class="f-step" style="border-style:dashed;color:var(--muted)">designers &amp; copy-writing agents<i>never see any of them</i></span></div><span class="viz-cap">The knowledge exists — just not where the people choosing the words can find it.</span>`}],
    leaders:"Shopify's Polaris publishes words-to-use and words-to-avoid lists as part of the design system, and regulated fintechs routinely maintain compliance-approved term lists.",
    ai:"AI agents writing UI copy read the glossary file directly — it is the difference between consistent terminology and improvised terminology." },
  ]},
{
  id: "governance", num: 6, title: "Governance & operations", icon: "⚙",
  intro: "This area is about keeping the design system alive after the workshop: who owns it, how changes get in, and how you can tell whether anyone is actually using it. None of these decisions produce a screen — but without them, everything decided today quietly decays within a quarter.",
  decisions: [
  { id:"6.1", title:"Who owns the system, and how do others contribute?",
    context:"<b>Today:</b> the system moves only when one person (Nicholas plus AI) pushes it forward. The three designers use what comes out, but they have no defined way to contribute to it.",
    options:[
      {id:"a",label:"A small named core, plus an easy path for everyone else",rec:true,
       desc:"Two named owners — one design lead and one engineer — have the final say. Everyone else (the three designers, the engineers, even AI agents) contributes through a simple two-step path: open a proposal, the core reviews it. Small fixes like a typo or a token value bump skip the queue and go straight in as a normal code change.",
       viz:`<div class="flow101"><span class="f-step">anyone proposes<i>3 designers · engineers · agents</i></span><span class="f-arrow">→</span><span class="f-step">two-step intake<i>proposal → core review</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--green);background:var(--green-soft);color:var(--green)">core decides<i>1 design owner + 1 eng owner</i></span></div><span class="viz-cap">Small fixes (a typo, a token value bump) skip the queue and go straight to a pull request.</span>`},
      {id:"b",label:"A dedicated design-system team",
       desc:"A team whose full-time job is the design system. That is how the biggest companies run theirs — but it needs headcount pitchIN doesn't have, and everything would queue behind that one team.",
       viz:`<div class="flow101"><span class="f-step">every request</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">dedicated team<i>headcount you don't have</i></span><span class="f-arrow">→</span><span class="f-step">queue</span></div>`},
      {id:"c",label:"Fully open — anyone changes anything",
       desc:"No core owners at all; every contributor edits the system directly. Nathan Curtis, who championed open contribution, later called this exact setup without a core team “a mistake” — someone has to hold the line.",
       viz:`<div class="flow101"><span class="f-step">anyone edits directly</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">no core review</span><span class="f-arrow">→</span><span class="f-step">three versions of every rule</span></div>`}],
    leaders:"Nathan Curtis — the most-cited writer on design-system teams — found that the systems that survive always have both things at once: a small central team that holds the line, and an open, documented path for everyone else to contribute. The path should be lighter for small changes than for big ones.",
    workshop:"Name the two owners in this workshop, before the first component ships. Then extend the protected-path idea the team already uses (ADR-0009): the token files and DESIGN.md become protected paths with named owners." },
  { id:"6.2", title:"How do we number versions and retire old parts?",
    context:"<b>Today:</b> nothing is versioned, because nothing is published yet. ADR-0003 already sketches component statuses (active / candidate / sunset / archived) and renaming aliases — so deciding the versioning story now means the very first release, v0.1.0, ships versioned from day one.",
    options:[
      {id:"a",label:"One version number for the whole library, with a polite retirement process",rec:true,
       desc:"The whole @pitchin/ui library shares one version number using SemVer (a numbering scheme like 2.1.0, where the first number only changes when something breaks), plus a changelog people can read. Anything being retired is first marked @deprecated in the code — meaning “still works, but on its way out” — at least one release before removal, is only actually removed at a major version, and always ships with migration notes. AI agents read those @deprecated tags and simply stop using the component — the cheapest AI win in this whole area.",
       viz:`<div class="flow101"><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">v1.2<i>marked @deprecated</i></span><span class="f-arrow">→</span><span class="f-step">v1.3<i>still works, warns</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">v2.0<i>removed + migration note</i></span></div><span class="viz-cap">Agents stop using it at the @deprecated tag; humans get a full release of warnings.</span>`},
      {id:"b",label:"A separate version number per component",
       desc:"Every component gets its own version. Atlassian ran this model before 2023 and walked it back — every consuming app ends up juggling a version matrix.",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><span style="border:1px solid var(--border-strong);border-radius:999px;font-family:var(--font-mono);font-size:10.5px;padding:3px 10px;color:var(--ink-2)">Button v3.1</span><span style="border:1px solid var(--border-strong);border-radius:999px;font-family:var(--font-mono);font-size:10.5px;padding:3px 10px;color:var(--ink-2)">Table v1.8</span><span style="border:1px solid var(--border-strong);border-radius:999px;font-family:var(--font-mono);font-size:10.5px;padding:3px 10px;color:var(--ink-2)">Modal v2.4</span><span style="border:1px solid var(--border-strong);border-radius:999px;font-family:var(--font-mono);font-size:10.5px;padding:3px 10px;color:var(--ink-2)">Badge v5.0</span><span style="border:1px solid var(--border-strong);border-radius:999px;font-family:var(--font-mono);font-size:10.5px;padding:3px 10px;color:var(--muted)">…</span></div><span class="viz-cap">Which combination is safe together? Every app has to know — Atlassian tried this and consolidated away.</span>`},
      {id:"c",label:"No versions — everyone tracks the latest code",
       desc:"No releases; every app just follows the newest code. That works while there is only one app, but breaks the moment the admin app wants to consume the library at its own slower pace.",
       viz:`<div class="flow101"><span class="f-step">latest code<i>always moving</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--green);background:var(--green-soft);color:var(--green)">customer app<i>updates weekly · fine</i></span></div><div class="flow101" style="margin-top:6px"><span class="f-step">same code</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">admin app<i>updates monthly · breaks</i></span></div>`}],
    leaders:"One version number for the whole system, with every change clearly communicated, is the industry norm — Nathan Curtis wrote the standard piece on it (“Versioning Design Systems”)." },
  { id:"6.3", title:"How will we know the system is actually being used?",
    context:"<b>Today:</b> verify:tokens checks that the token files stay in sync, and the June 2026 audit hand-counted 706+ hardcoded hex colors — but that count was a one-off. Nothing tells you whether things are getting better or worse over time.",
    options:[
      {id:"a",label:"An automatic count in the code checks, tracked over time",rec:true,
       desc:"A script inside CI (the automatic checks that run on every code change) counts hardcoded colors and spacing versus proper token usage — per app, per change, trending down on a chart. It doubles as your AI-drift detector: if the number ticks back up, an agent (or a human) just bypassed the system, and you see it within one pull request.",
       viz:`<div class="viz-frame" style="padding:8px 10px"><svg viewBox="0 0 260 56" width="260" height="56" style="max-width:100%;display:block"><line x1="6" y1="10" x2="254" y2="10" stroke="var(--amber)" stroke-dasharray="4 3"/><polyline points="6,16 46,21 86,20 126,28 166,35 206,41 254,46" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;margin-top:3px"><span style="color:var(--accent);font-weight:600">hardcoded hexes per app</span><span style="color:var(--amber);font-weight:600">- - lint gate: no new ones</span></div></div>`},
      {id:"b",label:"The code count, plus Figma's own usage statistics",
       desc:"Everything in option A, plus Figma library analytics to see whether the designers are using the shared components too. Worth adding — but only once the Figma libraries are tidy enough to measure.",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><span style="background:var(--green-soft);color:var(--green);border:1px solid var(--green);border-radius:999px;font-size:11px;font-weight:600;padding:4px 11px">code scan in CI ✓</span><span style="background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:999px;font-size:11px;font-weight:600;padding:4px 11px">+ Figma library analytics — needs tidy libraries first</span></div>`},
      {id:"c",label:"Go by feel",
       desc:"No measurement — just a sense that the screens look consistent. The June 2026 audit scored the current state 55 out of 100 using exactly this method.",
       viz:`<div class="viz-frame" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--ink-2);font-style:italic">“Looks consistent enough to me?”</span><span style="background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;font-size:11px;font-weight:700;padding:3px 10px">audit score: 55 / 100</span></div>`}],
    leaders:"Established teams measure adoption from real code — counting library imports, or what share of rendered components come from the system. The hotel-software company Mews built its adoption metrics straight from production data." },
  { id:"6.4", title:"Which is the master copy — the code or Figma?",
    context:"<b>Today:</b> the code is the de-facto master copy (brand-tokens.ts, owner-approved). The Figma connection is live and AI can read design files through it, but tokens don't actually sync in either direction yet.",
    options:[
      {id:"a",label:"The code is the master; Figma gets updated automatically",rec:true,
       desc:"The master token file lives in the code repository, and a pipeline pushes every change into Figma as design variables, automatically. This team is engineering- and AI-heavy: a file in Git gets a pull-request review before anything changes, which a Figma edit never does — and the AI agents work in the repo. Designers still get every variable, refreshed for free.",
       viz:`<div class="flow101"><span class="f-step">tokens.json<i>in the repo · PR-reviewed</i></span><span class="f-arrow">→</span><span class="f-step">Style Dictionary<i>the generator</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--green);background:var(--green-soft);color:var(--green)">Figma variables<i>auto-updated</i></span></div><span class="viz-cap">A Figma edit without a code change never ships — truth flows one way.</span>`},
      {id:"b",label:"Figma is the master; the code is exported from it",
       desc:"Designers edit variables in Figma, and a tool (typically Tokens Studio) exports them into the code. Designer-led companies work this way — but here the designers are three of roughly ten contributors, and the AI agents live in the repo, not in Figma.",
       viz:`<div class="flow101"><span class="f-step">Figma variables<i>designers edit</i></span><span class="f-arrow">→</span><span class="f-step">Tokens Studio<i>exports to Git</i></span><span class="f-arrow">→</span><span class="f-step">code repo</span></div>`},
      {id:"c",label:"Both ways at once",
       desc:"Changes can start on either side and sync in both directions via Tokens Studio. The most flexible option — and the most machinery, with a real risk of sync conflicts once there are effectively two master copies.",
       viz:`<div class="flow101"><span class="f-step">code repo</span><span class="f-arrow">⇄</span><span class="f-step">Figma</span><span style="background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:999px;font-size:10.5px;font-weight:700;padding:3px 9px">two masters — conflicts possible</span></div>`}],
    leaders:"Figma variables don't sync with code out of the box in either direction — you need a pipeline regardless. Teams point that pipeline in the direction of their bigger discipline: engineering-led companies push code into Figma, designer-led ones push Figma into code." },
  ]},
{
  id: "ai", num: 7, title: "Making AI follow the system", icon: "✳",
  intro: "This is the differentiating layer — and the reason this studio exists. The unanimous finding across 2025–26: AI agents reliably follow rules that are enforced by tools, and drift away from rules that are merely written down as advice. Every decision card in this studio carries an enforcement toggle for exactly that reason.",
  decisions: [
  { id:"7.1", title:"What file format lets AI read our tokens directly?",
    context:"<b>Today:</b> tokens live in TypeScript, SCSS and Tailwind files — machine-readable in principle, but each in its own homegrown shape. The asset-forge skill keeps its own hand-copied JSON version that verify:tokens doesn't check.",
    options:[
      {id:"a",label:"One standard tokens.json file; everything else generated from it",rec:true,
       desc:"One canonical tokens.json in the repo, written in DTCG format (the emerging web-standard file format for design tokens), with every other format generated from it. An agent can parse that file with zero guesswork, and the Figma connection covers design-side reads. This pairs with decision 3.1 — the two should land together.",
       viz:`<div class="viz-frame" style="font-family:var(--font-mono);font-size:11px;line-height:1.7;overflow-x:auto;white-space:nowrap">{ "color": { "action": { "primary": { "$value": "#BF2026" } } } }</div><span class="viz-cap">An agent reads this loss-free — no guessing, no drift.</span>`},
      {id:"b",label:"Tokens live in Figma; AI fetches them over the connection",
       desc:"The master tokens stay in Figma, and agents fetch values through the Figma MCP connection (the live bridge that lets AI read our design files). That puts the source of truth behind an API call for every agent working in the code — the wrong way round for this team.",
       viz:`<div class="flow101"><span class="f-step">agent in the repo</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">Figma API call<i>on every single read</i></span><span class="f-arrow">→</span><span class="f-step">token value</span></div>`},
      {id:"c",label:"Written documentation only",
       desc:"Tokens are described in prose docs. Agents then re-derive the values from the text and drift — this is exactly how #c00000 ended up used 6.6 times more often than the official brand red.",
       viz:`<div class="viz-frame" style="font-size:11.5px"><span style="font-style:italic;color:var(--ink-2)">“Our primary red is a warm, confident red…”</span>&nbsp; <span style="font-family:var(--font-mono);font-size:11px;color:var(--accent-ink)">→ agent ships #c00000</span></div>`}],
    leaders:"Figma's own 2025 position says the same thing: expose tokens and components as structured data, so agents apply tokens automatically and reuse existing components instead of inventing new ones." },
  { id:"7.2", title:"Where do the AI agents' instructions live?",
    context:"<b>Today:</b> pitchIN already runs the 2026 pattern — a design-system/DESIGN.md file plus a design-gate skill — which puts it ahead of most teams. But it's informal: DESIGN.md currently mixes hard rules, component inventory and general prose in one document.",
    options:[
      {id:"a",label:"Three small files, each with one job",rec:true,
       desc:"Split the instructions: DESIGN.md keeps only the hard rules (use semantic tokens; use these exact variant names; check the registry before creating any component), a component registry lists what exists with one line on when to use each, and tokens.json holds the values. Validate the result against Google's DESIGN.md linter (published April 2026).",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1;min-width:104px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px;font-size:10.5px"><b style="font-family:var(--font-mono);font-size:10.5px">DESIGN.md</b><div style="color:var(--muted);margin-top:2px">hard rules only · ~1 page</div></div><div style="flex:1;min-width:104px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px;font-size:10.5px"><b style="font-family:var(--font-mono);font-size:10.5px">components.json</b><div style="color:var(--muted);margin-top:2px">what exists + when to use it</div></div><div style="flex:1;min-width:104px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px;font-size:10.5px"><b style="font-family:var(--font-mono);font-size:10.5px">tokens.json</b><div style="color:var(--muted);margin-top:2px">the values</div></div></div>`},
      {id:"b",label:"Put everything into CLAUDE.md",
       desc:"Write every design rule directly into CLAUDE.md, the file every AI session loads automatically. Simple — but it bloats every session, because the design rules load even when the agent is doing backend work.",
       viz:`<div style="border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 11px;font-size:10.5px;max-width:320px"><b style="font-family:var(--font-mono);font-size:10.5px">CLAUDE.md</b> <span style="color:var(--accent-ink)">rules + inventory + prose + everything else</span></div><span class="viz-cap">Loads into every session — even when the agent is fixing a backend job.</span>`},
      {id:"c",label:"Skills only, no standing document",
       desc:"Rely on skills (task-specific instruction packs an agent loads on demand) with no permanent document. But the rules need a durable home that survives whichever skill happens to load — a document is that home.",
       viz:`<div class="flow101"><span class="f-step">session starts<i>skill not loaded</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">no rules present</span><span class="f-arrow">→</span><span class="f-step">agent improvises</span></div>`}],
    leaders:"The field consensus is to keep AI instruction files short and rule-shaped, not essay-shaped — and never to restate in prose what a linter (an automatic rule-checker in the build) already enforces." },
  { id:"7.3", title:"Enforce rules with tools, or write them as advice?",
    context:"<b>Today:</b> one enforcement exists almost by accident — the Tailwind preset makes stock classes like tw-bg-red-500 produce no CSS at all — plus verify:tokens and the design-gate skill. There are no linter rules (automatic rule-checkers that fail the build) protecting the tokens yet.",
    options:[
      {id:"a",label:"Enforcement first: machines check every rule they can",rec:true,
       desc:"Wherever a rule can be checked by a machine, encode it as one: linters ban raw hex colors, raw pixel values and arbitrary tw-[…] values; TypeScript types make an invalid variant a compile error; a token-coverage scan gates CI. Prose is kept for genuine judgment calls only. Every decision in this workshop then gets triaged — ENFORCEABLE (encode it in lint, types or tokens) versus JUDGMENT (write it in DESIGN.md) — using the toggle on every card; that triage is a first-class output of this studio.",
       viz:`<div class="viz-frame" style="font-family:var(--font-mono);font-size:11px;line-height:1.9;overflow-x:auto;white-space:nowrap"><div><span style="color:var(--muted)">background:</span> <span style="color:var(--accent-ink);text-decoration:line-through">#c00000</span>&nbsp; <span style="color:var(--accent);font-weight:700">✗ no-raw-hex — use a semantic token</span></div><div><span style="color:var(--muted)">background:</span> var(--color-action-primary)&nbsp; <span style="color:var(--green);font-weight:700">✓ passes</span></div></div><span class="viz-cap">The build fails before any human even looks — a rule an agent cannot drift from.</span>`},
      {id:"b",label:"Written guidelines plus review culture",
       desc:"Write the rules down and trust people to apply them in review. That works for a small human team; AI agents demonstrably drift from rules that are merely suggested.",
       viz:`<div class="viz-frame" style="font-size:11.5px;line-height:1.7"><div style="color:var(--ink-2);font-style:italic">DESIGN.md: “Please use semantic tokens where possible.”</div><div style="font-family:var(--font-mono);font-size:11px;margin-top:4px"><span style="color:var(--muted)">background:</span> #c00000 &nbsp;<span style="color:var(--green);font-weight:700">✓ merged anyway</span></div></div><span class="viz-cap">Nothing failed, because nothing checked — the rule was only advice.</span>`}],
    leaders:"The 2025–26 findings are unanimous: the reliable stack is types + linters + CI gates. Teams that report AI faithfully reproducing their design system share the same traits — constrained component options, one canonical token file, enforcement gates, and the rule that whoever generates the work never grades it.",
    workshop:"End the workshop by reading back the enforcement column: everything the room marked “enforce” becomes an engineering ticket." },
  { id:"7.4", title:"How does an AI find out which components exist?",
    context:"<b>Today:</b> no registry exists — ADR-0003 sketches a hand-maintained component-manifest.json for the not-yet-built library. Starting fresh is an advantage here: the registry can be generated automatically from day one instead of retrofitted later.",
    options:[
      {id:"a",label:"An index file generated automatically from the library itself",rec:true,
       desc:"A components.json index — name, purpose, options, do/don't, status — regenerated by CI from the @pitchin/ui source code, so it can never go stale. Agents search it before building any UI (the pattern shadcn's registry proved, here in Angular form); the Figma connection covers the design side.",
       viz:`<div class="viz-frame" style="font-family:var(--font-mono);font-size:11px;line-height:1.8;overflow-x:auto;white-space:nowrap;color:var(--ink-2)">{"name":"<span style="color:var(--teal)">pin-money-amount</span>","status":"<span style="color:var(--green)">active</span>",<br>&nbsp;"dont":"<span style="color:var(--accent-ink)">never hand-roll currency formatting</span>"}</div><span class="viz-cap">Rebuilt on every code change — agents check here first, which is what stops the seventh modal.</span>`},
      {id:"b",label:"A list somebody maintains by hand",
       desc:"The hand-maintained manifest sketched in ADR-0003. Cheap to start — but hand-maintained lists go stale silently, and this one certainly will.",
       viz:`<div class="viz-frame" style="font-family:var(--font-mono);font-size:11px;line-height:1.8;overflow-x:auto;white-space:nowrap;color:var(--ink-2)">{"name":"pin-old-badge","status":"<span style="color:var(--green)">active</span>"} <span style="font-family:var(--font-body);color:var(--amber);font-weight:600;font-size:10.5px">← deleted in March; nobody updated the file</span></div>`},
      {id:"c",label:"No index — AI reads the component code directly",
       desc:"It works, but the agent burns a large slice of its working memory on every task just finding out what exists — a registry is the cheap index.",
       viz:`<div class="ladder"><div class="rung"><span class="bar" style="width:236px">read every component's source</span><span>burned on every task</span></div><div class="rung"><span class="bar" style="width:84px;background:var(--green-soft);border-color:var(--green);color:var(--green)">1 index file</span><span>what a registry costs</span></div></div>`}],
    leaders:"shadcn's registry + MCP setup is the emerging pattern for this: a component library that AI agents can query directly instead of rediscovering." },
  { id:"7.5", title:"How do we catch AI-built screens going off-system?",
    context:"<b>Today:</b> the bones are strong — the design-gate skill grades built screens against DESIGN.md, ADR-0009 encodes that a producer never judges its own work, and the screen-smoke tests are protected files. What's missing: a trend metric and broader coverage.",
    options:[
      {id:"a",label:"An automated loop built from the checks that already run",rec:true,
       desc:"Extend what exists into one loop: token-coverage linting, a render smoke test (does the screen actually draw?), and the design-gate skill grading the finished screen — plus the adoption trend from decision 6.3 as the drift alarm. The agent that builds a screen never grades it.",
       viz:`<div class="flow101"><span class="f-step">agent builds</span><span class="f-arrow">→</span><span class="f-step">lint + types gate</span><span class="f-arrow">→</span><span class="f-step">render smoke</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--teal);background:var(--teal-soft);color:var(--teal)">design-gate grades<i>builder ≠ judge · ADR-0009</i></span><span class="f-arrow">→</span><span class="f-step">trend metric</span></div><span class="viz-cap">Every step but the metric already runs in the pitchIN brain today — this extends, it doesn't invent.</span>`},
      {id:"b",label:"A human reviews every screen",
       desc:"Human design review only. It doesn't scale to the volume AI produces — which is the original problem this whole area exists to solve.",
       viz:`<div class="flow101"><span class="f-step">agents ship screens daily</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">one human reviewer<i>the bottleneck</i></span><span class="f-arrow">→</span><span class="f-step">growing backlog</span></div>`},
      {id:"c",label:"Screenshot-compare every screen on every change",
       desc:"Full visual-regression testing (screenshotting every screen on every change and flagging any pixel that moved). The gold standard, but high-maintenance; add it later, screen by screen, for the money-critical surfaces only.",
       viz:`<div class="flow101"><span class="f-step">every change</span><span class="f-arrow">→</span><span class="f-step">screenshot every screen</span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">pixel-diff review<i>flaky · high upkeep</i></span></div>`}],
    leaders:"Teams that report AI faithfully reproducing their design system all separate generation from verification — the agent that builds is never the one that judges." },
  ]},
{
  id: "adoption", num: 8, title: "Adoption & migration", icon: "➜",
  intro: "A design system nobody actually moves onto is just a document. This group of decisions is about how the two live apps get from where they are today onto the new system — without freezing product work while it happens. The goal is a plan where cleanup rides along with normal tickets instead of competing with them.",
  decisions: [

  { id:"8.1", title:"How does the admin app catch up?",
    context:"<b>Today:</b> the admin app (PitchinAdminWeb) has no design tokens and no component library. Its color configuration was copied by hand from the customer app years ago and has drifted since, and its Argon stylesheet even carries an off-brand red — <b>$primary: #c00000</b>. That red is documented as needing its own ticket; it must never be silently fixed in passing.",
    options:[
      {id:"a",label:"Fix the colors first, then upgrade screens as we touch them",
       desc:"Step one is a single ticket that points the admin app at the same <b>generated</b> token output everything else uses — that one move kills both the drifted hand-copy and the #c00000. Step two: from then on, any screen that gets opened up for normal product work must adopt the shared @pitchin/ui components while it's open. No big-bang rewrite, ever.",rec:true,
       viz:`<div class="flow101"><span class="f-step">Step 1 — token bridge<i>one ticket, admin app reads generated tokens</i></span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:16px;height:16px;border-radius:4px;background:#c00000;display:inline-block;position:relative"><span style="position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--ink);transform:rotate(-20deg)"></span></span><span class="f-arrow">→</span><span style="width:16px;height:16px;border-radius:4px;background:#BF2026;display:inline-block"></span></span><span class="f-arrow">→</span><span class="f-step">Step 2 — every touched screen adopts @pitchin/ui<i>rides normal product tickets</i></span></div><span class="viz-cap">The wrong red dies in one ticket; the component migration then travels with product work for free.</span>`},
      {id:"b",label:"Retheme the whole admin app in one big push",
       desc:"Everything converts at once in a dedicated project. That means weeks of pure churn on a back-office app — high risk of breaking screens ops relies on, and zero product value shipped while it runs.",
       viz:`<div style="display:flex;flex-direction:column;gap:5px;font-size:11px"><div style="display:flex;align-items:center;gap:8px"><span style="width:74px;flex:none;color:var(--muted)">retheme</span><span style="flex:1;max-width:260px;height:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:var(--accent-ink)">weeks of churn</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:74px;flex:none;color:var(--muted)">product work</span><span style="color:var(--amber);font-weight:600;font-size:10.5px">⏸ paused the whole time</span></div></div><span class="viz-cap">A rewrite quarter on a back-office app: all risk, nothing new shipped.</span>`},
      {id:"c",label:"Only new screens use the system",
       desc:"New admin screens are built with the library; existing screens are left alone. But old screens never die on their own — so the two-apps-two-styles problem just persists indefinitely.",
       viz:`<div style="display:flex;gap:10px;align-items:stretch;font-size:10.5px"><div style="flex:1;max-width:180px;border:1px solid var(--green);background:var(--green-soft);border-radius:7px;padding:7px 9px"><b>New screen</b><br><span class="mini-btn" style="background:#BF2026;color:#fff;margin-top:4px">Approve</span></div><div style="flex:1;max-width:180px;border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--muted)"><b>Old screen</b><br><span class="mini-btn" style="background:#c00000;color:#fff;margin-top:4px">Approve</span></div><div style="align-self:center;color:var(--amber);font-weight:700;font-size:10.5px">…side by side, for years</div></div><span class="viz-cap">Without a rule for touched screens, the off-brand half never shrinks.</span>`}],
    leaders:"An additive, backward-compatible migration — never breaking what already exists — is the governance philosophy pitchIN has already written down in ADR-0003. This option just applies it to the admin app." },

  { id:"8.2", title:"How do we clean up 706+ hardcoded colors?",
    context:"<b>Today:</b> the customer app contains 706+ color values typed straight into the code instead of coming from tokens. The wrong red #c00000 appears 73 times — 6.6× more often than the official brand red. There are also 65 hardcoded 5px corner radii, 180+ raw animation timings, and 49 scattered z-index values (the numbers that decide which element sits on top of which).",
    options:[
      {id:"a",label:"Stop new ones from day one, clean old ones as we go",
       desc:"A lint rule (an automatic code check — the enforcement from decision 7.3) blocks any <b>new</b> hardcoded value from day one. Any file someone touches for other work must convert its old ones while it's open, and the metric from decision 6.3 tracks the total going down. No dedicated cleanup sprint needed.",rec:true,
       viz:`<div style="position:relative;display:flex;align-items:flex-end;gap:8px;height:64px;max-width:280px"><div style="position:absolute;left:0;right:0;top:4px;border-top:2px dashed var(--amber)"></div><div style="width:26px;height:56px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div><div style="width:26px;height:46px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div><div style="width:26px;height:37px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div><div style="width:26px;height:28px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div><div style="width:26px;height:20px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div><div style="width:26px;height:13px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px 3px 0 0"></div></div><span class="viz-cap"><b>706+ and falling.</b> The dashed line is the lint gate: no new hardcoded values get in, touched files convert as they're touched, and the trend line is the only schedule the cleanup needs.</span>`},
      {id:"b",label:"Dedicated cleanup tickets, module by module",
       desc:"Schedule the conversion as its own tickets, one module at a time. The count falls faster — but the same few people are doing product work, so cleanup competes with it. Works well <b>combined</b> with (a) for the worst files.",
       viz:`<div class="flow101"><span class="f-step">cleanup ticket: wallet module<i>convert 112 hexes</i></span><span class="f-arrow">vs</span><span class="f-step" style="border-color:var(--amber);background:var(--amber-soft);color:var(--amber)">product ticket<i>waiting on the same people</i></span></div><span class="viz-cap">Faster burn-down, but every cleanup ticket displaces a product ticket.</span>`},
      {id:"c",label:"Leave the old code alone; only the new library is strict",
       desc:"The @pitchin/ui library stays perfectly clean, but nothing in the existing screens ever changes — so every screen users actually see keeps contradicting the system.",
       viz:`<div style="display:flex;gap:10px;align-items:center;font-size:10.5px"><div style="border:1px solid var(--green);background:var(--green-soft);border-radius:7px;padding:7px 10px"><b>The library</b><br><span class="mini-btn" style="background:#BF2026;color:#fff;margin-top:4px">token red ✓</span></div><span style="font-weight:800;color:var(--accent);font-size:15px">≠</span><div style="border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--muted)"><b>The live screens</b><br><span class="mini-btn" style="background:#c00000;color:#fff;margin-top:4px">#c00000 ×73</span></div></div><span class="viz-cap">A pure library nobody's screens follow is a museum piece.</span>`}],
    leaders:"Every successful adoption story works the same ratchet way: block new regressions automatically, convert old code opportunistically as it gets touched, and measure the trend. Nobody cleans 706 values in a heroic sprint." },

  { id:"8.3", title:"Where should the shared code live?",
    context:"<b>Today:</b> ADR-0003 plans to build the @pitchin/ui component library <b>inside</b> the customer app's repo (projects/pitchin-ui, packaged with ng-packagr). Nothing is built yet, so changing that plan is free today. The catch with living inside the customer app: the admin app can't use the library at all unless it gets published somewhere both apps can install it from.",
    options:[
      {id:"a",label:"Publish it as a private package both apps install",
       desc:"@pitchin/ui becomes a versioned private package, and the token repo feeds both apps from one source. This is the only option that actually serves the admin app, and it pairs naturally with the SemVer version-numbering scheme from decision 6.2.",rec:true,
       viz:`<div style="font-size:11px;max-width:300px"><div style="border:1px solid var(--green);background:var(--green-soft);border-radius:6px;padding:5px 9px;font-weight:600;color:var(--green);text-align:center">@pitchin/ui — private package (v1.4.0)</div><div style="display:flex;gap:10px;margin-top:5px"><div style="flex:1;text-align:center"><div style="color:var(--green);font-weight:700;line-height:1">↓</div><div style="border:1px solid var(--border-strong);border-radius:6px;padding:4px 6px">customer app</div></div><div style="flex:1;text-align:center"><div style="color:var(--green);font-weight:700;line-height:1">↓</div><div style="border:1px solid var(--border-strong);border-radius:6px;padding:4px 6px">admin app</div></div></div></div><span class="viz-cap">One versioned artifact, two consumers — an update is an npm bump, not an archaeology dig.</span>`},
      {id:"b",label:"Build it inside the customer app; the admin app copies patterns",
       desc:"Cheapest to start, but the admin app can only benefit by copy-pasting code across repos — and copying is exactly how today's drifted config and #c00000 were born.",
       viz:`<div style="font-size:11px;max-width:300px"><div style="border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;font-weight:600">library inside the customer app</div><div style="display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--accent-ink)"><span style="flex:1;border-top:2px dashed var(--accent)"></span><span style="font-size:10px;font-weight:700">copy-paste</span><span style="flex:1;border-top:2px dashed var(--accent)"></span></div><div style="border:1px solid var(--border);border-radius:6px;padding:5px 9px;margin-top:5px;color:var(--muted)">admin app (outside, drifting)</div></div><span class="viz-cap">This is the drift path — the same one that produced the #c00000 config.</span>`},
      {id:"c",label:"Merge all the frontends into one monorepo",
       desc:"One repo holding every frontend is structurally the cleanest end state — but it's also the biggest re-plumbing of CI pipelines and deployments. Worth revisiting later; don't make the design system wait for it.",
       viz:`<div style="font-size:11px;max-width:320px"><div style="border:1px dashed var(--border-strong);border-radius:8px;padding:7px 9px"><b style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">one monorepo</b><div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap"><span style="border:1px solid var(--border);border-radius:5px;padding:3px 7px">customer app</span><span style="border:1px solid var(--border);border-radius:5px;padding:3px 7px">admin app</span><span style="border:1px solid var(--border);border-radius:5px;padding:3px 7px">@pitchin/ui</span></div></div><div style="margin-top:5px"><span style="display:inline-block;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:999px;font-size:10px;font-weight:700;padding:3px 9px">first: rebuild all CI + deploy pipelines</span></div></div><span class="viz-cap">Cleanest shape, heaviest toll gate — a later decision, not a blocker.</span>`}],
