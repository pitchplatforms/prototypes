<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>pitchIN Design System Decision Studio</title>
</head>
<body>
<title>pitchIN Design System Decision Studio</title>
<style>
  :root {
    --ground: #FAF9F7;
    --surface: #FFFFFF;
    --surface-2: #F3F1EE;
    --ink: #23201F;
    --ink-2: #55504C;
    --muted: #857E78;
    --border: #E8E4E0;
    --border-strong: #D6D0CA;
    --accent: #BF2026;
    --accent-soft: #FBEBEC;
    --accent-ink: #A11B20;
    --green: #006937;
    --green-soft: #E7F3EC;
    --amber: #B05E1E;
    --amber-soft: #FAEDDA;
    --teal: #2D898B;
    --teal-soft: #E3F2F2;
    --shadow: 0 1px 2px rgba(35,32,31,.05), 0 8px 24px rgba(35,32,31,.06);
    --shadow-lg: 0 4px 32px rgba(0,0,0,.13);
    --radius: 8px;
    --font-display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #171412;
      --surface: #211D1B;
      --surface-2: #2A2523;
      --ink: #F2EEEA;
      --ink-2: #C9C2BB;
      --muted: #9A928A;
      --border: #35302C;
      --border-strong: #4A443F;
      --accent: #E8545B;
      --accent-soft: #3A2224;
      --accent-ink: #F0868B;
      --green: #4CB878;
      --green-soft: #1E2F26;
      --amber: #E09B54;
      --amber-soft: #35291B;
      --teal: #5FB8BA;
      --teal-soft: #1C2E2E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg: 0 4px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"] {
    --ground: #FAF9F7; --surface: #FFFFFF; --surface-2: #F3F1EE; --ink: #23201F; --ink-2: #55504C;
    --muted: #857E78; --border: #E8E4E0; --border-strong: #D6D0CA; --accent: #BF2026; --accent-soft: #FBEBEC;
    --accent-ink: #A11B20; --green: #006937; --green-soft: #E7F3EC; --amber: #B05E1E; --amber-soft: #FAEDDA;
    --teal: #2D898B; --teal-soft: #E3F2F2;
    --shadow: 0 1px 2px rgba(35,32,31,.05), 0 8px 24px rgba(35,32,31,.06);
    --shadow-lg: 0 4px 32px rgba(0,0,0,.13);
  }
  :root[data-theme="dark"] {
    --ground: #171412; --surface: #211D1B; --surface-2: #2A2523; --ink: #F2EEEA; --ink-2: #C9C2BB;
    --muted: #9A928A; --border: #35302C; --border-strong: #4A443F; --accent: #E8545B; --accent-soft: #3A2224;
    --accent-ink: #F0868B; --green: #4CB878; --green-soft: #1E2F26; --amber: #E09B54; --amber-soft: #35291B;
    --teal: #5FB8BA; --teal-soft: #1C2E2E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 4px 32px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input, select { font-family: inherit; font-size: 14px; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 14px 32px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
    .nav-section-label { display: none; }
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #BF2026 0 50%, #006937 50% 100%);
    display: grid; place-items: center; color: #fff;
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .brand .sub { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-section-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 5px; font-weight: 600; }
  .nav button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: none; border: none; text-align: left;
    padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2);
    white-space: nowrap; transition: background .15s;
  }
  .nav button:hover { background: var(--surface-2); }
  .nav button.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .nav .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav .count.done { color: var(--green); font-weight: 600; }
  .nav .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .nav .dot.some { background: var(--amber); }
  .nav .dot.all { background: var(--green); }

  /* ---------- Main ---------- */
  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .progress-wrap { flex: 1; min-width: 180px; }
  .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .progress-label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .progress-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width .4s cubic-bezier(.4,0,.2,1); }
  .topbar .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: all .15s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .save-note { font-size: 11.5px; color: var(--muted); }

  .content { max-width: 860px; margin: 0 auto; padding: 32px 28px 100px; }
  .view-head { margin-bottom: 26px; }
  .view-head .eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin-bottom: 6px; }
  .view-head h2 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 8px; }
  .view-head p { color: var(--ink-2); max-width: 62ch; margin: 0; }

  /* ---------- Decision card ---------- */
  .dcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .dcard.decided { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }
  .dcard.parked { opacity: .72; }
  .dcard-top { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .dcard-id {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); padding: 2px 7px; border-radius: 6px; margin-top: 3px; flex: none;
  }
  .dcard h3 { font-size: 16.5px; font-weight: 600; flex: 1; min-width: 200px; }
  .status-chips { display: flex; gap: 4px; flex: none; }
  .chip {
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: none; color: var(--muted); font-weight: 500;
  }
  .chip.on-open { background: var(--surface-2); color: var(--ink-2); border-color: var(--border-strong); }
  .chip.on-decided { background: var(--green-soft); color: var(--green); border-color: var(--green); font-weight: 600; }
  .chip.on-parked { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); font-weight: 600; }
  .context {
    background: var(--surface-2); border-radius: 9px; padding: 10px 14px; font-size: 13px;
    color: var(--ink-2); margin-bottom: 14px;
  }
  .context b { color: var(--ink); font-weight: 600; }
  .context .ctx-label { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 3px; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    border: 1.5px solid var(--border); background: none; border-radius: 10px; padding: 12px 14px;
    transition: border-color .15s, background .15s; color: var(--ink);
  }
  .opt:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .opt.selected { border-color: var(--green); background: var(--green-soft); }
  .opt .radio {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-strong);
    flex: none; margin-top: 2px; position: relative;
  }
  .opt.selected .radio { border-color: var(--green); }
  .opt.selected .radio::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--green); }
  .opt .opt-body { flex: 1; min-width: 0; }
  .opt .opt-label { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .opt .opt-desc { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .opt-viz {
    display: block; margin-top: 9px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); padding: 9px 11px; overflow-x: auto; cursor: default;
  }
  .opt.selected .opt-viz { border-color: color-mix(in srgb, var(--green) 40%, var(--border)); }
  .opt-viz .viz-cap { display: block; }
  .rec-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    background: var(--teal-soft); color: var(--teal); padding: 2px 7px; border-radius: 5px;
  }
  .custom-opt { display: flex; gap: 8px; align-items: center; }
  .custom-opt input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px;
    background: none; font-size: 13px;
  }
  .custom-opt input:focus { border-color: var(--border-strong); outline: none; }
  .meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .meta-row b { color: var(--ink-2); font-weight: 600; }
  .meta-row .leaders { flex: 1; min-width: 240px; }
  .ai-note {
    border-left: 3px solid var(--teal); background: var(--teal-soft); border-radius: 0 8px 8px 0;
    padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px;
  }
  .ai-note b { color: var(--teal); }
  .dcard-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--border); padding-top: 14px; }
  @media (max-width: 640px) { .dcard-foot { grid-template-columns: 1fr; } }
  .foot-field label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 5px; }
  .foot-field textarea, .foot-field input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: var(--ground); font-size: 13px; resize: vertical; min-height: 34px;
  }
  .foot-field textarea { min-height: 54px; }
  .enf-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .enf-chips .chip.enf-on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .playground-link { font-size: 12px; color: var(--teal); background: none; border: none; padding: 0; text-decoration: underline; font-weight: 600; }

  /* ---------- Guide ---------- */
  .guide-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .guide-block h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
  .guide-block h3 .t { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
  .guide-block p, .guide-block li { font-size: 13.5px; color: var(--ink-2); }
  .guide-block ul, .guide-block ol { margin: 8px 0; padding-left: 20px; }
  .guide-block li { margin-bottom: 5px; }
  .guide-block li b, .guide-block p b { color: var(--ink); }
  .fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
  .fact { background: var(--surface-2); border-radius: 9px; padding: 10px 13px; font-size: 12.5px; color: var(--ink-2); }
  .fact b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
  .fact.bad b { color: var(--accent-ink); }
  .fact.good b { color: var(--green); }

  /* ---------- Principles ---------- */
  .principle {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .principle .p-row { display: flex; gap: 10px; align-items: flex-start; }
  .principle .p-num { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); flex: none; width: 26px; text-align: center; }
  .principle .p-fields { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .principle input, .principle textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    background: var(--ground); font-size: 13.5px;
  }
  .principle input.p-text { font-weight: 600; font-size: 15px; font-family: var(--font-display); }
  .principle .p-hint { font-size: 11px; color: var(--muted); }
  .principle .p-del { background: none; border: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }
  .principle .p-del:hover { color: var(--accent); }

  /* ---------- Playground ---------- */
  .pg-layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .pg-layout { grid-template-columns: 1fr; } }
  .pg-controls { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; position: sticky; top: 76px; box-shadow: var(--shadow); }
  @media (max-width: 860px) { .pg-controls { position: static; } }
  .pg-group { margin-bottom: 16px; }
  .pg-group > label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    border: 1px solid var(--border-strong); background: none; color: var(--ink-2);
    font-size: 12px; padding: 5px 10px; border-radius: 7px;
  }
  .seg button.on { background: var(--ink); color: var(--ground); border-color: var(--ink); font-weight: 600; }
  .pg-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pg-stage { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .stage-section > .stage-label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .container-slider { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .container-slider input { accent-color: var(--accent); }

  /* Preview canvas — driven by --pv-* vars set from JS */
  .pv {
    --pv-radius: 5px; --pv-space: 16px; --pv-fs: 14px; --pv-h: 18px;
    --pv-red: #BF2026; --pv-danger: #BF2026; --pv-green: #006937;
    --pv-surface: #FFFFFF; --pv-ground: #F5F5F3; --pv-ink: #333333; --pv-muted: #6a6a6a; --pv-border: #e7e7e7;
    --pv-shadow: 0px 4px 32px 0px rgba(0,0,0,.16);
    --pv-num: normal;
    background: var(--pv-ground); border: 1px solid var(--border); border-radius: 12px;
    padding: var(--pv-space); color: var(--pv-ink); font-size: var(--pv-fs);
    overflow-x: auto;
  }
  .pv.dark { --pv-surface: #262220; --pv-ground: #1A1715; --pv-ink: #F0ECE8; --pv-muted: #A59D95; --pv-border: #3B3531; --pv-red: #E8545B; --pv-danger: #E8545B; --pv-green: #4CB878; --pv-shadow: 0 4px 32px rgba(0,0,0,.5); }
  .pv * { box-sizing: border-box; }
  .pv .pv-btnrow { display: flex; gap: calc(var(--pv-space) * .5); flex-wrap: wrap; }
  .pv .pv-btn {
    border-radius: var(--pv-radius); font-size: var(--pv-fs); font-weight: 600;
    padding: calc(var(--pv-space)*.5) calc(var(--pv-space)*1);
    border: 1.5px solid transparent; font-family: var(--font-body); cursor: pointer;
  }
  .pv .pv-btn.pri { background: var(--pv-red); color: #fff; }
  .pv .pv-btn.sec { background: var(--pv-green); color: #fff; }
  .pv .pv-btn.out { background: none; border-color: var(--pv-red); color: var(--pv-red); }
  .pv .pv-btn.gho { background: none; color: var(--pv-muted); }
  .pv .pv-btn.dan { background: var(--pv-danger); color: #fff; }
  .pv-card-holder { container-type: inline-size; }
  .pv .pv-card {
    background: var(--pv-surface); border-radius: calc(var(--pv-radius) * 1.6);
    box-shadow: var(--pv-shadow); padding: calc(var(--pv-space) * 1.1);
    display: flex; flex-direction: column; gap: calc(var(--pv-space) * .6);
  }
  @container (min-width: 480px) { .pv .pv-card { flex-direction: row; align-items: stretch; } .pv .pv-card .pv-thumb { width: 38%; min-height: 110px; } }
  .pv .pv-thumb {
    background: linear-gradient(135deg, #BF202622, #00693733), var(--pv-ground);
    border-radius: var(--pv-radius); min-height: 84px; flex: none;
    display: grid; place-items: center; color: var(--pv-muted); font-size: 11px;
  }
  .pv .pv-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--pv-space)*.45); }
  .pv .pv-pill { align-self: flex-start; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: #7CB08B; border-radius: 999px; padding: 3px 9px; }
  .pv .pv-card h4 { margin: 0; font-family: var(--font-display); font-size: calc(var(--pv-h) * 1px * 1); font-size: var(--pv-h); font-weight: 600; color: var(--pv-ink); }
  .pv .pv-desc { font-size: calc(var(--pv-fs) * .88); color: var(--pv-muted); margin: 0; }
  .pv .pv-prog { height: 7px; background: var(--pv-border); border-radius: 999px; overflow: hidden; }
  .pv .pv-prog i { display: block; height: 100%; width: 72%; background: var(--pv-green); border-radius: 999px; }
  .pv .pv-stats { display: flex; gap: calc(var(--pv-space)); flex-wrap: wrap; }
  .pv .pv-stat b { display: block; font-size: calc(var(--pv-fs) * 1.12); font-variant-numeric: var(--pv-num); color: var(--pv-ink); }
  .pv .pv-stat span { font-size: calc(var(--pv-fs) * .78); color: var(--pv-muted); }
  .pv .pv-field label { display: block; font-size: calc(var(--pv-fs)*.85); font-weight: 600; margin-bottom: 4px; }
  .pv .pv-field input { width: 100%; max-width: 340px; border: 1.5px solid var(--pv-danger); border-radius: var(--pv-radius); padding: calc(var(--pv-space)*.5); background: var(--pv-surface); color: var(--pv-ink); font-size: var(--pv-fs); }
  .pv .pv-err { color: var(--pv-danger); font-size: calc(var(--pv-fs)*.82); margin-top: 4px; }
  .pv table { border-collapse: collapse; width: 100%; background: var(--pv-surface); border-radius: var(--pv-radius); overflow: hidden; box-shadow: var(--pv-shadow); }
  .pv th, .pv td { text-align: left; padding: calc(var(--pv-space)*.55) calc(var(--pv-space)*.8); font-size: calc(var(--pv-fs)*.9); border-bottom: 1px solid var(--pv-border); }

  /* ---------- Specimens (decision-card visuals) & 101 ---------- */

  .lead-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .lead-links a { font-size: 11px; font-weight: 600; color: var(--teal); background: var(--teal-soft); border: 1px solid transparent; padding: 3px 9px; border-radius: 999px; text-decoration: none; }
  .lead-links a:hover { border-color: var(--teal); }
  .ladder { display: flex; flex-direction: column; gap: 6px; }

    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px;
  }
  .export-preview pre {
    margin: 0; padding: 16px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
    overflow-x: auto; color: var(--ink-2); max-height: 480px; overflow-y: auto;
  }
  .import-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); padding: 9px 18px; border-radius: 9px;
    font-size: 13px; box-shadow: var(--shadow-lg); z-index: 100; opacity: 0; transition: opacity .25s;

<script>
/* ================================================================
   DATA — decision areas. Context = pitchIN's real current state.
   ================================================================ */
const AREAS = [
{
  id: "philosophy", num: 1, title: "Philosophy & principles", icon: "◆",
  intro: "This first group of decisions is about writing down what we believe, so we stop re-arguing it screen by screen. pitchIN currently has ZERO written design principles — DESIGN.md has hard rules about mechanics like logo and token usage, but nothing that states our values. Everything below is a genuine blank slate, which makes it the best place to start.",
  decisions: [
  { id:"1.1", title:"How many design principles should we write down?",
    context:"<b>Today:</b> no principles document exists anywhere in the workspace. The closest thing is the hard rules in DESIGN.md (logo usage, token usage) — those are mechanics, not values.",
    options:[
      {id:"a",label:"3–5 sharp principles, each naming a trade-off",rec:true,
       desc:"Write only a handful of principles, each in the form “X, even over Y” — a sentence that names what we are willing to sacrifice. Because it picks a winner between two things that are both good, it can actually settle an argument. The catch: a short list deliberately leaves some situations uncovered.",
       viz:`<div style="text-align:center;padding:8px 6px"><div style="font-family:var(--font-display);font-size:15px;font-weight:650">“Clarity about money, <span style="color:var(--accent)">even over</span> brand polish.”</div></div><span class="viz-cap">The “even over” names the sacrifice — that is what settles arguments. “Be clear” settles nothing; nobody argues for confusion.</span>`},
      {id:"b",label:"6–10 principles covering everything",
       desc:"Write a longer list so every value we hold is on paper. It feels thorough, but in practice nobody can remember ten principles, so they stop being the thing that settles arguments.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap"><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2)">Be clear</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.85">Be consistent</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.7">Be inclusive</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.55">Be trustworthy</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.45">Be modern</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.35">Be simple</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.28">Be human</span><span style="border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);opacity:.2">Be bold</span></div><span class="viz-cap">Eight worthy statements. Quick test: close your eyes and recite them. That fade is why long lists stop working.</span>`},
      {id:"c",label:"No written principles — let the components speak",
       desc:"Skip the document and treat the component library itself as the statement of our values. Fast today, but every time something new comes up, the team debates it from scratch.",
       viz:`<div class="flow101"><span class="f-step">New screen or flow</span><span class="f-arrow">→</span><span class="f-step">No principle to point at</span><span class="f-arrow">→</span><span class="f-step">Debate from scratch<i>loudest voice wins</i></span></div>`}],
    leaders:"Google's Material system ran on 3–4 principles; IBM's Carbon uses four words (Open, Inclusive, Modular, Consistent); Shopify's Polaris keeps about four. The test the experts use (Nielsen Norman Group, Smashing Magazine 2026): a good principle forces a choice between two things that BOTH have value — if no reasonable person could disagree with it, delete it.",
    ai:"Principles written as trade-offs can be pasted straight into DESIGN.md as tie-breaker rules for AI agents: “when two options conflict, prefer X.” Vague values give an agent nothing to act on.",
    workshop:"Draft candidate principles in the Principles tab, then stress-test each one against three real past pitchIN disagreements. If a principle would not have settled the argument, kill it." },

  { id:"1.2", title:"How much brand personality should our screens show?",
    context:"<b>Today:</b> the stance is implicit and inconsistent — brand red on buttons, but nothing written down. Marketing pages, the invest flow, and the admin app each improvise their own level of personality.",
    options:[
      {id:"a",label:"Neutral everywhere, system first",
       desc:"The interface stays quiet and plain, and the brand lives only in a thin layer of colors and logos — the approach of IBM's Carbon and GitHub's Primer. It is the safest look for money flows, but the product risks feeling generic.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px;max-width:240px"><div style="font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase">Wallet</div><div style="font-size:15px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums">RM 24,180.00</div></div><span class="viz-cap">Every screen looks like this — calm and trustworthy, but campaign pages lose their spark.</span>`},
      {id:"b",label:"Brand-forward everywhere",
       desc:"Personality shows up in shapes, motion, and color across the whole product — think Airbnb, or Google's Material 3 Expressive. Differentiating, but on a regulated money platform it can make serious screens feel less serious.",
       viz:`<div style="border-radius:8px;background:linear-gradient(120deg,#BF2026,#7a1216);padding:10px;color:#fff;max-width:240px"><div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Wallet</div><div style="font-family:var(--font-display);font-size:15px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums">RM 24,180.00</div></div><span class="viz-cap">Even the wallet wears the brand. Memorable — but does a red gradient make you trust a balance more?</span>`},
      {id:"c",label:"Two modes: trust surfaces vs story surfaces",rec:true,
       desc:"Split the product into zones. Money screens — the invest flow, wallet, portfolio, identity checks — stay neutral, dense, and restrained; campaign pages, discovery, and education get the expressive brand treatment. The zone is written into the theme itself, so it is a rule, not per-screen improvisation.",
       viz:`<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:150px"><div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px"><div style="font-size:8.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase">Wallet · trust</div><div style="font-size:13.5px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums">RM 24,180.00</div><div style="display:flex;gap:5px;margin-top:6px"><span class="mini-btn" style="background:#BF2026;color:#fff">Deposit</span><span class="mini-btn" style="border:1px solid var(--border-strong);color:var(--ink-2)">Withdraw</span></div></div></div><div style="flex:1;min-width:150px"><div style="border:1px solid var(--border);border-radius:8px;overflow:hidden"><div style="background:linear-gradient(120deg,#BF2026,#7a1216);padding:8px 9px;color:#fff"><div style="font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85">Live · equity</div><div style="font-family:var(--font-display);font-weight:700;font-size:12px;line-height:1.25;margin-top:3px">Own a piece of Malaysia's next fintech story</div></div><div style="background:var(--surface);padding:6px 9px"><span class="mini-btn" style="background:#BF2026;color:#fff">Invest from RM 500</span></div></div></div></div><span class="viz-cap">Left: money screens stay quiet. Right: story screens get emotion. Same product, deliberate zones.</span>`}],
    leaders:"Stripe, Wise, and Cash App all do this split in practice: expressive on marketing and onboarding, austere on transaction and ledger screens. IBM's Carbon ships an “expressive” theme variant on top of a neutral base.",
    workshop:"If the room picks the two-mode option: list every pitchIN screen on a whiteboard and sort each into a trust zone or a story zone. That zoning map IS the deliverable." },

  { id:"1.3", title:"How tightly packed should our screens be?",
    context:"<b>Today:</b> this is the perpetual “why does admin look different?” argument. The customer app (CustomerWeb) is airy and mobile-first; the admin app (AdminWeb) is dense in an ad-hoc way. Neither density has a name or a rule.",
    options:[
      {id:"a",label:"One comfortable density for everything",
       desc:"Every screen in both apps uses the same generous spacing. Simplest possible rule, but it forces admin tables into consumer spacing — the ops team will fight it, because they live in data-heavy screens all day.",
       viz:`<table class="mini" style="max-width:280px"><thead><tr><th>Investor</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td style="padding:10px 8px">Aisyah R.</td><td style="padding:10px 8px;text-align:right">RM 5,000</td></tr><tr><td style="padding:10px 8px">Marcus T.</td><td style="padding:10px 8px;text-align:right">RM 12,500</td></tr></tbody></table><span class="viz-cap">Reading room for investors — but admin staff see half as many rows per screen.</span>`},
      {id:"b",label:"Two named density modes, built into the tokens",rec:true,
       desc:"Name two spacings and make them official: “comfortable” (the default, for the customer app) and “compact” (for admin tables and forms). Because spacing is stored as tokens — named values kept in one shared place — switching a screen to compact becomes a token swap, not a redesign. Ship comfortable first.",
       viz:`<div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:150px"><table class="mini"><thead><tr><th>Investor</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td style="padding:9px 8px">Aisyah R.</td><td style="padding:9px 8px;text-align:right">RM 5,000</td></tr><tr><td style="padding:9px 8px">Marcus T.</td><td style="padding:9px 8px;text-align:right">RM 12,500</td></tr></tbody></table><span class="viz-cap">Comfortable — customer app default.</span></div><div style="flex:1;min-width:150px"><table class="mini" style="font-size:10.5px"><thead><tr><th>Investor</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr><td style="padding:2px 8px">Aisyah R.</td><td style="padding:2px 8px;text-align:right">RM 5,000</td></tr><tr><td style="padding:2px 8px">Marcus T.</td><td style="padding:2px 8px;text-align:right">RM 12,500</td></tr><tr><td style="padding:2px 8px">Devi K.</td><td style="padding:2px 8px;text-align:right">RM 8,200</td></tr><tr><td style="padding:2px 8px">Wei Lun O.</td><td style="padding:2px 8px;text-align:right">RM 3,750</td></tr></tbody></table><span class="viz-cap">Compact — same data, twice the rows. One token swap.</span></div></div>`},
      {id:"c",label:"Let every screen decide for itself",
       desc:"The status quo. Each designer picks spacing by feel, and the “why does admin look different?” argument never ends.",
       viz:`<div class="flow101"><span class="f-step">New screen</span><span class="f-arrow">→</span><span class="f-step">Designer picks spacing by feel</span><span class="f-arrow">→</span><span class="f-step">“Why does admin look different?”<i>again, next sprint</i></span></div>`}],
    leaders:"Amazon's Cloudscape system ships exactly two modes — comfortable by default, compact for data-rich views. Google's Material has a three-step density scale driven by tokens, and IBM Carbon's 2/4/8-pixel spacing scale was designed for exactly this kind of switching.",
    pg:"density",
    workshop:"Open the Playground and toggle comfortable/compact on the admin table with the whole room watching." },

  { id:"1.4", title:"How much animation should we use?",
    context:"<b>Today:</b> animation speed and easing tokens exist in brand-tokens.ts (100/200/300 millisecond durations plus easing curves), but more than 180 hardcoded transitions in the code ignore them. There are no written rules about motion.",
    options:[
      {id:"a",label:"Minimal and functional — a few tokens, two rules",rec:true,
       desc:"Keep roughly three duration tokens and two or three easing curves, plus two written rules: motion never delays a financial confirmation, and every animation respects the device's “reduce motion” setting (an accessibility preference people use to switch animations off). No choreographed showpieces.",
       viz:`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--ink-2)">100ms</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--ink-2)">200ms</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--ink-2)">300ms</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">ease-out</span><span style="font-size:10.5px;border:1px solid var(--accent);border-radius:5px;padding:3px 8px;color:var(--accent);font-weight:600">never delays a money confirmation</span></div><span class="viz-cap">The whole motion system fits on one line — that is the point.</span>`},
      {id:"b",label:"Two classes: everyday motion vs celebration motion",
       desc:"IBM Carbon's model: fast, functional motion for everyday tasks, and a separate expressive class reserved for big moments like page opens or a campaign hitting its funding goal. More design effort than the minimal option.",
       viz:`<div class="ladder"><div class="rung"><span class="bar" style="width:96px;background:var(--teal-soft);border-color:var(--teal);color:var(--teal)">productive</span><span>fast and invisible — menus, tables, forms</span></div><div class="rung"><span class="bar" style="width:170px">expressive</span><span>reserved — page opens, campaign-funded moments</span></div></div>`},
      {id:"c",label:"Physics-based springs",
       desc:"Google's Material 3 Expressive animates with simulated spring physics. Impressive, but overkill for two Angular 16 apps and a three-designer team.",
       viz:`<span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;color:var(--muted)">spring(mass: 1, stiffness: 380, damping: 30)</span><span class="viz-cap">Every animation gets three physics knobs to tune, per component. A lot of engine for a small team.</span>`}],
    leaders:"IBM Carbon's productive-vs-expressive split is the model everyone cites; Google's Material 3 moved to physics-based springs in 2025, with standard and expressive schemes.",
    workshop:"Decide on the minimal option now, and name the two-class model as the upgrade path if we later decide campaign-success moments deserve a celebration." },

  { id:"1.5", title:"What accessibility standard do we commit to?",
    context:"<b>Today:</b> no accessibility target is written down anywhere. The keyboard focus ring (the outline showing where you are when you navigate by keyboard) was historically DISABLED — flagged as a violation, now partially fixed via :focus-visible in _tokens.scss — and nothing checks color contrast in the token pipeline.",
    options:[
      {id:"a",label:"WCAG 2.1 AA — the 2018 standard",
       desc:"WCAG is the international checklist for making websites usable by people with disabilities, and AA is the level regulators reference. Version 2.1 dates from 2018 — fine, but version 2.2 already exists, and its extra requirements are cheap to adopt while we are still laying foundations.",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><span style="background:#BF2026;color:#fff;padding:4px 10px;border-radius:5px;font-size:11.5px;font-weight:600">4.9:1 ✓ passes</span><span style="background:#F5A3A6;color:#fff;padding:4px 10px;border-radius:5px;font-size:11.5px;font-weight:600">1.9:1 ✗ fails</span></div><span class="viz-cap">The core promise: every text-on-background pair stays readable. The 2018 list stops about here.</span>`},
      {id:"b",label:"WCAG 2.2 AA, enforced inside the components",rec:true,
       desc:"Adopt the current 2.2 version and build compliance into the components themselves. Its additions — a visible focus outline, alternatives to drag gestures, a minimum 24-pixel tap target — cost almost nothing now and a lot to retrofit later. Contrast gets checked automatically in the token pipeline instead of screen-by-screen QA.",
       viz:`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="width:24px;height:24px;border:1.5px dashed var(--teal);border-radius:6px;display:inline-grid;place-items:center;font-size:11px;color:var(--teal);flex:none">✕</span><span style="font-size:11px;color:var(--ink-2)">24px tap target</span><span style="background:#BF2026;color:#fff;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600">4.9:1 ✓</span><span style="border:2px solid var(--teal);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--ink-2)">visible focus ring</span></div><span class="viz-cap">Checked once, at the token and component level — every screen built from them inherits the compliance.</span>`},
      {id:"c",label:"2.2 AA plus APCA-informed contrast",
       desc:"Also adopt APCA, a newer and more accurate formula for scoring contrast that the future WCAG 3 is expected to use. It future-proofs us, but needs extra tooling — only worth it if we generate our color ramps with algorithms.",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--green);border-radius:5px;padding:4px 9px;color:var(--green);font-weight:600">APCA Lc 78 ✓</span><span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:4px 9px;color:var(--muted)">WCAG 4.9:1 ✓</span></div><span class="viz-cap">Two scoring systems for the same color pair — extra precision, extra tooling.</span>`}],
    leaders:"The EU Accessibility Act (June 2025) puts financial services in scope and hardens WCAG 2.1 AA, with the direction of travel toward 2.2. Shopify's Polaris, IBM's Carbon, and Atlassian all build AA into their components so product teams inherit compliance for free. Malaysia's SC has no hard mandate — AA is the defensible global bar.",
    ai:"A contrast rule written on token PAIRS (“this text color must pass on this background color”) is something a machine can verify automatically in CI on every change; a screen-by-screen human audit is not." },

  { id:"1.6", title:"How hard should risky actions be to trigger?",
    context:"<b>Today:</b> confirmation pop-ups are improvised flow by flow. Yet how undoable things are genuinely varies across the product — a PSTX trade settles when the order closes, and an ECF investment can only be cancelled inside its cooling-off window — while the friction we add does not scale with the risk.",
    options:[
      {id:"a",label:"Adopt a “reversibility ladder” as a named principle",rec:true,
       desc:"One written rule: the harder an action is to undo, the more friction we put in front of it. Browsing needs none; a reversible edit gets an inline undo; moving money gets a two-step confirmation; something irreversible like a sell or a withdrawal requires typing a confirmation or holding a button down. Every flow, current and future, maps onto the same ladder.",
       viz:`<div class="ladder"><div class="rung"><span class="bar" style="width:90px;background:var(--green-soft);border-color:var(--green);color:var(--green)">view</span><span>no friction — browse, read, filter</span></div><div class="rung"><span class="bar" style="width:150px;background:var(--teal-soft);border-color:var(--teal);color:var(--teal)">reversible edit</span><span>inline undo — rename, watchlist</span></div><div class="rung"><span class="bar" style="width:215px;background:var(--amber-soft);border-color:var(--amber);color:var(--amber)">money moves</span><span>2-step confirm — invest, deposit</span></div><div class="rung"><span class="bar" style="width:280px">irreversible</span><span>typed / hold-to-confirm — sell, withdraw</span></div></div>`},
      {id:"b",label:"One confirmation pop-up for everything",
       desc:"Standardize on a single “Are you sure?” dialog everywhere. Simple, but wrong in both directions: it nags people on cheap actions and under-protects the expensive ones.",
       viz:`<div style="border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:9px 11px;max-width:250px"><div style="font-size:11.5px;font-weight:600">Are you sure?</div><div style="display:flex;gap:6px;margin-top:7px"><span class="mini-btn" style="border:1px solid var(--border-strong);color:var(--ink-2)">Cancel</span><span class="mini-btn" style="background:#BF2026;color:#fff">Confirm</span></div></div><span class="viz-cap">The same pop-up for renaming a watchlist and withdrawing RM 50,000 — people learn to click through it.</span>`},
      {id:"c",label:"Keep deciding flow by flow",
       desc:"The status quo. Every new flow re-litigates its own confirmation pattern, and how well you are protected depends on who built the screen.",
       viz:`<div class="flow101"><span class="f-step">New flow</span><span class="f-arrow">→</span><span class="f-step">Team invents its own confirm</span><span class="f-arrow">→</span><span class="f-step">Protection varies<i>by who built it</i></span></div>`}],
    leaders:"Stripe and Wise document confirmation-friction ladders that scale with how reversible an action is. Banking design systems also mandate tabular figures (digits of equal width, so amounts line up in columns) for all money, and never show “0” while a balance is loading — a loading placeholder instead of a spinner that flashes zero.",
    ai:"The ladder is a decision TABLE, so an AI agent can apply it mechanically when building any new flow. Bundle the related money-display rules into this decision too: tabular figures mandatory for amounts (see the Playground), loading placeholders instead of zero for balances, and the rounding rules for displayed amounts.",
    pg:"numerals" },
  ]},
{
  id: "responsive", num: 2, title: "Responsive strategy", icon: "⇔",
  intro: "This area answers a complaint the team has already voiced: our mobile-first approach feels too rigid. The 2026 answer is not to abandon mobile-first — it is to let each component respond to the space it actually sits in, instead of only to the size of the whole window. Three decisions: the overall approach, the cut-off points where layouts change, and how text scales.",
  decisions: [
  { id:"2.1", title:"How should layouts adapt to screen size?",
    context:"<b>Today:</b> classic mobile-first breakpoints — layouts change at fixed window widths (576/768/992/1200/1400 pixels, inherited from Bootstrap 4, content capped at 1280px). The team calls it too rigid, and the rigidity is real: a card designed around window width breaks when it is placed in a narrow side panel on a wide screen.",
    options:[
      {id:"a",label:"Keep classic mobile-first, window-width breakpoints",
       desc:"Stay with the proven, familiar model where layouts switch at fixed window widths. Lean and well understood — but a component never knows how much space IT actually has, which is exactly the rigidity the team is feeling.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">sm 576</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">md 768</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">lg 992</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">xl 1200</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">2xl 1400</span></div><span class="viz-cap">Every component listens to the window — even when it sits in a narrow panel on a big screen.</span>`},
      {id:"b",label:"Switch to desktop-first",
       desc:"Design for big screens first and adapt down. It matches the admin app's reality, but it fights the customer app, where investors are heavily on phones. The wrong default for pitchIN.",
       viz:`<div style="display:flex;gap:6px;flex-wrap:wrap"><span style="border:1px solid var(--green);color:var(--green);border-radius:5px;padding:3px 9px;font-size:11px;font-weight:600">Admin app — fits: staff on desktops</span><span style="border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:3px 9px;font-size:11px;font-weight:600">Customer app — fights: investors on phones</span></div>`},
      {id:"c",label:"Go fully fluid",
       desc:"Rebuild around container queries (a CSS feature that lets a component check how much space IT has, instead of how big the whole window is), fluid sizing, and grids that wrap naturally — keeping breakpoints only as coarse layout switches. The most future-proof model, but also the newest mental model: a big retraining jump in one step.",
       viz:`<div style="display:flex;gap:5px;flex-wrap:wrap"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">container queries</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">clamp()</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">intrinsic grids</span></div><span class="viz-cap">The full 2026 toolkit at once — powerful, but everyone relearns layout on day one.</span>`},
      {id:"d",label:"Hybrid: mobile-first pages, container-aware components",rec:true,
       desc:"Keep the familiar model for page shells — pages still respond to the window — but make every @pitchin/ui component with layout variants respond to its CONTAINER, the box it actually sits in. This is what lets ONE component library serve the mobile-first customer app AND the dense desktop admin app without maintaining two forks.",
       viz:`<div style="display:flex;flex-direction:column;gap:6px"><div class="flow101"><span class="f-step">Page shell<i>listens to the window</i></span><span class="f-arrow">→</span><span class="f-step">familiar mobile-first breakpoints stay</span></div><div class="flow101"><span class="f-step">Component<i>asks “how wide am I?”</i></span><span class="f-arrow">→</span><span class="f-step">same card works in CustomerWeb and AdminWeb</span></div></div>`}],
    leaders:"Container queries have been supported in all major browsers since 2023 (over 90% of users), and 2025–26 guides treat them as standard practice. The shift they describe: “responsive behavior becomes a design-system concern, not a per-page one.” It is pure CSS — nothing about Angular blocks it.",
    pg:"container",
    workshop:"Drag the container-width slider in the Playground: the same card component reflows based on its container, not the window. This demo usually ends the debate." },

  { id:"2.2", title:"How many size cut-offs, and what should we call them?",
    context:"<b>Today:</b> five breakpoints named after device eras — sm 576 / md 768 / lg 992 / xl 1200 / 2xl 1400 — inherited from Bootstrap 4 and mirrored in the Tailwind config.",
    options:[
      {id:"a",label:"Keep the five Bootstrap-style breakpoints",
       desc:"Zero migration work, but the names and values carry on the old phone / tablet / laptop device thinking that no longer matches the real spread of screens.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">sm 576</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">md 768</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">lg 992</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">xl 1200</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">2xl 1400</span></div><span class="viz-cap">Named after 2010s devices — the world they described no longer exists.</span>`},
      {id:"b",label:"Four content-named breakpoints, stored as tokens",rec:true,
       desc:"Cut to four and name them after layout instead of devices — compact, regular, wide, max. Each one is documented as a “layout switch”: you add a breakpoint where the layout visibly breaks, and everything in between flexes fluidly. The 2xl breakpoint gets pruned.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">compact</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">regular</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">wide</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--green);border-radius:5px;padding:3px 8px;color:var(--green);font-weight:600">max</span></div><span class="viz-cap">Break where the LAYOUT breaks; between the cut-offs, everything flexes fluidly.</span>`},
      {id:"c",label:"Just two breakpoints, fluid everything else",
       desc:"The cleanest philosophy on paper, but retrofitting two live Angular apps down to two breakpoints is the highest-risk version of this idea.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--teal);border-radius:5px;padding:3px 8px;color:var(--teal);font-weight:600">narrow</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--teal);border-radius:5px;padding:3px 8px;color:var(--teal);font-weight:600">wide</span><span style="font-size:10.5px;color:var(--muted);align-self:center">— and every existing screen re-tested</span></div>`}],
    leaders:"The 2026 guidance is consistent: fewer, more meaningful breakpoints with fluid behavior between them, and naming that moves from device names to content-driven tokens." },

  { id:"2.3", title:"Should text sizes jump at cut-offs or scale smoothly?",
    context:"<b>Today:</b> one hard jump — body text is 16px on desktop and drops to 14px when the window is narrower than 768 pixels. Cross that line and every piece of text on the page changes at once; that single cliff is part of the “rigid” feeling.",
    options:[
      {id:"a",label:"Keep stepped sizes at each breakpoint",
       desc:"Text sizes stay fixed within each window range. Predictable, but jarring at the cliff — and every new breakpoint needs its own set of size rules.",
       viz:`<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span style="font-size:16px;font-weight:600">16px body</span><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--accent)">← the 768px cliff →</span><span style="font-size:14px;font-weight:600">14px body</span></div><span class="viz-cap">One pixel of window width flips every font on the page.</span>`},
      {id:"b",label:"Smooth scaling for headlines; fixed body text",rec:true,
       desc:"Headlines scale smoothly with the window using CSS clamp() — a rule that lets a size slide between a set minimum and maximum (bounded in rem units, so browser zoom keeps working for accessibility). Body text stays fixed per density mode, so reading comfort and table density stay predictable.",
       viz:`<div style="display:flex;flex-direction:column;gap:3px"><div style="font-family:var(--font-display);font-weight:650;font-size:20px">Headline slides 22→32px</div><div style="font-size:13px;color:var(--ink-2)">Body text stays put at its set size — easy to read, easy to reason about.</div></div><span class="viz-cap">Smooth where size is expressive, stable where people actually read.</span>`},
      {id:"c",label:"Smooth scaling for everything",
       desc:"All text slides with the window. It feels seamless, but body-text size becomes hard to reason about — is that admin table set in 13px or 17px right now? It depends on the window.",
       viz:`<span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:4px 9px;color:var(--muted)">body: clamp(13px … 17px)</span><span class="viz-cap">A dense admin table whose row height depends on how wide the window happens to be.</span>`}],
    leaders:"The standard 2026 pattern is clamp() with rem-based minimum and maximum bounds; the leading systems keep body text stepped and let only display and heading sizes scale fluidly.",
    pg:"typeratio" },
  ]},
{
  id: "tokens", num: 3, title: "Design tokens — the shared ingredient list", icon: "⬢",
  intro: "A design token is just a named value — “brand red”, “small gap”, “heading size” — kept in one shared list that every app reads, so a color or size is decided once instead of retyped on every screen. pitchIN already has a real token file (brand-tokens.ts, owner-approved, with an automated verify:tokens check) — but only in one app. The decisions in this area turn that one-app list into a true source of truth for everything we build.",
  decisions: [

  { id:"3.1", title:"Where should the master list of styles live?",
    context:"<b>Today:</b> The customer app has a real master list — brand-tokens.ts, a TypeScript file that generates the app's SCSS and Tailwind style files, with an automated check (verify:tokens) keeping them in sync. The admin app, though, has a separate hand-typed copy that has drifted: stale greens, blue-tinted dividers, and one accent color that is a straight copy-paste bug. A fourth hand-made copy lives in the asset-forge image tool.",
    options:[
      {id:"a",label:"One standard JSON file (the W3C DTCG format)",rec:true,
       desc:"Move the master list into a plain-text file in the industry-standard token format — DTCG, a specification from the W3C (the web-standards body) that reached its first stable version in October 2025 and is supported by Figma, Tokens Studio, Style Dictionary, Penpot and 10+ more tools. A free generator tool called Style Dictionary then produces the TypeScript, SCSS, Tailwind and Figma versions automatically — so the admin app's drifted copy becomes generated output that <b>cannot</b> drift.",
       viz:`<div class="flow101"><span class="f-step">tokens.json<i>one shared file, standard format</i></span><span class="f-arrow">→</span><span class="f-step">Style Dictionary<i>free generator tool</i></span><span class="f-arrow">→</span><span class="f-step">SCSS · Tailwind · TS · Figma<i>per-app copies, regenerated on change</i></span></div><span class="viz-cap">Nobody hand-edits the copies again — the admin app's version is built from the master, so it cannot drift. asset-forge's private copy dies the same day.</span>`},
      {id:"b",label:"Keep brand-tokens.ts as the master, add generators",
       desc:"Keep the TypeScript file we already trust as the master and write generators from it. Least churn — but TypeScript is a programming language only the web apps speak, so the .NET email templates, any future native app, and Figma would each need a custom-built reader.",
       viz:`<div class="flow101"><span class="f-step">brand-tokens.ts<i>TypeScript — web apps only</i></span><span class="f-arrow">→</span><span class="f-step">SCSS · Tailwind<i>works today</i></span><span class="f-arrow">→</span><span class="f-step" style="border-color:var(--amber);color:var(--amber)">.NET emails · Figma · native<i>each needs a hand-built reader</i></span></div><span class="viz-cap">Everything outside the web apps needs bespoke plumbing to read a TypeScript master.</span>`},
      {id:"c",label:"Just CSS variables and the Tailwind config",
       desc:"Skip the master-list idea and manage styles directly in CSS. The simplest possible setup — but there is no structure for themes, aliases or a second brand, and it is the weakest option for AI tools and Figma sync.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;font-family:var(--font-mono);font-size:11px;line-height:1.8;color:var(--ink-2)">--brand-red: #BF2026;<br>--brand-green: #006937;</div><span class="viz-cap">One flat list of CSS values — fine inside a single app, but invisible to Figma, email templates and AI tools.</span>`}],
    leaders:"The DTCG standard's October 2025 release lists Adobe, Google, Microsoft, Salesforce and Shopify among its contributors, and roughly 84% of surveyed design teams now run on tokens of some kind.",
    ai:"A single canonical tokens.json is the biggest AI-readability win on the table: agents can read it directly with zero guesswork, and every generated output automatically stays true to it." },

  { id:"3.2", title:"How many layers should the token list have?",
    context:"<b>Today:</b> We have roughly one and a half layers. Some tokens are primitives (raw values with plain names, like a specific green) and some carry semantic names — names that describe a job rather than a color, like status.* and impact.* — but the two kinds are mixed together, there are no component-level tokens, and 706+ colors are hardcoded straight into screens, bypassing the list entirely.",
    options:[
      {id:"a",label:"Two layers: primitives plus semantic names",
       desc:"Raw values in one layer, job-named tokens in the other — lean, and a good fit for a three-designer team. The catch: when one component genuinely needs its own value, there is no official home for it, so exceptions get hacked in somewhere.",
       viz:`<div class="flow101"><span class="f-step" style="font-family:var(--font-mono)">red.600<i>primitive</i></span><span class="f-arrow">→</span><span class="f-step" style="font-family:var(--font-mono)">color.action.primary<i>semantic — what screens use</i></span><span class="f-arrow">→</span><span class="f-step" style="border-style:dashed;color:var(--muted)">one-off exceptions<i>no official home</i></span></div><span class="viz-cap">Lean — but the genuine exceptions end up hacked in wherever they fit.</span>`},
      {id:"b",label:"Three full layers, including component tokens",
       desc:"Adds a third layer of per-component names (button.bg, card.border) — the shape GitHub's Primer and Atlassian use. Very precise, but component tokens multiply fast, and hundreds of extra names is heavy upkeep for three designers.",
       viz:`<div class="flow101"><span class="f-step" style="font-family:var(--font-mono)">red.600<i>primitive</i></span><span class="f-arrow">→</span><span class="f-step" style="font-family:var(--font-mono)">color.action.primary<i>semantic</i></span><span class="f-arrow">→</span><span class="f-step" style="font-family:var(--font-mono)">button.bg · card.border · chip.bg …<i>hundreds of these, all maintained by hand</i></span></div><span class="viz-cap">Every component gets its own names — precise, but the third layer balloons.</span>`},
      {id:"c",label:"Two and a half: component tokens only on proven need",rec:true,
       desc:"Start with primitives and semantic names, and only create a component token once the same override has genuinely been needed about three times (the “rule of three”). Comes with one strict, non-negotiable rule: product code may only ever use semantic or component names — never a primitive, never a raw hex code.",
       viz:`<div class="flow101"><span class="f-step" style="font-family:var(--font-mono)">red.600<i>primitive</i></span><span class="f-arrow">→</span><span class="f-step" style="font-family:var(--font-mono)">color.action.primary<i>semantic — what screens use</i></span><span class="f-arrow">→</span><span class="f-step" style="border-style:dashed;font-family:var(--font-mono)">button.bg<i>created only after ~3 proven needs</i></span></div><span class="viz-cap">Same chain as the big systems — but the third layer stays tiny until reality demands it.</span>`}],
    leaders:"GitHub's Primer flows base → functional → component, one direction only, and that shape is the industry consensus — always with the same small-team caveat: add component tokens only when a component demonstrably needs its own value.",
    ai:"“Semantic tokens only, never hex codes” is the single most important guardrail for AI agents — hardcoding a hex is the #1 way agents drift off-brand. Our Tailwind setup already, by accident, outputs nothing for stock utility colors like tw-bg-red-500; this decision turns that accidental enforcement into a deliberate one." },

  { id:"3.3", title:"How should we name our tokens?",
    context:"<b>Today:</b> Names are made up on the spot — divider.light, msgSuccess.frame, and a color called “blue” that is actually #1A1847, a near-black purple. There is no written pattern, four nearly identical greens carry four different names, and several different names point at the exact same value.",
    options:[
      {id:"a",label:"A fixed pattern (category.concept.role.state) plus a written glossary",rec:true,
       desc:"Every name follows the same order, broad to specific, and describes the job rather than the appearance — color.text.danger still makes sense after a rebrand, while color.red.text does not. The workshop's task is to choose the 6–8 “role” words (surface, text, border, icon, action, status…) and write them down as the official glossary.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;font-family:var(--font-mono);font-size:15px;letter-spacing:.01em"><span style="color:var(--teal)">color</span><span style="color:var(--muted)">.</span><span style="color:var(--green)">text</span><span style="color:var(--muted)">.</span><span style="color:var(--accent)">danger</span><span style="color:var(--muted)">.</span><span style="color:var(--amber)">hover</span></div><span class="viz-cap"><span style="color:var(--teal);font-weight:700">category</span> · <span style="color:var(--green);font-weight:700">role — one of the 6–8 words you freeze</span> · <span style="color:var(--accent);font-weight:700">intent — says why, not what</span> · <span style="color:var(--amber);font-weight:700">state</span>. This name survives a rebrand.</span>`},
      {id:"b",label:"The classic category-type-item scheme",
       desc:"Style Dictionary's original naming scheme (category-type-item). Proven and tool-friendly, but the names describe what a thing is more than why you would use it.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;font-family:var(--font-mono);font-size:14px">color-font-danger</div><span class="viz-cap">Perfectly workable — but “font” tells you what it is, not when to reach for it.</span>`},
      {id:"c",label:"No pattern — name things as we go",
       desc:"The status quo. It is exactly how we ended up with four greens under four names, so choosing this means choosing the drift we already have.",
       viz:`<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">divider.light</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">msgSuccess.frame</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">blue = #1A1847</span><span style="font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 8px;color:var(--muted)">4 greens, 4 names</span></div><span class="viz-cap">Real names from today's file — including a “blue” that is a near-black purple.</span>`}],
    leaders:"GitHub's Primer adds state suffixes like -rest, -hover and -disabled, and orders its names so they sort neatly in an alphabetical list. Every big system lands on the same insight: the small set of role words matters far more than the dots and dashes between them.",
    workshop:"Spend 20 minutes at the whiteboard agreeing the 6–8 role words as a group — then freeze them." },

  { id:"3.4", title:"How do we organise color — and prep for dark mode?",
    context:"<b>Today:</b> A hand-picked palette, light mode only — dark mode is at 0%. The same green #0A994A exists under four different names, and so does #006937. There is no ramp structure (no ordered light-to-dark steps of each color) and no written contrast rules.",
    options:[
      {id:"a",label:"Keep the hand-picked palette; dark mode “someday”",
       desc:"Change nothing now. The catch: every hardcoded color shipped today quietly makes an eventual dark mode more of a rewrite — the debt compounds while we wait.",
       viz:`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span style="display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"><span style="width:16px;height:16px;border-radius:4px;background:#0A994A"></span>green</span><span style="display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"><span style="width:16px;height:16px;border-radius:4px;background:#0A994A"></span>success</span><span style="display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"><span style="width:16px;height:16px;border-radius:4px;background:#0A994A"></span>positive</span><span style="display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"><span style="width:16px;height:16px;border-radius:4px;background:#0A994A"></span>approved</span></div><span class="viz-cap">One green, four names — and no plan for dark mode.</span>`},
      {id:"b",label:"Build ramps and roles now; ship dark mode later",rec:true,
       desc:"Turn each key color — brand red, brand green, neutral, and the status hues — into a 10–13-step ramp (an ordered ladder from very light to very dark), built in OKLCH (a modern way of measuring color that keeps the steps looking evenly spaced to the human eye). Add written contrast rules like “text from step 600 up must pass on backgrounds from step 100 down”. Dark mode then becomes a cheap remap — each role simply points at a different step of the same ladder — instead of the rewrite it becomes later.",
       viz:`<div class="ramp"><span style="background:#FDECEC"></span><span style="background:#F9C6C8"></span><span style="background:#F09296"></span><span style="background:#E8545B"></span><span style="background:#D93A41"></span><span style="background:#BF2026"></span><span style="background:#9A1B20"></span><span style="background:#7A1519"></span></div><div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:3px"><span>50</span><span>100</span><span>200</span><span>400</span><span>500</span><span>600 = brand</span><span>700</span><span>800</span></div><span class="viz-cap">One red becomes a numbered ladder with written contrast rules. Dark mode picks different steps of the same ladder — not new colors.</span>`},
      {id:"c",label:"Algorithm-generated palettes (Google's Material 3)",
       desc:"Feed in the brand colors and Google's HCT algorithm generates roughly 30 color roles automatically, dark mode included. Powerful — but it locks the product into Material's distinctly Google look.",
       viz:`<div style="display:flex;gap:4px;flex-wrap:wrap"><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">primary</span><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">on-primary</span><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">primary-container</span><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">on-primary-container</span><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">surface-variant</span><span style="font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;color:var(--muted)">…× ~30</span></div><span class="viz-cap">About 30 roles generated for you — thorough, but unmistakably Material.</span>`}],
    leaders:"Radix and GitHub's Primer both publish 12-step ramps with written rules for what each step may be used for, and Google's Material 3 treats dark mode as a role remap rather than a second palette. The standard role checklist: surface, elevated surface, border, overlay, focus, four levels of text, and the four status colors — each with a light and a dark value.",
    pg:"darkmode" },

  { id:"3.5", title:"One red does four jobs — should we split it?",
    context:"<b>Today:</b> #BF2026 — pitch red — is doing four jobs at once: it is the brand, the primary “Invest” button, the error color (there is no separate danger token), and on PSTX trading screens it would also read as investment loss. One hue, four meanings. This is the most pitchIN-specific color decision on the table.",
    options:[
      {id:"a",label:"Keep one red for everything",
       desc:"Maximum brand presence everywhere. The cost: “Invest” buttons look like danger buttons, error messages look like branding, and profit-and-loss tables need red to mean only one thing — loss.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span class="mini-btn" style="background:#BF2026;color:#fff">Invest now</span><span style="color:#BF2026;font-size:11.5px;font-weight:600">✗ Payment failed</span><span style="color:#BF2026;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">−RM 918.40</span></div><span class="viz-cap">The “Invest” button, a failed payment and a loss all wear the same red.</span>`},
      {id:"b",label:"Split: brand red keeps its job, danger and loss get their own",rec:true,
       desc:"The brand and its CTAs stay #BF2026; errors and destructive actions get a separate danger red; and on PSTX trading ledgers, red and green are reserved strictly for loss and gain. Every red on screen then means exactly one thing.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span class="mini-btn" style="background:#BF2026;color:#fff">Invest now</span><span style="color:#D64545;font-size:11.5px;font-weight:600">✗ Payment failed</span><span style="color:#D64545;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">−RM 918.40</span></div><span class="viz-cap">Brand red keeps the button; a separate #D64545 covers errors and losses — on a ledger, red means exactly one thing.</span>`},
      {id:"c",label:"Demote red: green becomes the action color",
       desc:"The cleanest meaning system — red only ever signals danger or loss — but the biggest brand departure, because the pitchIN mark is pitch red.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span class="mini-btn" style="background:#006937;color:#fff">Invest now</span><span style="color:#D64545;font-size:11.5px;font-weight:600">✗ Payment failed</span><span style="color:#D64545;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">−RM 918.40</span></div><span class="viz-cap">Green sells, red only warns — the cleanest logic, but the brand's own color leaves its buttons.</span>`}],
    leaders:"Fintechs with red brands face this exact collision — Robinhood's crimson is the famous case — and they resolve it by separating brand red from loss red, or by moving profit-and-loss to green/neutral with direction arrows. In every major system, the status colors are never the same tokens as the brand accent.",
    pg:"redrole",
    workshop:"In the Playground, flip the “red role” switch over the trading table and watch what a sell error looks like in each world." },

  { id:"3.6", title:"How should text sizes be organised?",
    context:"<b>Today:</b> Poppins for headings, Inter for body text, self-hosted — that pairing is settled brand, keep it. The sizes are h1 at 2.5rem down to h6 at 1rem, plus a pile of utility sizes (xxs–xl), with no named roles, no ratio behind them, and no token for lining up numbers in money columns.",
    options:[
      {id:"a",label:"A pure ratio-generated scale",
       desc:"Pick one multiplier (1.2, 1.25 or 1.333) and let the math generate every size — each step is the previous size times the ratio. Elegant on paper, but real screens always end up needing hand-tuned exceptions.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font-size:12px">12.0</span><span style="font-size:14px">14.4</span><span style="font-size:17px">17.3</span><span style="font-size:21px">20.7</span><span style="font-size:25px">24.9</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">each = previous × 1.2</span></div><span class="viz-cap">The math is pretty — until a real screen needs a size the formula refuses to give you.</span>`},
      {id:"b",label:"Generate with a ratio, then freeze 8–10 named styles",rec:true,
       desc:"Use a ~1.2 ratio to propose candidate sizes, then hand-tune and freeze them into named roles: display, heading-lg, heading-md, heading-sm, body, body-sm, label, caption — plus a dedicated money style using tabular-nums (digits that all take the same width, so RM amounts line up in columns). From then on, people and AI agents only ever say the role name, never a raw pixel size.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 12px"><div style="font-family:var(--font-display);font-weight:650;font-size:21px;line-height:1.3">display</div><div style="font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.4">heading-md</div><div style="font-size:13px">body — Inter at reading size</div><div style="font-size:13px;font-variant-numeric:tabular-nums;font-weight:600">numeric — RM 1,842,500.00</div></div><span class="viz-cap">Generated by the ratio, then frozen and named. Everyone says “heading-md”, never “17px” — and money always gets the numeric role.</span>`},
      {id:"c",label:"Keep today's h1–h6 and utility sizes",
       desc:"Familiar and zero migration — but naming styles after HTML tags (h3) tangles up what a piece of text means with how big it happens to be.",
       viz:`<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 12px;font-family:var(--font-mono);font-size:11px;line-height:1.8;color:var(--ink-2)">h1 2.5rem · h2 2rem · h3 1.75rem · … · h6 1rem · xxs–xl</div><span class="viz-cap">Every name says how big — none says what it's for.</span>`}],
    leaders:"Google's Material 3 ships 15 named type roles (display, headline, title, body and label, each in sizes); IBM's Carbon locks its type to a 2x grid. The shared lesson: the ratio is only a starting point — the named roles are the actual product.",
    pg:"typeratio" },

  { id:"3.7", title:"How should spacing between things work?",
    context:"<b>Today:</b> Tailwind's 4px-based spacing scale, applied inconsistently. There are no semantic aliases — no named gaps — so every screen improvises its own density.",
    options:[
