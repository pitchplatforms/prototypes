<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pitchIN — Corporate Exercise voting (prototype)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.7.0/iconfont/tabler-icons.min.css" />
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --line:#e4e6ea; --line2:#d2d6dc;
    --text:#1c2128; --muted:#6b7280; --hint:#9aa1ab;
    --brand:#1f6feb; --brand-bg:#e7f0ff;
    --ok:#15803d; --ok-bg:#e6f5ec; --danger:#b42318; --danger-bg:#fdecea;
    --warn:#92610a; --warn-bg:#fdf3e2;
    --r:10px; --r-lg:14px;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px; margin:0 auto; padding:18px 14px 60px;}
  .protonote{font-size:12px; color:var(--hint); margin-bottom:10px;}
  .chrome{display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px;}
  .brand{font-weight:600;}
  .brand span{font-weight:400; color:var(--muted); font-size:13px;}
  .chrome-right{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted);}
  .bell{position:relative;}
  .dot{position:absolute; top:-3px; right:-3px; width:8px; height:8px; background:var(--danger); border-radius:50%;}
  #app{margin-top:12px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 20px;}
  .ref{font-size:11px; background:var(--bg); color:var(--muted); padding:3px 9px; border-radius:var(--r);}
  h3{margin:0; font-size:18px; font-weight:600;}
  .sub{font-size:13px; color:var(--muted);}
  .hero{text-align:center; margin:18px 0;}
  .hero .lbl{font-size:12px; color:var(--muted);}
  .hero .val{font-size:32px; font-weight:600; color:var(--ok);}
  .facts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .fact{background:var(--bg); border-radius:var(--r); padding:11px 13px;}
  .fact .k{font-size:12px; color:var(--muted);} .fact .v{font-size:17px; font-weight:600; margin-top:2px;}
  .note{font-size:13px; color:var(--muted); background:var(--bg); border-radius:var(--r); padding:11px 13px; margin-top:14px;}
  .note b{color:var(--text);}
  .row{display:flex; gap:10px; margin-top:16px;}
  button{font:inherit; cursor:pointer; border-radius:var(--r); border:1px solid var(--line2);
    background:var(--surface); color:var(--text); padding:10px 14px; transition:.12s;}
  button:hover{background:var(--bg);} button:active{transform:scale(.98);}
  .b-grow{flex:1;}
  .b-ok{border-color:#bfe3cc; color:var(--ok);} .b-ok:hover{background:var(--ok-bg);}
  .b-danger{border-color:#f3c5bf; color:var(--danger);} .b-danger:hover{background:var(--danger-bg);}
  .b-brand{border-color:#bcd4ff; color:var(--brand);} .b-brand:hover{background:var(--brand-bg);}
  .fineprint{font-size:11px; color:var(--hint); text-align:center; margin-top:12px;}
  .overlay{min-height:360px; background:rgba(20,24,31,.5); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{max-width:420px; width:100%; background:var(--surface); border-radius:var(--r-lg); padding:22px; text-align:center;}
  .icon-circ{width:46px; height:46px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:23px;}
  .ic-warn{background:var(--warn-bg); color:var(--warn);} .ic-ok{background:var(--ok-bg); color:var(--ok);} .ic-brand{background:var(--brand-bg); color:var(--brand);}
  .alert{display:flex; align-items:center; gap:12px; background:var(--warn-bg); border-radius:var(--r-lg); padding:14px 16px;}
  .alert i{font-size:20px; color:var(--warn);} .alert .txt{flex:1; font-size:14px; color:var(--warn);}
  .switcher{margin-top:16px; border-top:1px solid var(--line); padding-top:12px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .switcher .lbl{font-size:11px; color:var(--hint);}
  .pill{padding:5px 11px; font-size:12px; border-radius:20px;}
  .pill.on{border-color:#bcd4ff; color:var(--brand); background:var(--brand-bg);}
  a.link{color:var(--brand); text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="protonote"><i class="ti ti-flask"></i> Prototype — mock data, illustrative only. Not connected to live systems.</div>
  <div class="chrome">
    <div class="brand">pitchIN <span>/ my account</span></div>
    <div class="chrome-right">
      <span class="bell"><i class="ti ti-bell" style="font-size:18px"></i><span id="belldot" class="dot"></span></span>
      <span id="who"><i class="ti ti-user-circle" style="font-size:18px"></i> —</span>
    </div>
  </div>
  <div id="app"></div>
  <div class="switcher">
    <span class="lbl">View as investor:</span>
    <span id="invpills"></span>
    <button class="pill" style="margin-left:auto" onclick="reset()"><i class="ti ti-refresh"></i> Reset</button>
  </div>
</div>
<script>
const ROI = 0.18;
const EX = {issuer:'Tani AgriTech Sdn Bhd', title:'Share buyback offer', ref:'CE-2026-014', deadline:'30 Jun 2026', close:'Voting closes 30 Jun 2026, 5:00pm'};
const INV = {
  aisha: {name:'Aisha Rahman', id:'INV-10231', shares:12000, cost:0.72},
  ben:   {name:'Ben Lim',      id:'INV-10876', shares:3500,  cost:0.68},
  chong: {name:'Chong Wei',    id:'INV-11540', shares:48000, cost:0.78}
};
const S = {screen:'popup', inv:'aisha', choice:null, voted:{}};
const rm = n => 'RM ' + Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function offer(k){ const v=INV[k]; const ps=v.cost*(1+ROI); return {...v, perShare:ps, total:v.shares*ps}; }

function detail(o){
  return `<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="ref">${EX.ref}</span>
      <span style="font-size:12px; color:var(--danger)"><i class="ti ti-clock"></i> ${EX.deadline}</span>
    </div>
    <h3 style="margin-top:10px">${EX.title}</h3>
    <div class="sub">${EX.issuer}</div>
    <div class="hero"><div class="lbl">Your offer value</div><div class="val">${rm(o.total)}</div></div>
    <div class="facts">
      <div class="fact"><div class="k">Shares held / eligible</div><div class="v">${o.shares.toLocaleString()}</div></div>
      <div class="fact"><div class="k">Offer price / share</div><div class="v">${rm(o.perShare)}</div></div>
    </div>
    <div class="note"><b>How this offer is set:</b> a fixed return of <b>${Math.round(ROI*100)}% ROI</b> is applied uniformly to all investors; your offer price per share is derived from that ROI. <b>The buyback only proceeds if a majority of investors vote to approve</b> — your vote is one of many.</div>
    <div class="row">
      <button class="b-grow b-danger" onclick="pick('reject')"><i class="ti ti-thumb-down"></i> Reject offer</button>
      <button class="b-grow b-ok" onclick="pick('approve')"><i class="ti ti-thumb-up"></i> Approve offer</button>
    </div>
    <div class="fineprint">One vote only — your choice is final once submitted.</div>
  </div>`;
}
function render(){
  const o = offer(S.inv);
  document.getElementById('who').innerHTML = '<i class="ti ti-user-circle" style="font-size:18px"></i> ' + o.name;
  document.getElementById('belldot').style.display = S.voted[S.inv] ? 'none' : 'block';
  const app = document.getElementById('app');
  if(S.voted[S.inv]){
    const c=S.voted[S.inv];
    app.innerHTML = `<div class="card" style="text-align:center">
      <div class="icon-circ ic-ok"><i class="ti ti-check"></i></div>
      <h3 style="margin-top:12px">Your vote is recorded</h3>
      <div class="sub">You voted <b style="color:${c==='approve'?'var(--ok)':'var(--danger)'}">${c==='approve'?'Approve':'Reject'}</b> on the ${EX.title.toLowerCase()} for ${EX.issuer}.</div>
      <div style="font-size:12px; color:var(--hint); margin-top:6px">Recorded 12 Jun 2026, 3:42pm · ${EX.ref} · ${o.name}</div>
      <div class="note" style="margin-top:16px"><i class="ti ti-lock"></i> This decision is final and cannot be changed. Tabulation is in progress; the outcome depends on the majority of all investors.</div>
    </div>`;
  } else if(S.screen==='popup'){
    app.innerHTML = `<div class="overlay"><div class="modal">
      <div class="icon-circ ic-warn"><i class="ti ti-alert-triangle"></i></div>
      <h3 style="margin-top:12px">Action required</h3>
      <div class="sub">A corporate exercise from <b>${EX.issuer}</b> needs your vote. ${EX.close}.</div>
      <div class="row"><button class="b-grow" onclick="go('dashboard')">Later</button>
      <button class="b-grow b-brand" onclick="go('detail')">Review offer &amp; vote</button></div>
      <div class="fineprint">This popup reappears every login until you vote.</div>
    </div></div>`;
  } else if(S.screen==='dashboard'){
    app.innerHTML = `<div class="alert"><i class="ti ti-alert-triangle"></i>
      <div class="txt"><b>Corporate exercise awaiting your vote</b><div style="font-size:12px">${EX.issuer} · ${EX.close}</div></div>
      <button onclick="go('detail')">Review &amp; vote</button></div>
      <div style="text-align:center; font-size:12px; color:var(--hint); margin-top:12px">(rest of investor dashboard…) — <a class="link" href="javascript:go('popup')">simulate next login</a></div>`;
  } else if(S.screen==='detail'){
    app.innerHTML = detail(o);
  } else if(S.screen==='confirm'){
    const c=S.choice;
    app.innerHTML = `<div class="card" style="text-align:center">
      <h3>Confirm your vote</h3>
      <div class="sub" style="margin-top:6px">You are about to vote <b style="color:${c==='approve'?'var(--ok)':'var(--danger)'}">${c==='approve'?'Approve':'Reject'}</b> on the buyback offer of <b>${rm(o.total)}</b> from ${EX.issuer}.</div>
      <div class="note" style="background:var(--danger-bg); color:var(--danger); margin-top:14px"><i class="ti ti-lock"></i> This is final. You cannot change your vote afterwards.</div>
      <div class="row"><button class="b-grow" onclick="go('detail')">Back</button>
      <button class="b-grow b-brand" onclick="submitVote()">Submit final vote</button></div>
    </div>`;
  }
  document.getElementById('invpills').innerHTML = Object.keys(INV).map(k =>
    `<button class="pill ${S.inv===k?'on':''}" onclick="setInv('${k}')">${INV[k].name.split(' ')[0]}${S.voted[k]?' ✓':''}</button>`).join(' ');
}
function go(s){ S.screen=s; render(); }
function pick(c){ S.choice=c; S.screen='confirm'; render(); }
function submitVote(){ S.voted[S.inv]=S.choice; render(); }
function setInv(k){ S.inv=k; if(!S.voted[k]) S.screen='popup'; render(); }
function reset(){ S.voted={}; S.choice=null; S.screen='popup'; render(); }
render();
</script>
</body>
</html>
