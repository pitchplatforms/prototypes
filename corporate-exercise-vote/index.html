<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pitchIN — Corporate Exercise voting (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.7.0/iconfont/tabler-icons.min.css" />
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --line:#e7e9ed; --line2:#d3d8df;
    --text:#1c2733; --muted:#5b6b7a; --hint:#9aa6b2;
    --brand:#bf2026; --brand-d:#9e1a1f; --brand-bg:#fbeaea;       /* pitchIN red */
    --green:#006837; --green-bg:#e6f1ea;                          /* positive */
    --navy:#0e2b43;                                               /* secondary */
    --warn:#92610a; --warn-bg:#fdf3e2;
    --r:8px; --r-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Poppins','Inter',sans-serif;}
  .wrap{max-width:580px; margin:0 auto; padding:18px 14px 60px;}
  .protonote{font-size:12px; color:var(--hint); margin-bottom:10px;}
  .chrome{display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px;}
  .brand{font-weight:600; color:var(--brand);}
  .brand span{font-weight:400; color:var(--muted); font-size:13px; font-family:'Inter',sans-serif;}
  .chrome-right{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted);}
  .bell{position:relative;}
  .dot{position:absolute; top:-3px; right:-3px; width:8px; height:8px; background:var(--brand); border-radius:50%;}
  #app{margin-top:12px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 22px;}
  .ref{font-size:11px; background:var(--bg); color:var(--muted); padding:3px 9px; border-radius:var(--r); letter-spacing:.02em;}
  h3{margin:0; font-size:19px; font-weight:600; color:var(--navy);}
  .sub{font-size:13px; color:var(--muted);}
  .lead{font-size:14.5px; color:var(--text); margin:12px 0 0;}
  .lead b{font-weight:600;}
  .hero{text-align:center; margin:18px 0; padding:16px; background:var(--green-bg); border-radius:var(--r);}
  .hero .lbl{font-size:12.5px; color:var(--green);}
  .hero .val{font-size:32px; font-weight:600; color:var(--green); font-family:'Poppins',sans-serif; line-height:1.2;}
  .hero .roi{font-size:13px; color:var(--green);}
  .facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .fact{background:var(--bg); border-radius:var(--r); padding:11px 13px;}
  .fact .k{font-size:12px; color:var(--muted);} .fact .v{font-size:16px; font-weight:600; margin-top:2px;}
  .note{font-size:13px; color:var(--muted); background:var(--bg); border-radius:var(--r); padding:11px 13px; margin-top:14px;}
  .note i{color:var(--brand);} .note b{color:var(--text);}
  .row{display:flex; gap:10px; margin-top:16px;}
  button{font:inherit; cursor:pointer; border-radius:var(--r); border:1px solid var(--line2);
    background:var(--surface); color:var(--navy); padding:11px 14px; font-weight:500; transition:.12s;}
  button:hover{background:var(--bg);} button:active{transform:scale(.98);}
  .b-grow{flex:1;}
  .b-ok{background:var(--green); border-color:var(--green); color:#fff;} .b-ok:hover{background:#00582f;}
  .b-reject{border-color:var(--line2); color:var(--navy);} .b-reject:hover{background:var(--bg);}
  .b-brand{background:var(--brand); border-color:var(--brand); color:#fff;} .b-brand:hover{background:var(--brand-d);}
  .fineprint{font-size:11.5px; color:var(--hint); text-align:center; margin-top:12px;}
  .overlay{min-height:380px; background:rgba(14,43,67,.55); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{max-width:430px; width:100%; background:var(--surface); border-radius:var(--r-lg); padding:24px; text-align:center;}
  .icon-circ{width:48px; height:48px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .ic-warn{background:var(--brand-bg); color:var(--brand);} .ic-ok{background:var(--green-bg); color:var(--green);}
  .alert{display:flex; align-items:center; gap:12px; background:var(--brand-bg); border-radius:var(--r-lg); padding:14px 16px; border-left:4px solid var(--brand);}
  .alert i{font-size:20px; color:var(--brand);} .alert .txt{flex:1; font-size:14px; color:var(--navy);}
  .switcher{margin-top:18px; border-top:1px solid var(--line); padding-top:12px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .switcher .lbl{font-size:11px; color:var(--hint);}
  .pill{padding:5px 11px; font-size:12px; border-radius:20px; font-weight:500;}
  .pill.on{border-color:var(--brand); color:var(--brand); background:var(--brand-bg);}
  a.link{color:var(--brand);}
</style>
</head>
<body>
<div class="wrap">
  <div class="protonote"><i class="ti ti-flask"></i> Prototype — mock data, illustrative only. Not connected to live systems.</div>
  <div class="chrome">
    <div class="brand">pitchIN <span>/ my account</span></div>
    <div class="chrome-right">
      <span class="bell"><i class="ti ti-bell" style="font-size:18px"></i><span id="belldot" class="dot"></span></span>
      <span id="who"><i class="ti ti-user-circle" style="font-size:18px"></i> —</span>
    </div>
  </div>
  <div id="app"></div>
  <div class="switcher">
    <span class="lbl">View as investor:</span>
    <span id="invpills"></span>
    <button class="pill" style="margin-left:auto" onclick="reset()"><i class="ti ti-refresh"></i> Reset</button>
  </div>
</div>
<script>
const ROI_PCT = 20;  // fixed total return-on-investment, uniform across all investors (the offer's pricing input)
const EX = {issuer:'Tani AgriTech Sdn Bhd', title:'Share buyback offer', ref:'CE-2026-014', deadline:'30 Jun 2026', close:'Voting closes 30 Jun 2026, 5:00pm', shareType:'Ordinary Shares'};
const INV = {
  aisha: {name:'Aisha Rahman', id:'INV-10231', invested:10000, shares:10000, annualised:11},
  ben:   {name:'Ben Lim',      id:'INV-10876', invested:6000,  shares:5000,  annualised:18},
  chong: {name:'Chong Wei',    id:'INV-11540', invested:50000, shares:40000, annualised:7}
};
const S = {screen:'popup', inv:'aisha', choice:null, voted:{}};
const rm = n => 'RM ' + Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function offer(k){ const v=INV[k]; const total=v.invested*(1+ROI_PCT/100); const price=total/v.shares; return {...v, total, price, roi:ROI_PCT}; }

function detail(o){
  return `<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="ref">${EX.ref}</span>
      <span style="font-size:12px; color:var(--brand)"><i class="ti ti-clock"></i> Closes ${EX.deadline}</span>
    </div>
    <h3 style="margin-top:12px">${EX.issuer} wants to buy back your shares</h3>
    <p class="lead">You invested <b>${rm(o.invested)}</b> in ${EX.issuer} and own <b>${o.shares.toLocaleString()} ${EX.shareType}</b>. The company is offering to buy back <b>all your ${EX.shareType}</b> at <b>${rm(o.price)}</b> per share.</p>
    <div class="hero">
      <div class="lbl">If this offer goes through</div>
      <div class="val">${rm(o.total)}</div>
      <div class="roi">a <b>+${o.roi}% return</b> on your investment (≈${o.annualised}% per year)</div>
    </div>
    <div class="note"><i class="ti ti-users"></i> This buyback only goes ahead if a <b>majority of investors</b> vote to approve it — your vote is one of many.</div>
    <div class="row">
      <button class="b-grow b-reject" onclick="pick('reject')">Reject offer</button>
      <button class="b-grow b-ok" onclick="pick('approve')">Approve offer</button>
    </div>
    <div class="fineprint">You can vote once. Your choice is final.</div>
  </div>`;
}
function render(){
  const o = offer(S.inv);
  document.getElementById('who').innerHTML = '<i class="ti ti-user-circle" style="font-size:18px"></i> ' + o.name;
  document.getElementById('belldot').style.display = S.voted[S.inv] ? 'none' : 'block';
  const app = document.getElementById('app');
  if(S.voted[S.inv]){
    const c=S.voted[S.inv];
    app.innerHTML = `<div class="card" style="text-align:center">
      <div class="icon-circ ic-ok"><i class="ti ti-check"></i></div>
      <h3 style="margin-top:12px">Your vote is recorded</h3>
      <div class="sub">You voted <b style="color:${c==='approve'?'var(--green)':'var(--brand)'}">${c==='approve'?'Approve':'Reject'}</b> on the ${EX.title.toLowerCase()} from ${EX.issuer}.</div>
      <div style="font-size:12px; color:var(--hint); margin-top:6px">Recorded 12 Jun 2026, 3:42pm · ${EX.ref} · ${o.name}</div>
      <div class="note" style="margin-top:16px"><i class="ti ti-lock"></i> This decision is final and cannot be changed. The buyback proceeds only if a majority of investors approve — we'll let you know the outcome.</div>
    </div>`;
  } else if(S.screen==='popup'){
    app.innerHTML = `<div class="overlay"><div class="modal">
      <div class="icon-circ ic-warn"><i class="ti ti-alert-triangle"></i></div>
      <h3 style="margin-top:12px">Action required</h3>
      <div class="sub" style="margin-top:4px">A share buyback offer from <b>${EX.issuer}</b> needs your vote. ${EX.close}.</div>
      <div class="row"><button class="b-grow b-reject" onclick="go('dashboard')">Later</button>
      <button class="b-grow b-brand" onclick="go('detail')">Review offer &amp; vote</button></div>
      <div class="fineprint">This reminder reappears every login until you vote.</div>
    </div></div>`;
  } else if(S.screen==='dashboard'){
    app.innerHTML = `<div class="alert"><i class="ti ti-alert-triangle"></i>
      <div class="txt"><b>Share buyback offer awaiting your vote</b><div style="font-size:12px; color:var(--muted)">${EX.issuer} · ${EX.close}</div></div>
      <button class="b-brand" onclick="go('detail')">Review &amp; vote</button></div>
      <div style="text-align:center; font-size:12px; color:var(--hint); margin-top:12px">(rest of investor dashboard…) — <a class="link" href="javascript:go('popup')">simulate next login</a></div>`;
  } else if(S.screen==='detail'){
    app.innerHTML = detail(o);
  } else if(S.screen==='confirm'){
    const c=S.choice;
    app.innerHTML = `<div class="card" style="text-align:center">
      <h3>Confirm your vote</h3>
      <div class="sub" style="margin-top:8px">You are about to vote <b style="color:${c==='approve'?'var(--green)':'var(--brand)'}">${c==='approve'?'Approve':'Reject'}</b> on ${EX.issuer}'s offer to buy back your shares for <b>${rm(o.total)}</b>.</div>
      <div class="note" style="background:var(--brand-bg); color:var(--brand-d); margin-top:14px"><i class="ti ti-lock" style="color:var(--brand-d)"></i> This is final. You cannot change your vote afterwards.</div>
      <div class="row"><button class="b-grow b-reject" onclick="go('detail')">Back</button>
      <button class="b-grow b-brand" onclick="submitVote()">Submit final vote</button></div>
    </div>`;
  }
  document.getElementById('invpills').innerHTML = Object.keys(INV).map(k =>
    `<button class="pill ${S.inv===k?'on':''}" onclick="setInv('${k}')">${INV[k].name.split(' ')[0]}${S.voted[k]?' ✓':''}</button>`).join(' ');
}
function go(s){ S.screen=s; render(); }
function pick(c){ S.choice=c; S.screen='confirm'; render(); }
function submitVote(){ S.voted[S.inv]=S.choice; render(); }
function setInv(k){ S.inv=k; if(!S.voted[k]) S.screen='popup'; render(); }
function reset(){ S.voted={}; S.choice=null; S.screen='popup'; render(); }
render();
</script>
</body>
</html>
