<!doctype html>
<!--
  PROTOTYPE — Corporate Actions "Share Buyback" end-to-end journey
  Throwaway UI mock for the CTO/QA sharing. NOT production code.

  Reproduces the REAL screens faithfully (same DOM, CSS class names, hex, typography):
    CUSTOMER (PitchinCustomerWeb):
      shared/components/pending-vote-modal            — "Your vote is needed" login popup
      pages/mysec/corporate-action-detail             — the voting screen + confirm-vote modal
      pages/mysec/businesses/market-details           — company page header + tab bar
      .../market-details/announcement                 — Announcements tab + CA feed
    ADMIN (PitchinAdminWeb):
      pages/corporate-actions/corporate-actions-form  — create wizard (details / upload voters)
      pages/corporate-actions/corporate-actions-detail— manage, vote tally, propose outcome
      pages/corporate-actions-approval/...            — superadmin approve creation + publish outcome

  UI only — no backend, no real votes. Data is illustrative (Agroz Group share buyback).
  Open in a browser and step through with the bar at the bottom (or ← / → keys).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pitchIN — Share Buyback voting (full journey mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#006837; --green-tint:#e6f4ec; --green-card-border:#cdeed5; --green-card-bg:#fbfdfb;
    --ink:#1a1a1a; --muted:#6a6a6a; --body:#333; --line:#f0f0f0;
    --red:#c00000; --red-tint:#ffeded; --amber:#edb418; --green-badge:#13b25c; --danger:#d14646;
    --indigo:#3730a3; --indigo-tint:#eef0ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f4f5f7; color:var(--ink); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding-bottom:92px;
  }
  h1,h2,h5,.font-poppins{font-family:'Poppins','Inter',sans-serif;}

  /* ===== sticky app header (chrome + explainer) ===== */
  .appbar{position:sticky; top:0; z-index:20;}
  .topbar{background:#fff; border-bottom:1px solid #eaeaea; display:flex; align-items:center; gap:14px; padding:11px 22px;}
  .topbar img{height:24px;}
  .topbar .tag{font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; letter-spacing:.02em;}
  .tag-pstx{color:var(--green); background:var(--green-tint);}
  .tag-admin{color:var(--red); background:var(--red-tint);}
  .topbar .spacer{flex:1}
  .topbar .avatar{width:32px;height:32px;border-radius:50%;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;}
  .role-chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;}
  .rc-admin{color:var(--red);background:var(--red-tint);}
  .rc-superadmin{color:var(--indigo);background:var(--indigo-tint);}

  /* explainer banner */
  .explainer{display:flex; align-items:flex-start; gap:12px; padding:11px 22px; border-bottom:1px solid #eaeaea;
    background:#fbfbfc;}
  .explainer.acc-investor{border-left:4px solid var(--green);}
  .explainer.acc-admin{border-left:4px solid var(--red);}
  .explainer.acc-superadmin{border-left:4px solid var(--indigo);}
  .explainer .who{flex-shrink:0; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
    padding:5px 10px; border-radius:6px; margin-top:1px;}
  .who-investor{color:var(--green);background:var(--green-tint);}
  .who-admin{color:var(--red);background:var(--red-tint);}
  .who-superadmin{color:var(--indigo);background:var(--indigo-tint);}
  .explainer .ex-text{min-width:0;}
  .explainer .ex-title{font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.3;}
  .explainer .ex-desc{font-size:12.5px; color:#5a6068; line-height:1.5; margin-top:2px;}

  .stage{position:relative;}

  /* ===== buttons ===== */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px; line-height:1; padding:12px 18px; border-radius:8px; border:1px solid transparent; cursor:pointer; transition:filter .12s;}
  .btn:hover{filter:brightness(.97)} .btn:disabled{opacity:.5; cursor:default;}
  .btn-green,.btn-primary{background:var(--green); color:#fff;}
  .btn-green-border{background:#fff; color:var(--green); border-color:var(--green);}
  .btn-grey-border{background:#fff; color:#555; border-color:#d3d3d3;}
  .btn-outline-secondary{background:#fff; color:#5b6470; border-color:#cfd4da;}
  .btn-sm{padding:8px 14px; font-size:13px;}
  .tw-flex-1{flex:1}
  /* admin buttons */
  .btn-admin{background:var(--red); color:#fff;}            /* btn-secondary (admin primary CTA) */
  .btn-admin-light{background:#fff; color:#5b6470; border-color:#cfd4da;}
  .btn-warning{background:var(--amber); color:#fff;}
  .btn-danger{background:var(--danger); color:#fff;}

  /* ===== modals (pvm + confirm) ===== */
  .backdrop{position:fixed; inset:0; background:rgba(20,22,28,.55); z-index:40; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .18s;}
  .backdrop.show{opacity:1; pointer-events:auto;}
  .modal-card{background:#fff; border-radius:14px; width:100%; max-width:420px; box-shadow:0 24px 60px rgba(0,0,0,.28); overflow:hidden; transform:translateY(8px); transition:transform .18s;}
  .backdrop.show .modal-card{transform:translateY(0);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 22px 0;}
  .modal-body{padding:0 22px;}
  .modal-footer{display:flex; padding:8px 22px 4px; gap:10px;}
  .close{background:none;border:none;font-size:24px;line-height:1;color:#9aa0a6;cursor:pointer;padding:0;}
  .pvm-title{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; margin:0;}
  .pvm-title-icon{color:var(--red); display:flex;}
  .pvm-body{padding-top:18px;}
  .pvm-company{display:flex; gap:16px; align-items:center; margin-bottom:16px;}
  .pvm-company-name{font-weight:600; font-size:15px; color:var(--ink); line-height:1.3;}
  .pvm-description{font-size:13.5px; line-height:1.6; color:#555; margin:0 0 12px;}
  .pvm-deadline{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin:0;}
  .pvm-cta{flex:1;}
  .pvm-reminder{text-align:center; font-size:12px; color:var(--muted); margin:14px 22px 18px;}
  .cv-body{padding:28px 24px 22px; text-align:center;}
  .cv-icon{width:48px;height:48px;border-radius:50%; display:flex;align-items:center;justify-content:center; margin:0 auto 16px;}
  .cv-icon.approve{background:#dcfce7; color:#15803d;} .cv-icon.reject{background:#fee2e2; color:#dc2626;}
  .cv-title{font-size:18px; margin:0 0 8px;}
  .cv-desc{color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 20px;}
  .cv-actions{display:flex; gap:12px;}

  /* logo box + green pills (shared) */
  .ca-logo{width:48px;height:48px;border-radius:8px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
  .badge{display:inline-flex;}
  .ca-badge-type,.ca-badge-deadline,.ca-badge-voted{display:inline-flex; align-items:center; gap:4px; color:var(--green); background:var(--green-tint); font-weight:600; font-size:11px; border-radius:999px; padding:4px 10px;}

  /* ===== corporate-action-detail (customer voting screen) ===== */
  .panel-container{max-width:720px; margin:24px auto; background:#fff; border:1px solid #e7e7e7; border-radius:14px; overflow:hidden;}
  .ca-back-link{display:flex; align-items:center; gap:6px; width:100%; background:none; border:none; border-bottom:1px solid var(--line); padding:14px 28px; color:#6b7280; font-size:14px; font-weight:500; cursor:pointer; text-align:left;}
  .ca-back-link:hover{color:#111827;}
  .ca-hero{background:#fff; padding:24px 28px 20px; border-bottom:1px solid var(--line);}
  .ca-hero-row{display:flex; gap:16px; align-items:flex-start;}
  .flex-fill{flex:1;}
  .badge-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .ca-title{font-size:20px; line-height:1.3; color:var(--ink); margin:0 0 6px;}
  .ca-subtitle{font-size:13.5px; margin:0; line-height:1.55; color:var(--muted);}
  .ca-body{padding:22px 28px;}
  .ca-lead{font-size:14.5px; line-height:1.65; color:var(--body); margin:0 0 24px;} .ca-lead strong{color:var(--ink);}
  .ca-payout-card{border:1px solid var(--green-card-border); background:var(--green-card-bg); border-radius:10px; padding:18px; text-align:center; margin-bottom:24px;}
  .ca-payout-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:8px;}
  .ca-payout-amount{font-weight:700; font-size:38px; color:var(--green); line-height:1; font-family:'Poppins',sans-serif;}
  .ca-payout-returns{border-top:1px solid #d8eada; margin-top:14px; padding-top:12px; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;}
  .text-muted{color:var(--muted);} .ca-divider{color:var(--green-card-border);}
  .vote-heading{font-size:16px; margin:0 0 10px;}
  .ca-note{border-left:3px solid var(--green); background:#f6fbfb; border-radius:0 8px 8px 0; padding:13px 16px; font-size:13px; line-height:1.6; color:#4a5a5a; margin-bottom:16px; display:flex; gap:8px;}
  .vote-actions{display:flex; gap:12px;}
  @media (max-width:560px){ .vote-actions{flex-direction:column;} }
  .ca-voted-card{border:1px solid var(--green-card-border); background:#f6fbfb; border-radius:10px; padding:18px;}
  .ca-voted-card.mt{margin-top:16px;}
  .ca-voted-top{display:flex; justify-content:space-between; align-items:center;}
  .ca-voted-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .ca-voted-value{font-weight:600; font-size:18px; margin-top:4px; display:flex; align-items:center; gap:6px;}
  .text-success{color:var(--green);} .text-danger{color:#c0392b;}
  .ca-voted-note{font-size:12.5px; margin:12px 0 0; color:var(--muted); line-height:1.6;}

  /* ===== company page (market-details) ===== */
  .md-page{max-width:920px; margin:20px auto; padding:0 18px;}
  .md-header{display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:22px;}
  .md-prodbadge{display:inline-block; font-size:11px; font-weight:800; letter-spacing:.03em; color:#fff; background:#1a1a1a; padding:4px 9px; border-radius:5px; margin-bottom:14px;}
  .md-id{display:flex; gap:16px; align-items:center;}
  .md-logo{width:80px;height:80px;border-radius:5px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.15); flex-shrink:0;}
  .md-name{font-size:24px; font-weight:700; margin:0; font-family:'Poppins',sans-serif;}
  .md-tagline{color:var(--muted); font-size:14px; margin:4px 0 0;}
  .md-watch{display:inline-flex;align-items:center;gap:7px; border:1px solid #d3d3d3; background:#fff; color:#444; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  .md-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .md-tag{font-size:12px; color:#5b6470; background:#f0f1f3; border-radius:999px; padding:4px 12px;}
  .md-tabbar{border-bottom:1px solid #e7e7e7; margin-bottom:24px; overflow-x:auto;}
  .md-tabs{display:flex; gap:2.6rem; list-style:none; margin:0; padding:0; min-width:max-content;}
  .md-tabs li{padding-bottom:12px;}
  .md-tabs a{font-size:15px; font-weight:700; color:rgba(0,0,0,.5); text-decoration:none; cursor:pointer; white-space:nowrap;}
  .md-tabs li.active{border-bottom:3px solid var(--red);}
  .md-tabs li.active a{color:var(--red);}
  .module-title{font-size:18px; font-weight:700; margin:0 0 16px; font-family:'Poppins',sans-serif;}

  /* CA feed card (announcement.component) */
  .ca-feed-title{font-size:1rem; font-weight:700; color:#111827; margin:0 0 14px; font-family:'Poppins',sans-serif;}
  .ca-feed-card{padding:16px 20px; border-radius:10px; border:1px solid rgba(0,0,0,.08); box-shadow:0 1px 4px rgba(0,0,0,.05); background:#fff; margin-bottom:14px;}
  .ca-feed-card--pending{border-left:3px solid #2563eb; background:#f0f7ff;}
  .feed-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .feed-badges{display:flex; gap:8px; flex-wrap:wrap;}
  .feed-card .badge{font-size:11px; border-radius:4px; padding:3px 8px; display:inline-flex; align-items:center; gap:4px;}
  .fb-type{background:#e0e7ff; color:#3730a3;} .fb-vote{background:#fef3c7; color:#92400e;}
  .fb-approved{background:#d1fae5; color:#065f46;} .fb-rejected{background:#fee2e2; color:#991b1b;}
  .ca-feed-company{font-weight:700; font-size:.95rem; color:#111827; margin-bottom:4px;}
  .feed-desc{font-size:13px; color:var(--muted); margin:0 0 14px; line-height:1.5;}
  .feed-close{font-size:12.5px; color:var(--muted); white-space:nowrap;}
  /* normal announcement timeline */
  .timeline{margin-top:26px; border-top:1px solid #eee; padding-top:20px;}
  .tl-item{display:flex; gap:18px; margin-bottom:22px;}
  .tl-left{width:96px; flex-shrink:0;} .tl-date{color:var(--green); font-weight:700; font-size:13px;} .tl-time{color:var(--muted); font-size:12px;}
  .tl-card{flex:1; background:#fff; border:1px solid #ececec; border-radius:10px; padding:16px 18px;}
  .tl-title-row{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:6px;}
  .tl-title{font-weight:700; font-size:15px; color:#111;}
  .tl-badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .tl-badge.issuer{background:#eef2ff; color:#3730a3;}
  .tl-body{font-size:13.5px; color:#555; line-height:1.6;}
  .tl-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; border-top:1px solid #f1f1f1; padding-top:10px; font-size:12.5px; color:var(--muted);}
  .read-more{color:var(--red); font-weight:600; background:none; border:none; cursor:pointer; font-size:12.5px;}

  /* ===== admin shell ===== */
  .adm{max-width:960px; margin:22px auto; padding:0 18px;}
  .adm-crumb{font-size:13px; color:var(--muted); margin-bottom:6px;} .adm-crumb a{color:var(--muted); text-decoration:none;} .adm-crumb .sep{margin:0 6px;}
  .adm-title{font-size:26px; font-weight:800; margin:0 0 20px; display:flex; align-items:center; gap:12px; font-family:'Poppins',sans-serif;}
  .adm-actions{margin-left:auto; display:flex; gap:10px;}
  .adm-steps{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px; font-size:13px; font-weight:600;}
  .adm-steps .st{color:#b0b4ba;} .adm-steps .st.active{color:var(--red);} .adm-steps .sep{color:#cfd2d6;}
  .adm-card{background:#fff; border:1px solid #e7e7e7; border-radius:10px; margin-bottom:18px;}
  .adm-card-head{padding:13px 18px; border-bottom:1px solid #eee; font-weight:700; font-size:14px;}
  .adm-card-body{padding:18px;}
  .adm-h2{font-size:20px; font-weight:800; margin:0 0 16px; font-family:'Poppins',sans-serif;}
  .alert{border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:16px;}
  .alert-info{background:#eaf4fd; color:#1b5a86; border:1px solid #cfe6f8;}
  .alert-success{background:#e8f8ef; color:#1a7a45; border:1px solid #c7ebd5;}
  .alert-warning{background:#fef6e0; color:#8a6400; border:1px solid #f6e4ad;}
  .fg{margin-bottom:16px;} .fg-row{display:flex; gap:16px; flex-wrap:wrap;} .fg-row .fg{flex:1; min-width:200px;}
  .input-label{font-size:13px; font-weight:600; color:#3b4149; margin-bottom:6px;}
  .req{color:var(--danger);}
  .form-control{width:100%; border:1px solid #d6dadf; border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; background:#fff; color:#222;}
  .form-control[readonly], .form-control.disabledish{background:#f7f8f9; color:#555;}
  .form-hint{font-size:12px; color:var(--muted); margin-top:5px;} .form-sel{color:#222;}
  .selected-note{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .adm-foot{display:flex; justify-content:flex-end; gap:12px; margin-top:8px;}
  .adm-foot.split{justify-content:space-between;}
  /* admin tables */
  .adm-table{width:100%; border-collapse:collapse; font-size:13px;}
  .adm-table th{text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid #eee;}
  .adm-table td{padding:9px 10px; border-bottom:1px solid #f3f3f3; color:#333;}
  .adm-table tr:last-child td{border-bottom:none;}
  .pill{display:inline-block; font-size:11px; font-weight:700; color:#fff; padding:3px 10px; border-radius:999px;}
  .pill.pending{background:var(--amber);} .pill.approved{background:var(--green-badge);} .pill.stop{background:var(--danger);} .pill.default{background:rgba(0,0,0,.78);}
  .pill-soft{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px;}
  .pill-soft.matched{background:#e8f8ef; color:#1a7a45;}
  /* vote tally */
  .tally{display:flex; gap:10px; flex-wrap:wrap; text-align:center;}
  .tally .cell{flex:1; min-width:90px; padding:6px;}
  .tally .num{font-size:26px; font-weight:800; font-family:'Poppins',sans-serif;}
  .tally .lbl{font-size:11px; color:#7a8089; margin-top:2px;}
  .kv{font-size:13.5px; color:#333; margin:0 0 7px;} .kv strong{color:#111;}

  /* ===== demo controller ===== */
  .demobar{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:60; background:#111418; color:#fff; border-radius:14px; padding:9px 12px; display:flex; align-items:center; gap:12px; box-shadow:0 12px 36px rgba(0,0,0,.35); font-size:13px; max-width:calc(100% - 24px);}
  .demobar .step-label{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px;}
  .demobar .step-num{color:#9aa3ad; font-weight:500; margin-right:4px;}
  .dots{display:flex; gap:5px;} .dot{width:7px;height:7px;border-radius:50%; background:#3a4048; cursor:pointer; border:none; padding:0;}
  .dot.investor.active{background:var(--green-badge);} .dot.admin.active{background:#e26060;} .dot.superadmin.active{background:#7c83e6;}
  .dot.active{background:#fff;}
  .dbtn{background:#262b31; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; font-size:13px;}
  .dbtn:hover{background:#30363d;} .dbtn:disabled{opacity:.4; cursor:default;} .dbtn.primary{background:var(--green);}
  @media (max-width:640px){ .demobar .step-label{display:none;} }
</style>
</head>
<body>

  <div class="appbar">
    <div class="topbar" id="topbar"></div>
    <div class="explainer" id="explainer"></div>
  </div>

  <div class="stage" id="stage"></div>
  <div class="backdrop" id="backdrop"><div id="modalSlot"></div></div>

  <div class="demobar">
    <button class="dbtn" id="prevBtn">‹ Back</button>
    <div class="dots" id="dots"></div>
    <span class="step-label"><span class="step-num" id="stepNum"></span><span id="stepLabel"></span></span>
    <button class="dbtn primary" id="nextBtn">Next ›</button>
    <button class="dbtn" id="restartBtn" title="Restart">↺</button>
  </div>

<script>
/* ---------- demo data ---------- */
const D = {
  company:'Agroz Group', ticker:'AGRO', initials:'AG', type:'Share Buyback', typeLower:'share buyback',
  tagline:'Indoor vertical farming for a food-secure future',
  amountInvested:'5,000.00', sharesHeld:'2,500', shareType:'Ordinary',
  pricePerShare:'2.40', payout:'6,000.00', roi:'20.0', annual:'9.5',
  opens:'17 Jun 2026', closes:'30 Jun 2026', closesShort:'30 Jun', voterCount:5,
  disclaimer:'pitchIN holds these shares for you as nominee and votes on your behalf based on the majority of investor instructions it receives.'
};
const VOTERS = [
  {id:'INV-10231', name:'Aisyah binti Rahman', shares:'2,500', payout:'6,000.00'},
  {id:'INV-10844', name:'Tan Wei Ming',        shares:'1,000', payout:'2,400.00'},
  {id:'INV-11002', name:'Kumar A/L Suresh',    shares:'800',   payout:'1,920.00'},
  {id:'INV-11457', name:'Nurul Huda',          shares:'3,200', payout:'7,680.00'},
  {id:'INV-12120', name:'Lim Mei Ling',        shares:'500',   payout:'1,200.00'},
];
const TALLY = {approve:3, reject:1, votesCast:4, notVoted:1, totalEligible:5};

function screenDetail(state){
  const heroBadges = `<span class="badge ca-badge-type">${I.grid} ${D.type}</span>` + (
    state==='prevote'
      ? `<span class="badge ca-badge-deadline">${I.cal} Closes ${D.closes}</span>`
      : `<span class="badge ca-badge-voted">${I.check} You voted</span>`);

  let voteBlock = state==='prevote' ? `
      <h2 class="vote-heading">Your vote</h2>
      <div class="ca-note">${I.info}<span>${D.disclaimer} Once you confirm, your vote is final and cannot be changed.</span></div>
      <div class="vote-actions">
        <button class="btn btn-green tw-flex-1" onclick="goTo(IDX.confirm)">${I.check} Approve the offer</button>
        <button class="btn btn-green-border tw-flex-1" onclick="goTo(IDX.confirm)">${I.x} Reject the offer</button>
      </div>` : `
      <div class="ca-voted-card">
        <div class="ca-voted-top">
          <div><div class="ca-voted-label">Your recorded vote</div>
            <div class="ca-voted-value text-success">${I.checkBig} Approved</div></div>
          <span class="badge ca-badge-voted">${I.check} Recorded</span>
        </div>
        <p class="ca-voted-note">Your vote has been recorded. Thank you. The result will appear here once voting closes — you'll only ever see your own vote and the final outcome, never how others voted.</p>
      </div>`;

  let outcomeBlock = state==='outcome' ? `
      <div class="ca-voted-card mt">
        <div class="ca-voted-top">
          <div><div class="ca-voted-label">Final Outcome</div>
            <div class="ca-voted-value text-success">${I.checkBig} Approved</div></div>
          <span class="badge ca-badge-voted">${I.mega} Official Result</span>
        </div>
        <p class="ca-voted-note">The buyback was approved by shareholders. pitchIN will process the sale of the shares it holds for you and credit RM ${D.payout} to your wallet within 5 business days.</p>
        <p class="ca-voted-note">Voting closed ${D.closes}.</p>
      </div>` : '';

  return `<div class="panel-container">
    <button class="ca-back-link" onclick="goTo(IDX.feed)">${I.chev} See all announcements</button>
    <div class="ca-hero"><div class="ca-hero-row">
      <div class="ca-logo">${D.initials}</div>
      <div class="flex-fill">
        <div class="badge-row">${heroBadges}</div>
        <h1 class="ca-title">${D.company} is doing a ${D.type}</h1>
        <p class="ca-subtitle">pitchIN holds these shares for you as nominee. Shareholders are voting on whether the buyback goes ahead.</p>
      </div></div></div>
    <div class="ca-body">
      <p class="ca-lead">You invested <strong>RM ${D.amountInvested}</strong> and hold <strong>${D.sharesHeld} ${D.shareType} shares</strong> in ${D.company}. The company is offering to buy back your shares at <strong>RM ${D.pricePerShare} per share</strong>.</p>
      <div class="ca-payout-card">
        <div class="ca-payout-label">If the buyback goes ahead, you would receive</div>
        <div class="ca-payout-amount">RM ${D.payout}</div>
        <div class="ca-payout-returns">
          <span class="text-muted">Total return</span><strong class="text-muted">+${D.roi}%</strong>
          <span class="ca-divider">|</span>
          <span class="text-muted">Return per year</span><strong class="text-muted">+${D.annual}%</strong>
        </div></div>
      ${voteBlock}${outcomeBlock}
    </div></div>`;
}

    chrome:chromeCustomer, backdrop:()=>screenDetail('voted') },

  { key:'admPropose', app:'admin', role:'admin', label:'Admin — tally & propose result',
    who:'Admin', acc:'admin', exTitle:'After voting closes, the admin proposes the result',
    exDesc:'The admin reviews the vote tally and proposes the outcome (Approved) — but cannot publish it alone.',
    chrome:()=>chromeAdmin('admin'), backdrop:screenAdminPropose },

  { key:'saPublish', app:'admin', role:'superadmin', label:'Superadmin — publish the result',
    who:'Superadmin', acc:'superadmin', exTitle:'A superadmin reviews and publishes the official result',
    exDesc:'Two-person rule again: one proposes, another approves. The superadmin publishes the outcome, which then becomes visible to investors.',
    chrome:()=>chromeAdmin('superadmin'), backdrop:screenSaPublish },

  { key:'outcome', app:'customer', role:'investor', label:'Investor — outcome published',
    who:'Investor', acc:'investor', exTitle:'The investor sees the official result and payout',
    exDesc:'The published outcome and the amount to be credited now appear on the offer page.',
    chrome:chromeCustomer, backdrop:()=>screenDetail('outcome') },

  { key:'feed', app:'customer', role:'investor', label:'Investor — company Announcements tab',
    who:'Investor', acc:'investor', exTitle:'The result also shows on the company page',
    exDesc:'On the company\'s page, under the Announcements tab, the corporate action appears with the investor\'s recorded vote.',
    chrome:chromeCustomer, backdrop:screenCompanyPage },
];

/* index lookup by key (used inside templates for navigation) */
const IDX = {}; STEPS.forEach((s,i)=>IDX[s.key]=i);

let cur = 0;

function render(){
  const s = STEPS[cur];
  document.getElementById('topbar').innerHTML = s.chrome();
  const ex = document.getElementById('explainer');
  ex.className = 'explainer acc-'+s.acc;
  ex.innerHTML = `<span class="who who-${s.acc}">${s.who}</span>
    <div class="ex-text"><div class="ex-title">${s.exTitle}</div><div class="ex-desc">${s.exDesc}</div></div>`;
  document.getElementById('stage').innerHTML = s.backdrop();
  const bd = document.getElementById('backdrop');
  if(s.modal){ document.getElementById('modalSlot').innerHTML = s.modal(); bd.classList.add('show'); }
  else { bd.classList.remove('show'); setTimeout(()=>{ if(!STEPS[cur].modal) document.getElementById('modalSlot').innerHTML=''; },180); }
  document.getElementById('stepNum').textContent = (cur+1)+'/'+STEPS.length;
  document.getElementById('stepLabel').textContent = s.label;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===STEPS.length-1;
  document.querySelectorAll('.dot').forEach((d,i)=>{ d.classList.toggle('active', i===cur); });
  window.scrollTo({top:0, behavior:'smooth'});
}

function goTo(i){ cur = Math.max(0, Math.min(STEPS.length-1, i)); render(); }
function next(){ if(cur<STEPS.length-1) goTo(cur+1); }
function prev(){ if(cur>0) goTo(cur-1); }
function closeModal(){ document.getElementById('backdrop').classList.remove('show'); }

const dotsEl = document.getElementById('dots');
STEPS.forEach((s,i)=>{ const b=document.createElement('button'); b.className='dot '+s.acc; b.title=s.label; b.onclick=()=>goTo(i); dotsEl.appendChild(b); });
document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;
document.getElementById('restartBtn').onclick = ()=>goTo(0);
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); });

render();
</script>
</body>
</html>
