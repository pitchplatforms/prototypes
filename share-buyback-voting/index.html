<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pitchIN — Share Buyback Voting (guided walkthrough)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#BF2026; --red-dark:#7D1F23; --red-light:#FEE2E3; --red-lightest:#fff2f2;
    --green:#006927; --green-light:#0A994A; --green-lightest:#C2F0CA;
    --blue:#1A1847; --warn:#E18437; --warn-dark:#AE4F20;
    --ink:#333; --body:#6a6a6a; --divider:#e7e7e7;
    --bg-soft:#faf9f8; --font-head:'Poppins',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
    --r-lg:10px; --r-xl:14px; --shadow:0 10px 40px -8px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--bg-soft);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* top bar */
  header{background:#fff;border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:20}
  header .wrap{display:flex;align-items:center;gap:14px;padding:13px 22px;flex-wrap:wrap}
  header img{height:26px}
  .htitle{font-family:var(--font-head);font-weight:600;font-size:1rem;color:var(--ink)}
  .htitle small{display:block;font-family:var(--font-body);font-weight:400;font-size:.78rem;color:var(--body)}
  .pill{margin-left:auto;background:var(--red-lightest);color:var(--red-dark);border:1px solid var(--red-light);border-radius:999px;padding:5px 12px;font-size:.74rem;font-weight:600;font-family:var(--font-head)}

  /* progress */
  .progress{background:#fff;border-bottom:1px solid var(--divider)}
  .progress .wrap{padding:10px 22px}
  .ptrack{height:6px;background:#eee;border-radius:999px;overflow:hidden}
  .pfill{height:100%;background:linear-gradient(90deg,var(--red-dark),var(--red));border-radius:999px;transition:width .25s ease}
  .pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:.78rem;color:var(--body)}
  .pmeta b{font-family:var(--font-head);color:var(--ink)}

  /* stage */
  main .wrap{display:grid;grid-template-columns:1.55fr 1fr;gap:26px;padding:26px 22px 16px;align-items:start}
  @media(max-width:880px){main .wrap{grid-template-columns:1fr;gap:18px}}

  .shot{background:#fff;border:1px solid var(--divider);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
  .chrome{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#f3f3f4;border-bottom:1px solid var(--divider)}
  .chrome .d{width:11px;height:11px;border-radius:999px;background:#d9d9dc}
  .chrome .d:nth-child(1){background:#ff5f57}.chrome .d:nth-child(2){background:#febc2e}.chrome .d:nth-child(3){background:#28c840}
  .chrome .url{margin-left:8px;font-size:.72rem;color:#8a8a8a;background:#fff;border:1px solid #e3e3e6;border-radius:6px;padding:3px 10px;font-family:ui-monospace,Menlo,monospace}
  .shot img{display:block;width:100%;height:auto;background:#fff}

  /* explainer */
  .panel{background:#fff;border:1px solid var(--divider);border-left:4px solid var(--red);border-radius:var(--r-lg);padding:20px 22px;position:sticky;top:120px}
  @media(max-width:880px){.panel{position:static}}
  .role{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-head);font-weight:700;font-size:.72rem;border-radius:999px;padding:4px 12px;text-transform:uppercase;letter-spacing:.04em}
  .rc-admin{background:var(--red-lightest);color:var(--red-dark)}
  .rc-superadmin{background:#e9e8f3;color:var(--blue)}
  .rc-investor{background:var(--green-lightest);color:var(--green)}
  .panel h2{font-size:1.32rem;margin:13px 0 8px;line-height:1.25;color:var(--ink)}
  .panel p{margin:0;color:#3f3f3f;font-size:.98rem;line-height:1.6}
  .lc{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--body)}
  .lc .state{font-family:var(--font-head);font-weight:600;border-radius:999px;padding:4px 11px;font-size:.78rem;background:#f3f3f4;color:#555;border:1px solid var(--divider)}
  .lc .state.open{background:var(--green-lightest);color:var(--green);border-color:var(--green)}
  .lc .state.pub{background:var(--red-lightest);color:var(--red-dark);border-color:var(--red-light)}

  /* controls */
  .controls{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(250,249,248,0),var(--bg-soft) 38%);padding:14px 0 10px}
  .controls .wrap{display:flex;align-items:center;gap:14px}
  .btn{font-family:var(--font-head);font-weight:600;font-size:.92rem;padding:11px 20px;border-radius:var(--r-lg);border:1.5px solid var(--red-light);background:#fff;color:var(--red);cursor:pointer;transition:.08s}
  .btn:hover:not(:disabled){background:var(--red-lightest)}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.primary:hover:not(:disabled){background:var(--red-dark)}
  .btn:disabled{opacity:.4;cursor:default}
  .dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 auto}
  .dot{width:10px;height:10px;border-radius:999px;background:#dcdcdf;border:none;cursor:pointer;padding:0}
  .dot.on{transform:scale(1.25)}
  .dot.admin.on{background:var(--red)} .dot.superadmin.on{background:var(--blue)} .dot.investor.on{background:var(--green)}
  .hint{font-size:.74rem;color:var(--body);text-align:center;padding:4px 0 22px}
  kbd{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--divider);border-radius:4px;padding:1px 6px;font-size:.72rem}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img src="pitchin_logo.svg" alt="pitchIN" onerror="this.style.display='none'">
    <div class="htitle">Share Buyback — Voting Journey<small>Guided walkthrough · real product screens</small></div>
    <span class="pill">Sample data · click through</span>
  </div>
</header>

<div class="progress">
  <div class="wrap">
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    <div class="pmeta"><span>Step <b id="cur">1</b> of <b id="total">13</b></span><span id="phase">Admin creates the buyback</span></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="shot">
      <div class="chrome"><span class="d"></span><span class="d"></span><span class="d"></span><span class="url" id="url">app.pitchin.my</span></div>
      <img id="shotimg" src="" alt="">
    </div>
    <aside class="panel">
      <span class="role" id="role">Admin</span>
      <h2 id="title"></h2>
      <p id="body"></p>
      <div class="lc"><span>State:</span><span class="state" id="state">—</span></div>
    </aside>
  </div>
</main>

<div class="controls">
  <div class="wrap">
    <button class="btn" id="prev">← Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="next">Next →</button>
  </div>
</div>
<p class="hint">Use the buttons, the dots, or your <kbd>←</kbd> <kbd>→</kbd> arrow keys.</p>

<script>
const STEPS = [
  {img:'admin-ca-list.png', role:'admin', url:'admin.pitchin.my/corporate-actions', phase:'Admin opens Corporate Actions',
   title:'The Corporate Actions dashboard', state:'', body:'Admins run every share buyback from one place. Let’s create a new one.'},
  {img:'admin-create-wizard-step1.png', role:'admin', url:'admin.pitchin.my/corporate-actions/new', phase:'Create the buyback',
   title:'Create the buyback (1 of 3)', state:'Draft', body:'The admin picks the company and sets the voting window. pitchIN holds the shares as nominee, so it runs the vote on investors’ behalf.'},
  {img:'admin-create-wizard-upload-voters.png', role:'admin', url:'admin.pitchin.my/corporate-actions/new', phase:'Upload the voters',
   title:'Upload the eligible voters', state:'Draft', body:'An Excel list, matched to shareholders by investor ID — with each investor’s buyback price, payout and return.'},
  {img:'superadmin-approval-queue.png', role:'superadmin', url:'admin.pitchin.my/approvals', phase:'Waiting for approval',
   title:'Waiting for a second approval', state:'Pending', body:'A second pair of eyes. The admin who created the action cannot approve their own — maker is never the checker.'},
  {img:'superadmin-approval-detail.png', role:'superadmin', url:'admin.pitchin.my/approvals/detail', phase:'Approve → voting opens',
   title:'Approve to open voting', state:'Pending', body:'The superadmin reviews the details and the voter roster, then approves. Voting opens for investors.'},
  {img:'customer-pending-vote-modal.png', role:'investor', url:'app.pitchin.my', phase:'Investors are prompted',
   title:'Investors are prompted to vote', state:'Open', body:'Eligible investors get a persistent pop-up the moment they log in — impossible to miss.'},
  {img:'customer-vote-detail-payout.png', role:'investor', url:'app.pitchin.my/corporate-action', phase:'See payout, cast vote',
   title:'See your payout, cast your vote', state:'Open', body:'Each investor sees only their own holdings and what they’d receive — then votes Approve or Reject.'},
  {img:'customer-vote-confirm-modal.png', role:'investor', url:'app.pitchin.my/corporate-action', phase:'Confirm the vote',
   title:'Confirm the vote', state:'Open', body:'A final confirmation — the vote is final once submitted, so there are no accidental clicks.'},
  {img:'customer-vote-recorded.png', role:'investor', url:'app.pitchin.my/corporate-action', phase:'Vote recorded',
   title:'Vote recorded', state:'Open', body:'The investor’s choice is saved and tied to their shareholder record — always in sync with the platform.'},
  {img:'admin-detail-vote-tally.png', role:'admin', url:'admin.pitchin.my/corporate-actions/detail', phase:'Running tally (admin-only)',
   title:'Watch the running tally', state:'Closed', body:'The admin sees live results and proposes an outcome. Investors never see these numbers — it stays admin-only.'},
  {img:'superadmin-publish-outcome.png', role:'superadmin', url:'admin.pitchin.my/corporate-actions/detail', phase:'Publish the outcome',
   title:'Publish the official outcome', state:'Closed', body:'Maker is never the checker again: the superadmin publishes the official result.'},
  {img:'customer-final-outcome-published.png', role:'investor', url:'app.pitchin.my/corporate-action', phase:'Investors see the result',
   title:'Investors see the official result', state:'Published', body:'The published outcome appears for investors — transparent and on the record.'},
  {img:'customer-announcement-tab-feed.png', role:'investor', url:'app.pitchin.my/market', phase:'On the Announcements tab',
   title:'On the company’s Announcements tab', state:'Published', body:'The result lives on the company counter’s Announcements feed, alongside other corporate news.'},
];
const ROLE_LABEL = {admin:'Admin', superadmin:'Superadmin', investor:'Investor'};
const STATE_CLASS = {Open:'open', Published:'pub'};
const ACCENT = {admin:'var(--red)', superadmin:'var(--blue)', investor:'var(--green)'};
let i = 0;

const $ = id => document.getElementById(id);
const dotsEl = $('dots');
STEPS.forEach((s,idx)=>{ const b=document.createElement('button'); b.className='dot '+s.role; b.title='Step '+(idx+1); b.onclick=()=>go(idx); dotsEl.appendChild(b); });
$('total').textContent = STEPS.length;
STEPS.forEach(s=>{ const im=new Image(); im.src='screenshots/'+s.img; }); // preload

function render(){
  const s = STEPS[i];
  $('shotimg').src = 'screenshots/'+s.img;
  $('shotimg').alt = s.title;
  $('url').textContent = s.url;
  const role = $('role'); role.textContent = ROLE_LABEL[s.role]; role.className = 'role rc-'+s.role;
  $('title').textContent = s.title;
  $('body').textContent = s.body;
  const st = $('state'); st.textContent = s.state || '—'; st.className = 'state '+(STATE_CLASS[s.state]||'');
  $('cur').textContent = i+1;
  $('phase').textContent = s.phase;
  $('pfill').style.width = ((i+1)/STEPS.length*100)+'%';
  $('prev').disabled = i===0;
  $('next').textContent = i===STEPS.length-1 ? 'Done ✓' : 'Next →';
  [...dotsEl.children].forEach((d,idx)=>d.classList.toggle('on', idx===i));
  document.querySelector('.panel').style.borderLeftColor = ACCENT[s.role];
}
function go(n){ i = Math.max(0, Math.min(STEPS.length-1, n)); render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('prev').onclick = ()=>go(i-1);
$('next').onclick = ()=>go(i+1);
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') go(i+1); if(e.key==='ArrowLeft') go(i-1); });
render();
</script>
</body>
</html>
